  - { id: nl-b2-work-t08-q2, type: mc, question: "Wie kan niet thuiswerken?", options: ["Wie ploegenwerk doet of klanten ontvangt.", "Wie minder dan vijf jaar in het bedrijf werkt.", "Wie maaltijdcheques krijgt."], correct: 0 }
