questions:
  - { id: nl-b2-work-t01-q1, type: summary, options: ["Een bedrijf zoekt een teamleider voor zijn magazijn en beschrijft de taken, het profiel en wat het biedt.", "Een bedrijf zoekt chauffeurs die Frans spreken.", "Een teamleider vertelt waarom hij zijn job in het magazijn verlaat."], correct: 0 }
  - { id: nl-b2-work-t01-q2, type: mc, question: "Wat is geen vereiste voor de job?", options: ["Een diploma hoger onderwijs.", "Ervaring in een magazijn of in de logistiek.", "Ervaring met het leiden van een team."], correct: 0 }
  - { id: nl-b2-work-t01-q3, type: true_false_notgiven, statement: "De teamleider overlegt elke week met de chauffeurs.", answer: true }
  - { id: nl-b2-work-t01-q4, type: true_false_notgiven, statement: "De teamleider krijgt eerst een tijdelijk contract.", answer: false }
