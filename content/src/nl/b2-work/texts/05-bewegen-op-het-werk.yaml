  extra:
    - { id: nl-b2-work-t05-x1, target: "Daarom is sporten na het werk genoeg.", native: { en: "That is why doing sport after work is enough." } }
questions:
  - { id: nl-b2-work-t05-q1, type: summary, options: ["Lang stilzitten is slecht voor werknemers en werkgevers, en met eenvoudige tips en een goede werkpost kun je meer bewegen.", "Werknemers moeten na het werk meer sporten.", "Het bedrijf verbiedt vergaderingen van meer dan een uur."], correct: 0 }
  - { id: nl-b2-work-t05-q2, type: mc, question: "Waarom is lang zitten ook een probleem voor de werkgever?", options: ["Rugklachten zijn een belangrijke oorzaak van verzuim.", "Bureaustoelen zijn duur.", "Werknemers willen niet meer vergaderen."], correct: 0 }
  - { id: nl-b2-work-t05-q3, type: true_false_notgiven, statement: "Ook wie na het werk sport, kan problemen krijgen door lang stil te zitten.", answer: true }
  - { id: nl-b2-work-t05-q4, type: true_false_notgiven, statement: "De staande bureaus worden bijna nooit gebruikt.", answer: false }
  - { id: nl-b2-work-t05-q5, type: true_false_notgiven, statement: "Het bedrijf geeft elke werknemer een gratis abonnement voor de sportclub.", answer: not_given }
  - { id: nl-b2-work-t05-q6, type: match_heading, paragraph: 3, options: ["Tips om meer te bewegen", "De gevolgen voor het bedrijf", "Hoe je je bureaustoel instelt"], correct: 0 }
