  - { word: ontbrekende, native: { en: "missing (ontbreken)" } }
  - { word: aanrekent, native: { en: "charges (aanrekenen, Belgian)" } }
  - { word: leveringsbon, native: { en: "delivery note" } }
  - { word: zaakvoerder, native: { en: "manager, managing director (Belgian)" } }
items: [nl.aanleiding, nl.ontvangst, nl.in-bijlage, nl.geacht]
questions:
  - { id: nl-b2-work-t03-q1, type: summary, options: ["Een zaakvoerder klaagt bij haar leverancier over een levering met te weinig en slechte groenten en vraagt een oplossing.", "Een zaakvoerder bestelt nieuwe groenten voor een buffet.", "Een leverancier biedt een restaurant zijn verontschuldigingen aan voor een levering die te laat kwam."], correct: 0 }
  - { id: nl-b2-work-t03-q2, type: mc, question: "Wat vraagt Els Willems aan de leverancier?", options: ["De ontbrekende tomaten en nieuwe sla leveren en de slechte sla niet aanrekenen.", "Een nieuwe chauffeur sturen.", "Het hele bedrag van de levering terugbetalen."], correct: 0 }
  - { id: nl-b2-work-t03-q3, type: true_false_notgiven, statement: "Het restaurant werkt al vijf jaar met de leverancier samen.", answer: true }
  - { id: nl-b2-work-t03-q4, type: true_false_notgiven, statement: "De chauffeur loste het probleem meteen op.", answer: false }
  - { id: nl-b2-work-t03-q5, type: true_false_notgiven, statement: "Het restaurant heeft dertig tafels.", answer: not_given }
  - { id: nl-b2-work-t03-q6, type: match_heading, paragraph: 3, options: ["De gevolgen voor het restaurant", "Wat er fout was aan de levering", "Wat het restaurant vraagt"], correct: 0 }
