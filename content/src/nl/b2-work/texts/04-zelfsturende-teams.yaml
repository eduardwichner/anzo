questions:
  - { id: nl-b2-work-t04-q1, type: summary, options: ["Een woonzorgcentrum werkt met zelfsturende teams: dat heeft voordelen, maar het vraagt ook afspraken en nieuwe vaardigheden.", "Een woonzorgcentrum heeft geen verpleegkundigen meer en werkt alleen met vrijwilligers.", "Zelfsturende teams zijn volgens de tekst de beste oplossing voor elk bedrijf."], correct: 0 }
  - { id: nl-b2-work-t04-q2, type: mc, question: "Wat doet de coördinator van een team?", options: ["Hij leidt de vergaderingen en volgt de afspraken op.", "Hij beslist alles alleen.", "Hij maakt de beoordeling van elke collega."], correct: 0 }
  - { id: nl-b2-work-t04-q3, type: true_false_notgiven, statement: "Volgens de directeur zijn de werknemers sinds de verandering minder vaak ziek.", answer: true }
  - { id: nl-b2-work-t04-q4, type: true_false_notgiven, statement: "Volgens de tekst zijn zelfsturende teams in elk bedrijf de beste keuze.", answer: false }
  - { id: nl-b2-work-t04-q5, type: true_false_notgiven, statement: "Het woonzorgcentrum heeft honderd bewoners.", answer: not_given }
