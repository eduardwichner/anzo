id: nl-b2-work-t04
kind: reading
title: { en: Teams without a boss }
topic: Teams and leadership (an article in a magazine for entrepreneurs)
level: B2
paragraphs:
  - - { id: nl-b2-work-t04-s01, target: "In een woonzorgcentrum in Hasselt is er sinds twee jaar geen hoofdverpleegkundige meer.", native: { en: "In a care home in Hasselt there has been no head nurse for two years." } }
    - { id: nl-b2-work-t04-s02, target: "De verpleegkundigen en verzorgenden werken in zelfsturende teams van tien mensen.", native: { en: "The nurses and carers work in self-managing teams of ten people." } }
    - { id: nl-b2-work-t04-s03, target: "Ze maken zelf de planning, verdelen de taken en beslissen samen hoe ze de bewoners het best helpen.", native: { en: "They make the schedule themselves, divide the tasks and decide together how best to help the residents." } }
  - - { id: nl-b2-work-t04-s04, target: "Het idee is eenvoudig: wie het werk elke dag doet, weet het best hoe het beter kan.", native: { en: "The idea is simple: those who do the work every day know best how it can be done better." } }
    - { id: nl-b2-work-t04-s05, target: "Volgens de directeur zijn de werknemers sindsdien veel gemotiveerder en zijn ze minder vaak ziek.", native: { en: "According to the director the employees have been much more motivated since then and are ill less often." } }
    - { id: nl-b2-work-t04-s06, target: "Ook de bewoners zijn tevreden, omdat ze vaker dezelfde gezichten zien.", native: { en: "The residents are satisfied too, because they see the same faces more often." } }
  - - { id: nl-b2-work-t04-s07, target: "Toch werkt het niet vanzelf.", native: { en: "Still, it doesn't work by itself." } }
    - { id: nl-b2-work-t04-s08, target: "In het begin waren er teams die het moeilijk vonden om beslissingen te nemen, en soms was niemand verantwoordelijk als er iets misliep.", native: { en: "At first there were teams that found it hard to make decisions, and sometimes nobody was responsible when something went wrong." } }
    - { id: nl-b2-work-t04-s09, target: "Daarom heeft elk team nu een coördinator die de vergaderingen leidt en de afspraken opvolgt, zonder de baas te zijn.", native: { en: "That is why every team now has a coordinator who leads the meetings and follows up the agreements, without being the boss." } }
  - - { id: nl-b2-work-t04-s10, target: "Een tweede les: autonomie vraagt vaardigheden die niet iedereen al heeft.", native: { en: "A second lesson: autonomy requires skills that not everyone already has." } }
    - { id: nl-b2-work-t04-s11, target: "De medewerkers kregen een opleiding over plannen, overleggen en feedback geven.", native: { en: "The staff were given training in planning, consulting and giving feedback." } }
    - { id: nl-b2-work-t04-s12, target: "\"Een collega zeggen wat beter kan, zonder hem te kwetsen, dat moet je leren\", zegt een verzorgende.", native: { en: "\"Telling a colleague what could be better without hurting them, you have to learn that\", says a carer." } }
  - - { id: nl-b2-work-t04-s13, target: "Zijn zelfsturende teams dan iets voor elk bedrijf?", native: { en: "So are self-managing teams something for every company?" } }
    - { id: nl-b2-work-t04-s14, target: "Niet per se.", native: { en: "Not necessarily." } }
    - { id: nl-b2-work-t04-s15, target: "Waar het werk heel voorspelbaar is of waar snel beslist moet worden, blijft een duidelijke leiding vaak nodig.", native: { en: "Where the work is very predictable or where decisions have to be made quickly, clear leadership often remains necessary." } }
    - { id: nl-b2-work-t04-s16, target: "Maar wie zijn medewerkers meer vertrouwen geeft, krijgt er vaak veel voor terug.", native: { en: "But anyone who gives their staff more trust often gets a lot back for it." } }
