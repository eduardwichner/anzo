  - { id: nl-b2-study-t03-q2, type: mc, question: "Hoe vaak liegen we volgens het onderzoek gemiddeld?", options: ["Ongeveer twee keer per dag.", "Ongeveer twee keer per week.", "Bijna nooit."], correct: 0 }
  - { id: nl-b2-study-t03-q3, type: true_false_notgiven, statement: "De respondenten vulden een week lang elke avond de vragenlijst in.", answer: true }
