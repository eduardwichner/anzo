  - { id: nl-b2-study-t05-q1, type: summary, options: ["Een taalkundige vindt dat het Nederlands niet in gevaar is: leenwoorden zijn normaal, en wat vooral verandert, is hoe Vlamingen spreken en chatten.", "Een taalkundige wil dat jongeren geen woorden uit het Engels meer gebruiken.", "Een taalkundige legt uit waarom dialecten beter zijn dan de standaardtaal."], correct: 0 }
  - { id: nl-b2-study-t05-q2, type: mc, question: "Waarom zijn leenwoorden volgens Maes geen probleem?", options: ["Het Nederlands heeft altijd woorden aan andere talen ontleend.", "Er komen bijna geen nieuwe leenwoorden meer bij.", "Jongeren gebruiken ze alleen als ze chatten."], correct: 0 }
  - { id: nl-b2-study-t05-q3, type: true_false_notgiven, statement: "Veel jongeren spreken vandaag tussentaal in plaats van dialect.", answer: true }
  - { id: nl-b2-study-t05-q4, type: true_false_notgiven, statement: "In een gewone krant komt meer dan tien procent van de woorden uit het Engels.", answer: false }
