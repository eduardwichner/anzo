  - { id: nl-b2-study-t08-q1, type: summary, options: ["Een team ontwerpt in drie stappen een robot die aardbeien plukt; hij werkt al, maar zal de mens niet vervangen.", "Een boer vertelt waarom hij geen robots in zijn serre wil.", "Studenten leren hoe je aardbeien plukt in een serre."], correct: 0 }
  - { id: nl-b2-study-t08-q2, type: mc, question: "Waarom werkt het team aan een robot die aardbeien plukt?", options: ["Boeren vinden steeds moeilijker mensen om te helpen.", "Aardbeien zijn te duur geworden.", "De boeren willen 's nachts niet meer werken."], correct: 0 }
  - { id: nl-b2-study-t08-q3, type: true_false_notgiven, statement: "De ontwerpers hebben vijf prototypes getest.", answer: true }
  - { id: nl-b2-study-t08-q4, type: true_false_notgiven, statement: "De robot plukt vandaag al bijna alle rijpe aardbeien.", answer: false }
  - { id: nl-b2-study-t08-q5, type: true_false_notgiven, statement: "De robot kost meer dan honderdduizend euro.", answer: not_given }
