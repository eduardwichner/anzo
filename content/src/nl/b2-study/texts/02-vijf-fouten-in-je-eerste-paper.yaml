  - { id: nl-b2-study-t02-q2, type: mc, question: "Waarom moet je volgens de tekst op tijd beginnen?", options: ["Zodat je de tekst later met frisse ogen kunt herlezen.", "Omdat de bibliotheek in de examenperiode gesloten is.", "Omdat de docent elke week een deel van de tekst wil zien."], correct: 0 }
  - { id: nl-b2-study-t02-q3, type: true_false_notgiven, statement: "De hogeschool controleert de papers met een programma.", answer: true }
  - { id: nl-b2-study-t02-q4, type: true_false_notgiven, statement: "Volgens de tekst is plagiaat alleen een fout als je het bewust doet.", answer: false }
