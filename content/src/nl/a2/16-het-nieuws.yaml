  - { target: de mist, native: { en: fog }, pos: noun, plural: "-" }
  - { target: mistig, native: { en: foggy }, pos: adjective }
  - { target: vriezen, native: { en: to freeze }, pos: verb }
  - { target: de ijzel, native: { en: black ice }, pos: noun, plural: "-" }
