  - { target: het journaal, native: { en: "news (on TV)" }, pos: noun, plural: journaals }
  - { target: de radio, native: { en: radio }, pos: noun, plural: "radio's" }
  - { target: de wereld, native: { en: world }, pos: noun, plural: werelden }
  - { target: het binnenland, native: { en: "home country, home affairs (not abroad)" }, pos: noun, plural: "-" }
  - { target: de regering, native: { en: government }, pos: noun, plural: regeringen }
  - { target: de minister, native: { en: minister }, pos: noun, plural: ministers }
  - { target: de verkiezing, native: { en: election }, pos: noun, plural: verkiezingen }
  - { target: het weerbericht, native: { en: weather forecast }, pos: noun, plural: weerberichten }
  - { target: verwachten, native: { en: to expect }, pos: verb }
  - { target: voorspellen, native: { en: to forecast }, pos: verb }
