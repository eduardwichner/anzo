  - { id: s11, target: "Vorige maand heb ik veel gewerkt.", native: { en: "Last month I worked a lot." }, items: [nl.vorige-maand], acceptAlso: ["Ik heb vorige maand veel gewerkt."] }
  - { id: s12, target: "Wat heb je het voorbije weekend gedaan?", native: { en: "What did you do last weekend?" }, items: [nl.het-voorbije-weekend] }
  - { id: s13, target: "De vorige keer was de winkel gesloten.", native: { en: "Last time the shop was closed." }, items: [nl.de-vorige-keer], acceptAlso: ["De winkel was de vorige keer gesloten."] }
  - { id: s14, target: "Wat is er gebeurd?", native: { en: "What happened?" }, items: [nl.gebeuren] }
  - { id: s15, target: "Hij heeft me een mooi verhaal verteld.", native: { en: "He told me a lovely story." }, items: [nl.vertellen, nl.verhaal] }
