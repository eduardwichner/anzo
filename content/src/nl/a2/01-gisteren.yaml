sentences:
  - { id: s01, target: "Ik ben drie jaar geleden naar België gekomen.", native: { en: "I came to Belgium three years ago." }, items: [nl.geleden], acceptAlso: ["Drie jaar geleden ben ik naar België gekomen."] }
  - { id: s02, target: "Toen woonde ik nog in Engeland.", native: { en: "At that time I still lived in England." }, items: [nl.toen], acceptAlso: ["Ik woonde toen nog in Engeland."] }
