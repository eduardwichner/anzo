  - { target: het sollicitatiegesprek, native: { en: job interview }, pos: noun, plural: sollicitatiegesprekken }
  - { target: het cv, native: { en: CV }, pos: noun, plural: "cv's" }
  - { target: het diploma, native: { en: "diploma, qualification" }, pos: noun, plural: "diploma's" }
  - { target: de opleiding, native: { en: "training, education" }, pos: noun, plural: opleidingen, avoid: [nl.cursus] }
  - { target: de cursus, native: { en: course }, pos: noun, plural: cursussen }
  - { target: ervaren, native: { en: experienced }, pos: adjective }
  - { target: geschikt, native: { en: suitable }, pos: adjective }
