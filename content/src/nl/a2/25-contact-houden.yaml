  - { target: de postzegel, native: { en: stamp }, pos: noun, plural: postzegels }
  - { target: de brievenbus, native: { en: "letterbox, postbox" }, pos: noun, plural: brievenbussen }
  - { target: versturen, native: { en: to send }, pos: verb }
  - { target: de ontvanger, native: { en: recipient }, pos: noun, plural: ontvangers }
  - { target: het onderwerp, native: { en: subject }, pos: noun, plural: onderwerpen }
  - { target: de bijlage, native: { en: attachment }, pos: noun, plural: bijlagen }
  - { target: beantwoorden, native: { en: "to answer (a letter)" }, pos: verb }
