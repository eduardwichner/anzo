  - { target: tot gauw, native: { en: "see you soon" }, pos: phrase }
  - { target: lief, native: { en: "dear, sweet, kind" }, pos: adjective }
  - { target: hartelijk, native: { en: "warm, cordial" }, pos: adjective, avoid: [nl.lief] }
