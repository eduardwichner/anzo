  - { id: s17, target: "Ik aanvaard uw voorstel.", native: { en: "I accept your proposal." }, items: [nl.aanvaarden] }
  - { id: s18, target: "Hij weigerde te betalen.", native: { en: "He refused to pay." }, items: [nl.weigeren] }
  - { id: s19, target: "Dat is juist!", native: { en: "That's right!" }, items: [nl.juist] }
  - { id: s20, target: "Het antwoord is fout.", native: { en: "The answer is wrong." }, items: [nl.fout] }
  - { id: s21, target: "Dat is niet eerlijk!", native: { en: "That's not fair!" }, items: [nl.eerlijk] }
  - { id: s22, target: "Wat een raar verhaal.", native: { en: "What a strange story." }, items: [nl.raar] }
  - { id: s23, target: "Het is normaal dat je moe bent.", native: { en: "It's normal that you're tired." }, items: [nl.normaal] }
  - { id: s24, target: "Eigenlijk heb ik geen zin.", native: { en: "Actually, I don't feel like it." }, items: [nl.eigenlijk], acceptAlso: ["Ik heb eigenlijk geen zin."] }
  - { id: s25, target: "Ik ben het helemaal met u eens.", native: { en: "I completely agree with you." }, items: [nl.helemaal] }
