  - { target: eigenlijk, native: { en: actually }, pos: adverb }
  - { target: helemaal, native: { en: "completely, totally" }, pos: adverb }
sentences:
  - { id: s01, target: "Wat is jouw mening?", native: { en: "What's your opinion?" }, items: [nl.mening] }
  - { id: s02, target: "Volgens mij is dat te duur.", native: { en: "In my opinion that's too expensive." }, items: [nl.volgens-mij], acceptAlso: ["Dat is volgens mij te duur."] }
  - { id: s03, target: "Ik denk dat hij te laat komt.", native: { en: "I think he'll be late." }, items: [nl.dat-conj] }
  - { id: s04, target: "Ik vind dat het huis te klein is.", native: { en: "I think the house is too small." }, items: [nl.dat-conj] }
  - { id: s05, target: "Ik kom niet omdat ik ziek ben.", native: { en: "I'm not coming because I'm ill." }, items: [nl.omdat] }
  - { id: s06, target: "Ik kom niet, want ik ben ziek.", native: { en: "I'm not coming – I'm ill." }, items: [nl.want] }
  - { id: s07, target: "Het regent, dus we blijven thuis.", native: { en: "It's raining, so we're staying at home." }, items: [nl.dus], acceptAlso: ["Het regent, dus blijven we thuis."] }
  - { id: s08, target: "Als je vragen hebt, kun je me bellen.", native: { en: "If you have any questions, you can call me." }, items: [nl.als] }
  - { id: s09, target: "Wat is de reden?", native: { en: "What's the reason?" }, items: [nl.reden] }
  - { id: s10, target: "Dat is een goed idee!", native: { en: "That's a good idea!" }, items: [nl.idee] }
