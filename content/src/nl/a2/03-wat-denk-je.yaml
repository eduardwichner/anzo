  - { id: s12, target: "Ik stel voor dat we morgen vergaderen.", native: { en: "I suggest we meet tomorrow." }, items: [nl.voorstellen] }
  - { id: s13, target: "Het voordeel is dat het station dichtbij is.", native: { en: "The advantage is that the station is close by." }, items: [nl.voordeel] }
  - { id: s14, target: "Het nadeel is de prijs.", native: { en: "The disadvantage is the price." }, items: [nl.nadeel] }
