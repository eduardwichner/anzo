# Dutch word list sources. npm run content:wordlist -- nl builds content/reference/extracted/wordlist-nl.json
# from these groups, NT2Lex (content/reference/dutch/a1/NT2Lex-CGN-v01.tsv) and the attestations in the extracted
# reference texts (Naar Nederland: Start/A1; CNaVT Maatschappelijk Informeel: A2). Method: content/src/nl/WORDLIST.md.
#
# Each group is one unit of the plan (content/src/nl/PLAN.md): level, theme, why (the written reason for the group —
# Richtgraad 1 domain/task and what the references show), and its lemmas by part of speech:
#   noun: "de kat/katten" (article/plural; "-" = no plural)   verb: "werken", separable "op|staan"
#   adj, adv, pron, det, num, prep, conj, inter: the lemma    phrase: a fixed multi-word expression ("tot ziens")
# moved: why a lemma sits at another level than NT2Lex's first-observed level (needed when the level is LOWER than NT2Lex
# and the lemma is not attested in a reference at or below it, or HIGHER than NT2Lex); reasons: per-lemma reasons.
# alsoNL: Belgian standard form taught → the Netherlands form, shown to the learner as a note.
# regional: Netherlands-only words and realia from the references, tagged regional: nl and never taught as core vocabulary.

