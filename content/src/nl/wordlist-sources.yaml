groups:
# ======================================================= Start (Pre-A1) =======================================================
  - id: s01-greetings
    level: Start
    theme: Greetings and politeness
    why: >-
      Richtgraad 1 (register appendix: Hallo / Dag, goedemorgen, goedenavond; Bedankt, dank je / Dank u wel;
      Alsjeblieft / Alstublieft) and Naar Nederland les 21 (Dag mevrouw, Goedemiddag); everyday contact in Flanders.
    inter: [hallo, dag, ja, nee, oké, sorry, pardon, bedankt]
    phrase: [goedemorgen, goedemiddag, goedenavond, goedenacht, tot ziens, tot straks, tot morgen, dank u wel, dank je wel, alstublieft, alsjeblieft, welkom, hoe gaat het]
    noun: [de meneer/meneren, de mevrouw/mevrouwen]
    adj: [goed]
    adv: [graag, prima]
  - id: s02-introducing
    level: Start
    theme: Introducing yourself
    why: >-
      Richtgraad 1 domain persoonlijk (personal details, origin, languages); Naar Nederland les 21 (Wat is uw naam?
      Waar woont u?) and CNaVT INFO (personalia: naam, woonplaats).
    noun: [de naam/namen, de voornaam/voornamen, de achternaam/achternamen, het land/landen, de stad/steden, het adres/adressen, de straat/straten, het nummer/nummers, de taal/talen, het Nederlands/-, het Engels/-, het Frans/-]
    verb: [zijn, heten, wonen, komen, spreken, leren]
    prep: [uit, in, van]
    adj: [Belgisch]
    adv: [een beetje, vandaan]
  - id: s03-numbers
    level: Start
    theme: Numbers to twenty, age, phone numbers
    why: >-
      Naar Nederland les 21–22 (nul … twintig, Hoe oud zijn ze?, telefoonnummer) and Richtgraad 1 (personalia,
      giving a phone number); NT2Lex A1 numbers.
    num: [nul, één, twee, drie, vier, vijf, zes, zeven, acht, negen, tien, elf, twaalf, dertien, veertien, vijftien, zestien, zeventien, achttien, negentien, twintig]
    noun: [het jaar/jaren, het telefoonnummer/telefoonnummers, de gsm/gsm's, de euro/euro's]
    adj: [oud, jong]
    adv: [hoeveel]
  - id: s04-family
    level: Start
    theme: Family
    why: >-
      Richtgraad 1 domain persoonlijk, role opvoeder (the learner's own family and children); Naar Nederland les 22, 28,
      36 (gezin, zoon, dochter, ouders); CNaVT INFO (familiefeest, nicht, oom).
    noun: [de familie/families, het gezin/gezinnen, de man/mannen, de vrouw/vrouwen, het kind/kinderen, de zoon/zonen, de dochter/dochters, de moeder/moeders, de vader/vaders, de ouder/ouders, de broer/broers, de zus/zussen, de baby/baby's, de jongen/jongens, het meisje/meisjes, de vriend/vrienden, de vriendin/vriendinnen, de partner/partners]
    verb: [hebben]
    adj: [getrouwd, alleen]
  - id: s05-pronouns
    level: Start
    theme: Me, you and questions
    why: >-
      Grammar of the Start level (personal pronouns, yes/no and w-questions, niet/geen — content/src/nl/PLAN.md);
      Naar Nederland les 22 (Ik ben Tom. Jij bent Isabel. Hij is daar.) and the EXTRA boxes; NT2Lex A1 function words.
    pron: [ik, mij, me, jij, je, jou, u, hij, hem, zij, ze, wij, we, jullie]
    det: [mijn, jouw, uw, de, het, een, geen, welk, dit, dat]
    adv: [wie, wat, waar, wanneer, hoe, waarom, niet, ook, hier, daar, nu, heel]
    conj: [en, of, maar]
  - id: s06-home
    level: Start
    theme: At home
    why: >-
      Richtgraad 1 role beheerder huisvesting (describing one's home); Naar Nederland les 23 (Ons huis: woonkamer,
      keuken, slaapkamer, badkamer, trap); NT2Lex A1 (huis, kamer, keuken, tuin, deur). zetel is the Belgian standard word
      for a sofa (alsoNL bank), chosen over bank to keep bank (the bank, the bench) apart.
    noun: [het huis/huizen, het appartement/appartementen, de kamer/kamers, de keuken/keukens, de badkamer/badkamers, de slaapkamer/slaapkamers, de woonkamer/woonkamers, het toilet/toiletten, de tuin/tuinen, de deur/deuren, het raam/ramen, de tafel/tafels, de stoel/stoelen, het bed/bedden, de zetel/zetels, de kast/kasten, de trap/trappen, de lamp/lampen]
    adj: [groot, klein, mooi, nieuw]
  - id: s07-food
    level: Start
    theme: Food and drink
    why: >-
      Richtgraad 1 role consument and sociocultural appendix (Waaruit bestaat een alledaagse maaltijd? Wat wordt er
      gedronken?); Naar Nederland les 26 (Eten en drinken: broodje kaas, soep, melk, ontbijt); CNaVT INFO (menu, hapjes).
      frietjes is the Belgian word (alsoNL patat).
    noun: [het eten/-, het brood/broden, de boterham/boterhammen, het broodje/broodjes, de kaas/kazen, de boter/-, het ei/eieren, de melk/-, het water/-, de koffie/-, de thee/-, het bier/bieren, de wijn/wijnen, de soep/soepen, het fruit/-, de appel/appels, de banaan/bananen, de groente/groenten, het vlees/-, de vis/vissen, de kip/kippen, de frietjes/-, het glas/glazen, de honger/-, de dorst/-]
    verb: [eten, drinken]
    adj: [lekker]
  - id: s08-days
    level: Start
    theme: Days and parts of the day
    why: >-
      Richtgraad 1 (appointments, opening hours, everyday routine); Naar Nederland les 25 (De dagen van de week, de
      agenda, 's ochtends 's middags 's avonds); voormiddag and namiddag are the Belgian standard words (alsoNL ochtend,
      middag).
    noun: [de dag/dagen, de week/weken, het weekend/weekends, de ochtend/ochtenden, de voormiddag/voormiddagen, de middag/middagen, de namiddag/namiddagen, de avond/avonden, de nacht/nachten, het uur/uren]
    day: [maandag, dinsdag, woensdag, donderdag, vrijdag, zaterdag, zondag]
    adv: [vandaag, morgen, vroeg, laat, straks, altijd, soms, thuis]
    phrase: ["'s morgens", "'s middags", "'s avonds", "'s nachts"]
  - id: s09-town
    level: Start
    theme: Places in town
    why: >-
      Richtgraad 1 domain publiek (shops, the station, the doctor, the school); Naar Nederland les 34 (winkelcentrum,
      kerk), CNaVT INFO (station, café, restaurant, park); NT2Lex A1 (winkel, supermarkt, station, school).
    noun: [de winkel/winkels, de supermarkt/supermarkten, de bakker/bakkers, de markt/markten, de bank/banken, de apotheek/apotheken, het station/stations, de bus/bussen, de bushalte/bushaltes, de school/scholen, het ziekenhuis/ziekenhuizen, de dokter/dokters, het café/cafés, het restaurant/restaurants, het park/parken, de kerk/kerken]
    verb: [gaan]
    prep: [naar, bij, met, op, voor, aan]
    adv: [naartoe]
  - id: s10-clothes
    level: Start
    theme: Colours and clothes
    why: >-
      Richtgraad 1 role consument (shop: andere kleur, maat); Naar Nederland les 43 (broek, schoenen, blauwe broek);
      NT2Lex A1 (rood, blauw, wit, jas, broek, kleed). kleed (dress) and hemd (shirt) are the Belgian standard words
      (alsoNL jurk, overhemd); NT2Lex A1 attests kleed 41 times.
    noun: [de kleur/kleuren, de broek/broeken, de jas/jassen, het hemd/hemden, de trui/truien, de rok/rokken, het kleed/kleden, de schoen/schoenen, de sok/sokken]
    adj: [rood, blauw, groen, geel, zwart, wit, bruin, grijs, oranje, roze]
    verb: [dragen]
  - id: s11-doing
    level: Start
    theme: What do you do?
    why: >-
      Grammar of the Start level (present tense of regular verbs); Richtgraad 1 roles werkende, cursist,
      vrijetijdsbesteder; Naar Nederland les 25–27 (werken, leren, lezen, schrijven, luisteren, koken); NT2Lex A1 verbs.
    verb: [werken, lezen, schrijven, luisteren, kijken, zien, slapen, koken, fietsen, wandelen, betalen, kopen, doen, maken, zoeken, helpen, wachten, spelen, studeren]
    noun: [het werk/-, het boek/boeken, de krant/kranten, de muziek/-, de film/films]
  - id: s12-how
    level: Start
    theme: How are you? Describing things
    why: >-
      Richtgraad 1 (expressing one's feelings and needs, describing things); Naar Nederland les 29 (ziek, beter),
      les 24 (koud, warm); CNaVT INFO (moe, verdrietig); NT2Lex A1 adjectives (blij, leuk, ziek, moe).
    adj: [slecht, blij, moe, ziek, druk, rustig, leuk, duur, goedkoop, koud, warm, lang, kort, snel, langzaam]
    adv: [erg, veel, weinig, te, zo]
  - id: s13-phone
    level: Start
    theme: Calling and messages
    why: >-
      Richtgraad 1 role consument (telephone provider example task), the phone in everyday contact; Naar Nederland
      les 21 (telefoon, mobiel nummer), les 41 (bellen of schrijven); gsm is the Belgian standard word (alsoNL mobiel).
    verb: [bellen, sturen, antwoorden, vragen, zeggen]
    noun: [het bericht/berichten, de computer/computers, de e-mail/e-mails, het internet/-, de foto/foto's, de vraag/vragen, het antwoord/antwoorden]
# ============================================================ A1 ============================================================
  - id: a01-numbers
    level: A1
    theme: Numbers to a thousand, order
    why: >-
      Grammar of A1 (numbers to 1000); Naar Nederland les 22 (dertig … honderd), les 42 (eerste, tweede verdieping),
      les 59 (prices); CNaVT INFO (prices, ages, addresses).
    num: [dertig, veertig, vijftig, zestig, zeventig, tachtig, negentig, honderd, duizend, eerste, tweede, derde, vierde, vijfde, laatste]
    noun: [de helft/helften, het getal/getallen]
    adv: [ongeveer, precies, samen, meer, minder]
  - id: a02-money
    level: A1
    theme: Money and prices
    why: >-
      Richtgraad 1 role consument (prices, paying); Naar Nederland les 43 (euro's, briefje van vijftig, eurocent, de
      portemonnee), les 53 (betalen), les 59 (Hoeveel kost dat?); CNaVT INFO (prices, kassa). bankkaart and kasticket
      are the Belgian words (alsoNL pinpas, kassabon).
    noun: [het geld/-, de cent/centen, de prijs/prijzen, de kassa/kassa's, de bankkaart/bankkaarten, het kasticket/kastickets, de portemonnee/portemonnees, de korting/kortingen, het briefje/briefjes]
    verb: [kosten, geven, krijgen, nemen, tellen]
    adj: [gratis]
    adv: [cash, terug]
    phrase: [hoeveel kost]
  - id: a03-clock
    level: A1
    theme: The time and appointments
    why: >-
      Richtgraad 1 (making an appointment, opening hours); Naar Nederland les 25 (de klok: kwart over, half twee; het
      kwartier, de minuut; de agenda), les 35 (een afspraak maken, op tijd komen). kwart na is the usual Belgian form
      (alsoNL kwart over).
    noun: [de afspraak/afspraken, de minuut/minuten, het kwartier/kwartieren, de seconde/seconden, de agenda/agenda's, de klok/klokken, de tijd/tijden]
    adj: [half]
    phrase: [kwart na, kwart voor, hoe laat, op tijd]
    prep: [om, na, tot, vanaf]
    verb: [beginnen, stoppen, duren, af|spreken]
    adv: [eerst, dan, daarna, meestal]
  - id: a04-groceries
    level: A1
    theme: Groceries
    why: >-
      Richtgraad 1 role consument and sociocultural appendix (meals); Naar Nederland les 34 (boodschappen: vers brood,
      eieren, vis, groente en fruit), les 26 (aardappelen, groente); CNaVT INFO (salade, rijst, pasta, kruiden).
      confituur is the Belgian word (alsoNL jam).
    noun: [de boodschap/boodschappen, de aardappel/aardappelen, de tomaat/tomaten, de ui/uien, de wortel/wortels, de sla/-, de rijst/-, de pasta/pasta's, de peer/peren, de sinaasappel/sinaasappels, de citroen/citroenen, de suiker/-, het zout/-, de confituur/confituren, de chocolade/-, de taart/taarten, het koekje/koekjes, het sap/sappen, de cola/cola's, het ontbijt/ontbijten, de lunch/lunches, het avondeten/-]
    verb: [ontbijten]
    prep: [zonder]
  - id: a05-shop
    level: A1
    theme: At the market and the bakery
    why: >-
      Richtgraad 1 role consument (asking for a product, quantity, price); Naar Nederland les 59 (Hoeveel kosten die
      bloemen? twee bossen), les 34; CNaVT INFO (folder: per stuk, liter, pot). beenhouwer is the Belgian word (alsoNL slager).
    noun: [de kilo/kilo's, de gram/gram, de liter/liters, het stuk/stukken, het pak/pakken, de fles/flessen, de zak/zakken, de doos/dozen, de beenhouwer/beenhouwers, de klant/klanten, de verkoper/verkopers, de bloem/bloemen]
    verb: [willen, wensen, kiezen]
    adj: [vers, zwaar, licht, vriendelijk]
    phrase: [nog iets, dat is alles]
    adv: [zeker]
  - id: a06-body
    level: A1
    theme: The body
    why: >-
      Naar Nederland les 35 (het lichaam: hoofd, oog, oor, mond, schouders, arm, rug, buik, hand, been, knie, voet);
      Richtgraad 1 role patiënt; NT2Lex A1 (hoofd, hand, voet, oog).
    noun: [het lichaam/lichamen, het hoofd/hoofden, het haar/haren, het oog/ogen, het oor/oren, de neus/neuzen, de mond/monden, de tand/tanden, de keel/kelen, de arm/armen, de hand/handen, de vinger/vingers, de schouder/schouders, de rug/ruggen, de buik/buiken, het been/benen, de knie/knieën, de voet/voeten]
  - id: a07-doctor
    level: A1
    theme: At the doctor's
    why: >-
      Richtgraad 1 role patiënt (notes for the doctor, the doctor's explanation, medication); Naar Nederland les 29
      (ziek geweest, pijn in mijn hoofd, de apotheek, medicijnen), les 35 (huisarts, spreekuur, wachtkamer); CNaVT INFO
      (koorts, hoofdpijn, keelpijn, griep).
    noun: [de pijn/pijnen, de last/-, de hoofdpijn/-, de buikpijn/-, de keelpijn/-, de koorts/-, de griep/-, de huisarts/huisartsen, de wachtkamer/wachtkamers, het medicijn/medicijnen, de pil/pillen, de apotheker/apothekers, de verpleegkundige/verpleegkundigen]
    verb: [voelen, rusten]
    adj: [gezond, beter, ernstig]
    phrase: [beterschap]
  - id: a08-transport
    level: A1
    theme: By bus and train
    why: >-
      Richtgraad 1 roles verkeersgebruiker and consument (asking the driver to warn at the stop, tickets); Naar Nederland
      les 30 (auto, bus, fiets, file), les 50 (de trein, de conducteur, overstappen, het perron); CNaVT INFO (bus 300,
      kaartje, uitstappen, station).
    noun: [de trein/treinen, de tram/trams, de metro/metro's, de auto/auto's, de fiets/fietsen, het vliegtuig/vliegtuigen, de halte/haltes, het perron/perrons, het spoor/sporen, het ticket/tickets, het abonnement/abonnementen, de chauffeur/chauffeurs, de reis/reizen, de file/files]
    verb: [rijden, op|stappen, uit|stappen, over|stappen, vertrekken, aan|komen, reizen]
    adj: [vol]
  - id: a09-directions
    level: A1
    theme: Asking the way
    why: >-
      Richtgraad 1 (asking and giving directions; noting directions to a party); Naar Nederland les 34 (tweede straat
