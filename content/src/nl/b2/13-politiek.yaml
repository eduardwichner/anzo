id: nl-b2-u13
title: { en: Politics and government }
icon: vote
topic: How Belgium is governed (federal state, regions and communities, municipalities), elections and compulsory voting, democracy and its rights and duties; the passive with modals, also in the past (moet goedgekeurd worden, had beter uitgelegd moeten worden)
