id: nl-b2-u17
title: { en: Travel and tourism }
icon: plane
topic: Sustainable travel, mass tourism and its effects on the people who live there, travelling slowly; relative clauses with wat, wie and waar (alles wat je ziet, wie reist, die …, de stad waar ik woon)
