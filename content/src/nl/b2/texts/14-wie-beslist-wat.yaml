  - { id: nl-b2-t14-q2, type: mc, question: "Waarvoor zijn de gemeenschappen bevoegd?", options: ["Voor onderwijs, cultuur en een deel van de zorg.", "Voor de pensioenen en de belastingen.", "Voor de straten en de parken."], correct: 0 }
  - { id: nl-b2-t14-q3, type: true_false_notgiven, statement: "De koning neemt zelf beslissingen in de politiek.", answer: false }
  - { id: nl-b2-t14-q4, type: true_false_notgiven, statement: "In Vlaanderen hebben het gewest en de gemeenschap één parlement.", answer: true }
  - { id: nl-b2-t14-q5, type: true_false_notgiven, statement: "De meeste nieuwkomers stemmen bij de gemeenteraadsverkiezingen.", answer: not_given }
