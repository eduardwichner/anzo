questions:
  - { id: nl-b2-t08-q1, type: summary, options: ["Het artikel legt uit waarom nepnieuws zich zo snel verspreidt en hoe je het kunt herkennen.", "Het artikel legt uit waarom nepnieuws zich zo snel verspreidt en waarom je het bijna nooit kunt herkennen.", "Het artikel zegt dat je beter nooit nieuws op sociale media leest."], correct: 0 }
  - { id: nl-b2-t08-q2, type: mc, question: "Waarom tonen algoritmes vooral berichten met sterke emoties?", options: ["Omdat we daar langer naar kijken.", "Omdat de overheid dat vraagt.", "Omdat die berichten altijd waar zijn."], correct: 0 }
  - { id: nl-b2-t08-q3, type: true_false_notgiven, statement: "Volgens het artikel worden berichten die ons boos maken sneller gedeeld.", answer: true }
  - { id: nl-b2-t08-q4, type: true_false_notgiven, statement: "Een op de drie mensen leest elke dag een papieren krant.", answer: not_given }
  - { id: nl-b2-t08-q5, type: true_false_notgiven, statement: "Je moet vooral kritisch zijn als een bericht niet bij je eigen mening past.", answer: false }
