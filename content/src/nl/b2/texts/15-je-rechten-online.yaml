  - { id: nl-b2-t15-q1, type: summary, options: ["De tekst legt uit welke rechten je hebt als iets dat je online kocht kapotgaat, en wat je kunt doen als de winkel niet wil helpen.", "De tekst legt uit welke rechten je hebt als iets dat je online kocht kapotgaat, en waarom je de herstelling altijd zelf betaalt.", "De tekst zegt dat je beter nooit online koopt."], correct: 0 }
  - { id: nl-b2-t15-q2, type: mc, question: "Wie moet tijdens de garantie bewijzen wie de fout maakte?", options: ["De verkoper.", "De klant.", "De Consumentenombudsdienst."], correct: 0 }
