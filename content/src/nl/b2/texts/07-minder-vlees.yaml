id: nl-b2-t07
kind: dialogue
title: { en: Less meat? }
topic: Food and health (two friends talk about eating less meat and wasting less)
level: B2
speakers: { A: { name: Karim }, B: { name: Lien } }
turns:
  - { id: nl-b2-t07-s01, speaker: A, target: "Lien, klopt het dat je geen vlees meer eet?", native: { en: "Lien, is it true that you don't eat meat any more?" } }
  - { id: nl-b2-t07-s02, speaker: B, target: "Bijna geen. Ik eet nog af en toe vis, maar thuis koken we meestal vegetarisch.", native: { en: "Almost none. I still eat fish now and then, but at home we usually cook vegetarian food." } }
  - { id: nl-b2-t07-s03, speaker: A, target: "Waarom eigenlijk? Voor je gezondheid of voor het milieu?", native: { en: "Why, actually? For your health or for the environment?" } }
  - { id: nl-b2-t07-s04, speaker: B, target: "Allebei. Ik heb er een documentaire over gezien en daarna wilde ik niet meer zo blijven eten.", native: { en: "Both. I saw a documentary about it and after that I didn't want to go on eating like that." } }
  - { id: nl-b2-t07-s05, speaker: A, target: "Krijg je dan wel genoeg eiwitten binnen?", native: { en: "But do you get enough protein, then?" } }
  - { id: nl-b2-t07-s06, speaker: B, target: "Ja hoor. Er zitten veel eiwitten in bonen, eieren en noten. Een diëtist heeft me geholpen om evenwichtig te eten.", native: { en: "Oh yes. There's a lot of protein in beans, eggs and nuts. A dietitian helped me to eat a balanced diet." } }
  - { id: nl-b2-t07-s07, speaker: A, target: "En die vleesvervangers uit de supermarkt? Die zijn toch sterk bewerkt?", native: { en: "And those meat substitutes from the supermarket? They're highly processed, aren't they?" } }
  - { id: nl-b2-t07-s08, speaker: B, target: "Sommige wel. Daarom lees ik altijd het etiket. Er staat soms meer zout in dan in vlees.", native: { en: "Some are. That's why I always read the label. Sometimes there is more salt in them than in meat." } }
  - { id: nl-b2-t07-s09, speaker: A, target: "Ik zou het ook willen proberen, maar mijn kinderen eten zo graag frietjes met een curryworst.", native: { en: "I'd like to try it too, but my children love chips with a sausage so much." } }
  - { id: nl-b2-t07-s10, speaker: B, target: "Begin met één vegetarische dag per week. Dan merk je dat het eigenlijk heel gemakkelijk is.", native: { en: "Start with one vegetarian day a week. Then you'll notice that it's actually very easy." } }
  - { id: nl-b2-t07-s11, speaker: A, target: "En wat doe je met restjes? Bij ons wordt er veel weggegooid.", native: { en: "And what do you do with leftovers? We throw a lot away." } }
  - { id: nl-b2-t07-s12, speaker: B, target: "Ik vries ze in, of ik maak er de volgende dag soep van. Zo verspillen we bijna niets.", native: { en: "I freeze them, or I make soup from them the next day. That way we waste almost nothing." } }
  - { id: nl-b2-t07-s13, speaker: A, target: "Slim. Misschien moeten we eens samen koken.", native: { en: "Clever. Maybe we should cook together some time." } }
  - { id: nl-b2-t07-s14, speaker: B, target: "Goed idee! Kom zaterdag eten, dan maak ik iets met groenten van het seizoen.", native: { en: "Good idea! Come for dinner on Saturday, then I'll make something with seasonal vegetables." } }
glossary:
  - { word: curryworst, native: { en: "curryworst (a fried minced-meat sausage; in the Netherlands: frikandel)" } }
  - { word: binnen, native: { en: "(binnenkrijgen: to take in, to get enough of)" } }
items: [nl.vegetarisch, nl.eiwit, nl.dietist, nl.evenwichtig, nl.vleesvervanger, nl.bewerkt, nl.etiket, nl.restje, nl.invriezen, nl.seizoen]
questions:
  - { id: nl-b2-t07-q1, type: summary, options: ["Lien legt uit waarom ze bijna geen vlees meer eet en geeft Karim tips.", "Karim legt uit waarom hij bijna geen vlees meer eet en geeft Lien tips.", "Lien en Karim maken ruzie over vleesvervangers uit de supermarkt."], correct: 0 }
  - { id: nl-b2-t07-q2, type: mc, question: "Waarom eet Lien bijna geen vlees meer?", options: ["Voor haar gezondheid en voor het milieu.", "Omdat ze vlees te duur vindt.", "Omdat haar diëtist het verboden heeft."], correct: 0 }
  - { id: nl-b2-t07-q3, type: true_false_notgiven, statement: "Lien kookt op zaterdag voor zes mensen.", answer: not_given }
  - { id: nl-b2-t07-q4, type: true_false_notgiven, statement: "Karim eet al bijna geen vlees meer.", answer: false }
  - { id: nl-b2-t07-q5, type: true_false_notgiven, statement: "Volgens Lien zit er in sommige vleesvervangers meer zout dan in vlees.", answer: true }
