  - { id: nl-b2-t20-q1, type: summary, options: ["Een leerkracht begrijpt de argumenten voor een verbod op de gsm, maar pleit voor een middenweg en voor lessen over sociale media.", "Een leerkracht begrijpt de argumenten tegen een verbod op de gsm, maar vindt dat de gsm toch op de hele school verboden moet worden.", "Een leerkracht vertelt hoe leerlingen hun gsm in de klas gebruiken om te spelen."], correct: 0 }
  - { id: nl-b2-t20-q2, type: mc, question: "Welk argument van de voorstanders staat niet in de tekst?", options: ["De leerlingen halen betere punten.", "De concentratie in de klas verbetert.", "Er wordt minder gepest via sociale media."], correct: 0 }
  - { id: nl-b2-t20-q3, type: true_false_notgiven, statement: "Volgens de auteur zijn de pauzes rustiger geworden.", answer: false }
