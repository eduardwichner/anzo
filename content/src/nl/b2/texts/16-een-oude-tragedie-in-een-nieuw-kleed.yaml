questions:
  - { id: nl-b2-t16-q1, type: summary, options: ["De recensent vindt de moderne versie van een oude tragedie heel geslaagd, ook al is ze wat te lang.", "De recensent vindt de moderne versie van een oude tragedie niet geslaagd, omdat ze veel te lang is en de acteurs slecht spelen.", "De recensent vertelt vooral over het leven van de regisseur."], correct: 0 }
  - { id: nl-b2-t16-q2, type: mc, question: "Hoe maakt de regisseur het oude verhaal herkenbaar?", options: ["Ze laat een familie ruziemaken via sociale media.", "Ze laat de acteurs in het publiek zitten.", "Ze verandert het einde van het verhaal."], correct: 0 }
  - { id: nl-b2-t16-q3, type: true_false_notgiven, statement: "Volgens de recensent is het tweede deel te lang.", answer: true }
  - { id: nl-b2-t16-q4, type: true_false_notgiven, statement: "Leila Benali speelt voor het eerst een hoofdrol.", answer: not_given }
  - { id: nl-b2-t16-q5, type: true_false_notgiven, statement: "De muziek komt van een opname.", answer: false }
  - { id: nl-b2-t16-q6, type: match_heading, paragraph: 5, options: ["Wat minder goed is", "Het verhaal van het stuk", "Waar je tickets koopt"], correct: 0 }
