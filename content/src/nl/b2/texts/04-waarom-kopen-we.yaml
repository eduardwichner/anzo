  - { id: nl-b2-t04-q1, type: summary, options: ["Het artikel legt uit waarom we zo vaak impulsief kopen en hoe je dat kunt vermijden.", "Het artikel legt uit waarom we zo vaak impulsief kopen en waarom je dat eigenlijk niet kunt vermijden.", "Het artikel beschrijft hoe een gezin zijn schulden heeft afbetaald."], correct: 0 }
  - { id: nl-b2-t04-q2, type: mc, question: "Waar liggen in de winkel vaak de duurste producten?", options: ["Op ooghoogte.", "Onderaan.", "Bij de kassa."], correct: 0 }
  - { id: nl-b2-t04-q3, type: true_false_notgiven, statement: "Volgens het artikel zijn impulsieve aankopen altijd slecht.", answer: false }
  - { id: nl-b2-t04-q4, type: true_false_notgiven, statement: "Jongeren zien niet altijd dat een influencer reclame maakt.", answer: true }
