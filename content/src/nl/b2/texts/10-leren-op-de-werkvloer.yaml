  - { id: nl-b2-t10-q2, type: mc, question: "Waarom vindt Ilias duaal leren beter?", options: ["Hij ziet elke dag waarvoor hij iets leert.", "Hij hoeft geen examens meer te doen.", "Hij verdient meer dan zijn vrienden."], correct: 0 }
