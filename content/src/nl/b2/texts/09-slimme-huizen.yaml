  extra:
    - { id: nl-b2-t09-x1, target: "Daarom verkopen de winkels bijna geen slimme apparaten meer.", native: { en: "That is why the shops hardly sell any smart devices any more." } }
questions:
  - { id: nl-b2-t09-q1, type: summary, options: ["Slimme apparaten hebben voordelen, maar ook risico's voor je privacy en veiligheid, en je kunt zelf iets doen om die te beperken.", "Slimme apparaten besparen veel energie en zijn veilig, zolang je ze bij een bekend merk koopt en de app elke dag gebruikt.", "Wie een slim huis heeft, hoeft nooit meer energie te besparen."], correct: 0 }
  - { id: nl-b2-t09-q2, type: mc, question: "Waarom bespaart een slimme thermostaat energie?", options: ["Hij zet de verwarming lager als er niemand thuis is.", "Hij werkt zonder stroom.", "Hij bestelt zelf goedkopere energie."], correct: 0 }
  - { id: nl-b2-t09-q3, type: true_false_notgiven, statement: "Goedkope apparaten krijgen vaak na een paar jaar geen updates meer.", answer: true }
  - { id: nl-b2-t09-q4, type: true_false_notgiven, statement: "De helft van de Belgische gezinnen heeft een slimme koelkast.", answer: not_given }
  - { id: nl-b2-t09-q5, type: true_false_notgiven, statement: "Volgens het artikel weet je altijd wat er met je gegevens gebeurt.", answer: false }
  - { id: nl-b2-t09-q6, type: match_heading, paragraph: 5, options: ["Tips voor wie een slim apparaat koopt", "Waarom ouderen geen apparaten willen", "De geschiedenis van de thermostaat"], correct: 0 }
