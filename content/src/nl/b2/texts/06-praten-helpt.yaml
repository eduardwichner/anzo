questions:
  - { id: nl-b2-t06-q1, type: summary, options: ["Het artikel legt uit waarom mensen te laat hulp zoeken bij psychische problemen en waar ze die hulp kunnen vinden.", "Het artikel legt uit waarom mensen te snel hulp zoeken bij kleine problemen en waarom de huisarts daar geen tijd voor heeft.", "Het artikel zegt dat de huisarts geen rol speelt bij psychische problemen."], correct: 0 }
  - { id: nl-b2-t06-q2, type: mc, question: "Waarom zoeken mensen volgens hulpverleners pas laat hulp?", options: ["Door het taboe op psychische problemen.", "Door de hoge prijs van een psycholoog.", "Omdat er te weinig huisartsen zijn."], correct: 0 }
  - { id: nl-b2-t06-q3, type: true_false_notgiven, statement: "Het ziekenfonds betaalt een deel van de sessies bij een psycholoog terug.", answer: true }
  - { id: nl-b2-t06-q4, type: true_false_notgiven, statement: "Online gesprekken zijn duurder dan gesprekken in een praktijk.", answer: not_given }
  - { id: nl-b2-t06-q5, type: true_false_notgiven, statement: "In alle regio's wacht je minder dan een maand op een eerste gesprek.", answer: false }
  - { id: nl-b2-t06-q6, type: match_heading, paragraph: 5, options: ["Problemen voorkomen", "De rol van de huisarts", "Te lang wachten"], correct: 0 }
