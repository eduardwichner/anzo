id: nl-b2-t06
kind: reading
title: { en: Talking helps }
topic: Health care (an article about mental health)
level: B2
paragraphs:
  - - { id: nl-b2-t06-s01, target: "Een op de vier mensen krijgt ooit in zijn leven te maken met psychische problemen.", native: { en: "One in four people will have to deal with mental health problems at some point in their life." } }
    - { id: nl-b2-t06-s02, target: "Toch wordt er nog weinig over gepraat.", native: { en: "Yet it is still rarely talked about." } }
    - { id: nl-b2-t06-s03, target: "Wie een gebroken been heeft, krijgt bloemen en bezoek.", native: { en: "Anyone with a broken leg gets flowers and visitors." } }
    - { id: nl-b2-t06-s04, target: "Wie een depressie heeft, durft het vaak niet te zeggen.", native: { en: "Anyone who has depression often doesn't dare to say so." } }
  - - { id: nl-b2-t06-s05, target: "Volgens hulpverleners is dat taboe een van de belangrijkste redenen waarom mensen pas laat hulp zoeken.", native: { en: "According to counsellors that taboo is one of the main reasons why people only look for help late." } }
    - { id: nl-b2-t06-s06, target: "Gemiddeld wachten mensen meer dan een jaar voor ze met iemand over hun klachten praten.", native: { en: "On average people wait more than a year before they talk to someone about their symptoms." } }
    - { id: nl-b2-t06-s07, target: "In die tijd kunnen de problemen erger worden, met gevolgen voor het werk, de relatie en de lichamelijke gezondheid.", native: { en: "In that time the problems can get worse, with consequences for work, the relationship and physical health." } }
  - - { id: nl-b2-t06-s08, target: "De huisarts is meestal de eerste stap.", native: { en: "The GP is usually the first step." } }
    - { id: nl-b2-t06-s09, target: "Hij luistert, stelt een diagnose en kan doorverwijzen naar een psycholoog of een psychiater.", native: { en: "He listens, makes a diagnosis and can refer you to a psychologist or a psychiatrist." } }
    - { id: nl-b2-t06-s10, target: "Sinds enkele jaren wordt een deel van de sessies bij een psycholoog door het ziekenfonds terugbetaald.", native: { en: "For some years now part of the sessions with a psychologist have been refunded by the health insurance fund." } }
    - { id: nl-b2-t06-s11, target: "Daardoor is de hulp voor veel meer mensen betaalbaar geworden.", native: { en: "As a result the help has become affordable for many more people." } }
  - - { id: nl-b2-t06-s12, target: "Het probleem blijven de wachtlijsten.", native: { en: "The waiting lists remain the problem." } }
    - { id: nl-b2-t06-s13, target: "In sommige regio's wacht je drie tot zes maanden op een eerste gesprek.", native: { en: "In some regions you wait three to six months for a first conversation." } }
    - { id: nl-b2-t06-s14, target: "Er worden daarom ook online gesprekken aangeboden, die sneller beschikbaar zijn.", native: { en: "That is why online sessions, which are available sooner, are also offered." } }
  - - { id: nl-b2-t06-s15, target: "Ook preventie speelt een grote rol.", native: { en: "Prevention also plays a big role." } }
    - { id: nl-b2-t06-s16, target: "Genoeg slaap, beweging en contact met anderen verlagen het risico op een depressie.", native: { en: "Enough sleep, exercise and contact with others lower the risk of depression." } }
    - { id: nl-b2-t06-s17, target: "Op steeds meer scholen en in bedrijven worden workshops georganiseerd over stress en mentaal welzijn.", native: { en: "At more and more schools and in companies workshops are organised about stress and mental well-being." } }
  - - { id: nl-b2-t06-s18, target: "De belangrijkste boodschap is eenvoudig: praat erover.", native: { en: "The most important message is simple: talk about it." } }
    - { id: nl-b2-t06-s19, target: "Met een vriend, een familielid of een hulpverlener.", native: { en: "With a friend, a family member or a counsellor." } }
    - { id: nl-b2-t06-s20, target: "Hulp vragen is geen teken van zwakte, maar van kracht.", native: { en: "Asking for help is not a sign of weakness, but of strength." } }
