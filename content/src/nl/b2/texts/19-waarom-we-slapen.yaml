  extra:
    - { id: nl-b2-t19-x1, target: "Daarom slapen dieren nooit.", native: { en: "That is why animals never sleep." } }
questions:
  - { id: nl-b2-t19-q1, type: summary, options: ["Slaap is belangrijk voor het geheugen en de gezondheid, maar veel mensen slapen te weinig, onder meer door schermen.", "Slaap is belangrijk voor het geheugen en de gezondheid, en de meeste mensen slapen genoeg, ook als ze 's avonds naar een scherm kijken.", "Iedereen heeft precies acht uur slaap nodig."], correct: 0 }
  - { id: nl-b2-t19-q2, type: mc, question: "Wat toonde het experiment met de lijst woorden?", options: ["Wie goed sliep, kende de volgende ochtend meer woorden.", "Wie wakker bleef, onthield de woorden beter.", "Slaap heeft geen invloed op het geheugen."], correct: 0 }
  - { id: nl-b2-t19-q3, type: true_false_notgiven, statement: "Mensen die veel sporten, slapen beter.", answer: not_given }
  - { id: nl-b2-t19-q4, type: true_false_notgiven, statement: "Bij tieners is het percentage dat minder dan zes uur slaapt lager dan bij volwassenen.", answer: false }
  - { id: nl-b2-t19-q5, type: true_false_notgiven, statement: "Vroeger dachten wetenschappers dat de hersenen 's nachts rusten.", answer: true }
  - { id: nl-b2-t19-q6, type: mc, question: "Waarom houdt een scherm je wakker?", options: ["Het blauwe licht laat de hersenen denken dat het nog dag is.", "De gsm maakt te veel lawaai.", "Je leest te veel nieuws."], correct: 0 }
