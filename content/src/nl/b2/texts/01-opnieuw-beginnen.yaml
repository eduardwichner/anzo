questions:
  - { id: nl-b2-t01-q1, type: summary, options: ["Een vrouw vertelt hoe ze na een moeilijk begin een nieuw leven in een andere stad heeft opgebouwd.", "Een vrouw vertelt hoe ze na een moeilijk begin terug naar haar oude stad is verhuisd, omdat ze er geen vrienden vond.", "Psychologen raden mensen aan om niet naar een stad te verhuizen waar ze niemand kennen."], correct: 0 }
  - { id: nl-b2-t01-q2, type: mc, question: "Waarom heeft Sarah lang geaarzeld?", options: ["Ze wist niet of ze vrienden zou kunnen maken.", "Ze had nog geen job in Gent.", "Haar ouders wilden niet dat ze verhuisde."], correct: 0 }
  - { id: nl-b2-t01-q3, type: true_false_notgiven, statement: "Sarah voelde zich vooral overdag eenzaam.", answer: false }
  - { id: nl-b2-t01-q4, type: true_false_notgiven, statement: "Sarah woont nu samen met iemand van de loopclub.", answer: not_given }
