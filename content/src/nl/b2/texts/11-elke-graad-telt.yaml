questions:
  - { id: nl-b2-t11-q1, type: summary, options: ["De auteur vindt dat België sneller iets moet doen tegen de opwarming van de aarde en geeft drie oplossingen.", "De auteur vindt dat België genoeg doet tegen de opwarming van de aarde en dat er geen nieuwe oplossingen nodig zijn.", "De auteur beschrijft vooral hoe warm het vorige zomer in Antwerpen was."], correct: 0 }
  - { id: nl-b2-t11-q2, type: mc, question: "Waarom moet de overheid gezinnen helpen bij het isoleren?", options: ["Veel mensen kunnen de kosten niet alleen dragen.", "Gezinnen weten niet hoe isoleren werkt.", "Isoleren is verplicht vanaf 2030."], correct: 0 }
  - { id: nl-b2-t11-q3, type: true_false_notgiven, statement: "Volgens de auteur zijn de doelstellingen voor 2030 niet ambitieus.", answer: false }
  - { id: nl-b2-t11-q4, type: true_false_notgiven, statement: "Per inwoner stoten mensen in België meer broeikasgassen uit dan mensen in de meeste andere landen.", answer: true }
  - { id: nl-b2-t11-q5, type: true_false_notgiven, statement: "De auteur woont zelf in Antwerpen.", answer: not_given }
  - { id: nl-b2-t11-q6, type: mc, question: "Wat wil de auteur zeggen met 'Niets doen kost echter veel meer'?", options: ["De schade van extreem weer is duurder dan de maatregelen.", "Maatregelen zijn altijd goedkoop.", "We moeten minder geld uitgeven aan het klimaat."], correct: 0 }
