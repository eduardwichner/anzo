id: nl-b2-t11
kind: reading
title: { en: Every degree counts }
topic: Climate and energy (an opinion piece in a newspaper)
level: B2
paragraphs:
  - - { id: nl-b2-t11-s01, target: "Wie vorige zomer in Antwerpen woonde, herinnert zich de hittegolf nog goed.", native: { en: "Anyone who lived in Antwerp last summer still remembers the heatwave well." } }
    - { id: nl-b2-t11-s02, target: "Twee weken lang werd het elke dag meer dan dertig graden, en in sommige appartementen was het 's nachts nog warmer dan overdag.", native: { en: "For two weeks it was over thirty degrees every day, and in some flats it was even warmer at night than during the day." } }
    - { id: nl-b2-t11-s03, target: "Een paar maanden later stonden in Wallonië hele straten onder water.", native: { en: "A few months later whole streets in Wallonia were under water." } }
  - - { id: nl-b2-t11-s04, target: "Extreem weer is geen probleem van ver weg meer.", native: { en: "Extreme weather is no longer a distant problem." } }
    - { id: nl-b2-t11-s05, target: "Wetenschappers zijn het er al lang over eens dat de opwarming van de aarde door de mens wordt veroorzaakt.", native: { en: "Scientists have long agreed that global warming is caused by humans." } }
    - { id: nl-b2-t11-s06, target: "Toch gaat het beleid in ons land nog altijd te langzaam.", native: { en: "Yet policy in our country still moves too slowly." } }
    - { id: nl-b2-t11-s07, target: "De doelstellingen voor 2030 zijn weliswaar ambitieus, maar de maatregelen om ze te halen ontbreken.", native: { en: "The targets for 2030 are admittedly ambitious, but the measures to reach them are missing." } }
  - - { id: nl-b2-t11-s08, target: "Een veelgehoord argument is dat België te klein is om iets te veranderen.", native: { en: "An argument often heard is that Belgium is too small to change anything." } }
    - { id: nl-b2-t11-s09, target: "Dat klopt niet.", native: { en: "That is not right." } }
    - { id: nl-b2-t11-s10, target: "Per inwoner stoten wij meer broeikasgassen uit dan de inwoners van de meeste andere landen in de wereld.", native: { en: "Per inhabitant we emit more greenhouse gases than most countries in the world." } }
    - { id: nl-b2-t11-s11, target: "Bovendien hebben we de kennis en het geld om het goede voorbeeld te geven.", native: { en: "Moreover, we have the knowledge and the money to set a good example." } }
  - - { id: nl-b2-t11-s12, target: "Wat moet er dan gebeuren?", native: { en: "What has to happen, then?" } }
    - { id: nl-b2-t11-s13, target: "Ten eerste moeten we sneller overschakelen op hernieuwbare energie, zoals windturbines op zee en zonnepanelen op elk geschikt dak.", native: { en: "First, we have to switch faster to renewable energy, such as wind turbines at sea and solar panels on every suitable roof." } }
    - { id: nl-b2-t11-s14, target: "Ten tweede moet de overheid gezinnen helpen om hun huis te isoleren, aangezien veel mensen de kosten niet alleen kunnen dragen.", native: { en: "Second, the government has to help families insulate their homes, since many people cannot carry the costs alone." } }
    - { id: nl-b2-t11-s15, target: "En ten slotte moeten we onze steden voorbereiden op meer hitte en meer regen, met meer bomen en minder beton.", native: { en: "And finally we have to prepare our cities for more heat and more rain, with more trees and less concrete." } }
  - - { id: nl-b2-t11-s16, target: "Dat kost geld, zeker.", native: { en: "That costs money, certainly." } }
    - { id: nl-b2-t11-s17, target: "Niets doen kost echter veel meer: elke overstroming en elke mislukte oogst betalen we immers ook zelf.", native: { en: "Doing nothing, however, costs much more: after all, we also pay for every flood and every failed harvest ourselves." } }
    - { id: nl-b2-t11-s18, target: "Elke graad opwarming die we vermijden, telt.", native: { en: "Every degree of warming that we avoid counts." } }
    - { id: nl-b2-t11-s19, target: "Daarom is wachten geen keuze meer.", native: { en: "That is why waiting is no longer an option." } }
