  - { id: nl-b2-t12-q1, type: summary, options: ["Marc legt het plan uit om de auto uit het centrum te halen; Femke is bezorgd over haar klanten, maar wil helpen.", "Marc legt het plan uit om de auto uit het centrum te halen; Femke vindt het plan slecht en weigert om te helpen.", "Femke wil een nieuw winkelcentrum buiten de stad openen."], correct: 0 }
  - { id: nl-b2-t12-q2, type: mc, question: "Hoe komen mensen van buiten de stad volgens Marc naar het centrum?", options: ["Ze parkeren aan de rand en nemen een gratis bus.", "Ze mogen met de auto tot in het centrum rijden.", "Ze nemen de trein."], correct: 0 }
  - { id: nl-b2-t12-q3, type: true_false_notgiven, statement: "Femke heeft een winkel met kleren in het centrum.", answer: not_given }
  - { id: nl-b2-t12-q4, type: true_false_notgiven, statement: "Femke weigert om naar het overleg te komen.", answer: false }
  - { id: nl-b2-t12-q5, type: true_false_notgiven, statement: "Volgens Femke zijn sommige bussen nu al een kwartier te laat.", answer: true }
