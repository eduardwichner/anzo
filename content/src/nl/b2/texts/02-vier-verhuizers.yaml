id: nl-b2-t02
kind: reading
title: { en: Four people who moved }
topic: A new chapter (four short posts on a forum about moving)
level: B2
paragraphs:
  - - { id: nl-b2-t02-s01, target: "Ik ben voor mijn werk naar Antwerpen verhuisd.", native: { en: "I moved to Antwerp for my work." } }
    - { id: nl-b2-t02-s02, target: "Aanvankelijk miste ik de rust van het platteland, maar inmiddels geniet ik van de drukte.", native: { en: "At first I missed the peace of the countryside, but by now I enjoy the bustle." } }
    - { id: nl-b2-t02-s03, target: "Er is altijd wel iets te beleven.", native: { en: "There's always something going on." } }
  - - { id: nl-b2-t02-s04, target: "Mijn moedertaal is Frans en ik woon nu twee jaar in Leuven.", native: { en: "My mother tongue is French and I've been living in Leuven for two years now." } }
    - { id: nl-b2-t02-s05, target: "Het moeilijkste vond ik de taal, want iedereen sprak zo snel.", native: { en: "I found the language the hardest thing, because everyone spoke so fast." } }
    - { id: nl-b2-t02-s06, target: "Een avondcursus Nederlands heeft me enorm geholpen.", native: { en: "An evening course in Dutch helped me enormously." } }
  - - { id: nl-b2-t02-s07, target: "Ik ben spontaan naar Brussel verhuisd, zonder echt een plan.", native: { en: "I moved to Brussels on the spur of the moment, without a real plan." } }
    - { id: nl-b2-t02-s08, target: "Achteraf gezien was dat niet zo slim, want het duurde maanden voor ik een betaalbaar appartement vond.", native: { en: "In hindsight that wasn't very clever, because it took months before I found an affordable flat." } }
  - - { id: nl-b2-t02-s09, target: "Na twintig jaar in het buitenland ben ik teruggekeerd naar Brugge.", native: { en: "After twenty years abroad I went back to Bruges." } }
    - { id: nl-b2-t02-s10, target: "Gek genoeg voelde mijn eigen stad onbekend aan.", native: { en: "Strangely enough, my own town felt unknown." } }
    - { id: nl-b2-t02-s11, target: "Ik moest alles opnieuw ontdekken, zelfs de weg naar de bakker.", native: { en: "I had to discover everything again, even the way to the baker's." } }
