id: nl-b2-u12
title: { en: Society and diversity }
icon: people
topic: Living together in a diverse society, newcomers and integration, prejudice and respect, volunteering and solidarity between generations; the past conditional (ik zou het gedaan hebben, als ik het geweten had)
vocabulary:
