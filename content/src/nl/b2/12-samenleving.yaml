  - { target: solidair, native: { en: "showing solidarity, supportive" }, pos: adjective }
  - { target: het engagement, native: { en: "commitment, involvement" }, pos: noun, plural: "-" }
  - { target: zich engageren, native: { en: "to commit oneself, to get involved" }, pos: verb }
  - { target: bijdragen, native: { en: "to contribute (+ aan)" }, pos: verb }
  - { target: de senior, native: { en: "senior (citizen), older person" }, pos: noun, plural: senioren }
  - { target: de Vlaming, native: { en: "Fleming (a Flemish person)" }, pos: noun, plural: Vlamingen }
  - { target: de Belg, native: { en: "Belgian (person)" }, pos: noun, plural: Belgen }
