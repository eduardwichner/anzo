  - { target: de drukte, native: { en: "bustle, crowds" }, pos: noun, plural: "-" }
  - { target: de moedertaal, native: { en: mother tongue }, pos: noun, plural: moedertalen }
  - { target: het accent, native: { en: accent }, pos: noun, plural: accenten }
