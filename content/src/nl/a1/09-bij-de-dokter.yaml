sentences:
  - { id: s01, target: "Ik heb veel pijn.", native: { en: "I'm in a lot of pain." }, items: [nl.pijn] }
  - { id: s02, target: "Waar hebt u pijn?", native: { en: "Where does it hurt?" }, items: [nl.pijn] }
  - { id: s03, target: "Ik heb hoofdpijn.", native: { en: "I have a headache." }, items: [nl.hoofdpijn] }
  - { id: s04, target: "Mijn zoon heeft buikpijn.", native: { en: "My son has a stomach ache." }, items: [nl.buikpijn] }
  - { id: s05, target: "Ik heb keelpijn en koorts.", native: { en: "I have a sore throat and a fever." }, items: [nl.keelpijn, nl.koorts], acceptAlso: ["Ik heb koorts en keelpijn."] }
  - { id: s06, target: "Hebt u koorts?", native: { en: "Do you have a temperature?" }, items: [nl.koorts] }
