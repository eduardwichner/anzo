  - { id: s11, target: "Waar zijn mijn handschoenen?", native: { en: "Where are my gloves?" }, items: [nl.handschoen] }
  - { id: s12, target: "Deze laarzen zijn warm.", native: { en: "These boots are warm." }, items: [nl.laars] }
  - { id: s13, target: "Ik zoek een zwarte tas.", native: { en: "I'm looking for a black bag." }, items: [nl.tas] }
  - { id: s14, target: "Ik heb mijn bril niet bij me.", native: { en: "I don't have my glasses with me." }, items: [nl.bril] }
  - { id: s15, target: "Deze schoenen zijn te breed.", native: { en: "These shoes are too wide." }, items: [nl.breed] }
  - { id: s16, target: "De schoenen zijn te smal.", native: { en: "The shoes are too narrow." }, items: [nl.smal] }
  - { id: s17, target: "Deze jas is te dun voor de winter.", native: { en: "This coat is too thin for winter." }, items: [nl.dun] }
