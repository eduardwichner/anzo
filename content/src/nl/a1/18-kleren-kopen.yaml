sentences:
  - { id: s01, target: "De kledingwinkel is op het plein.", native: { en: "The clothes shop is on the square." }, items: [nl.kledingwinkel] }
  - { id: s02, target: "Welke maat hebt u?", native: { en: "What size are you?" }, items: [nl.maat] }
  - { id: s03, target: "Hebt u deze broek in maat 40?", native: { en: "Do you have these trousers in size 40?" }, items: [nl.maat] }
  - { id: s04, target: "Waar is de paskamer?", native: { en: "Where is the fitting room?" }, items: [nl.paskamer] }
  - { id: s05, target: "Mag ik deze jas passen?", native: { en: "Can I try this coat on?" }, items: [nl.passen] }
  - { id: s06, target: "De schoenen passen niet.", native: { en: "The shoes don't fit." }, items: [nl.passen] }
  - { id: s07, target: "Probeert u deze trui eens.", native: { en: "Try this jumper." }, items: [nl.proberen] }
  - { id: s08, target: "Kan ik dit hemd ruilen?", native: { en: "Can I exchange this shirt?" }, items: [nl.ruilen] }
  - { id: s09, target: "In de winter draag ik een muts.", native: { en: "In winter I wear a woolly hat." }, items: [nl.muts], acceptAlso: ["Ik draag in de winter een muts."] }
