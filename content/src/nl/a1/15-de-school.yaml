sentences:
  - { id: s01, target: "De juf heet Sara.", native: { en: "The teacher is called Sara." }, items: [nl.juf] }
  - { id: s02, target: "Meester Jan is heel vriendelijk.", native: { en: "Jan, the teacher, is very friendly." }, items: [nl.meester] }
  - { id: s03, target: "Ik wil met de leerkracht spreken.", native: { en: "I want to talk to the teacher." }, items: [nl.leerkracht] }
  - { id: s04, target: "Mijn broer is leraar Frans.", native: { en: "My brother is a French teacher." }, items: [nl.leraar] }
  - { id: s05, target: "De school begint om half negen.", native: { en: "School starts at half past eight." }, items: [nl.les], acceptAlso: ["Om half negen begint de school."] }
  - { id: s06, target: "Mijn zoon zit in de klas van juf Sara.", native: { en: "My son is in Miss Sara's class." }, items: [nl.klas] }
  - { id: s07, target: "Er zijn twintig leerlingen in de klas.", native: { en: "There are twenty pupils in the class." }, items: [nl.leerling, nl.klas], acceptAlso: ["In de klas zijn er twintig leerlingen."] }
  - { id: s08, target: "Maak eerst je huiswerk.", native: { en: "Do your homework first." }, items: [nl.huiswerk] }
  - { id: s09, target: "Vrijdag krijgen de kinderen hun rapport.", native: { en: "On Friday the children get their school report." }, items: [nl.rapport], acceptAlso: ["De kinderen krijgen vrijdag hun rapport."] }
  - { id: s10, target: "Je boekentas staat bij de deur.", native: { en: "Your school bag is by the door." }, items: [nl.boekentas] }
  - { id: s11, target: "Je brooddoos zit in je boekentas.", native: { en: "Your lunch box is in your school bag." }, items: [nl.brooddoos] }
  - { id: s12, target: "De kinderen spelen op de speelplaats.", native: { en: "The children are playing in the playground." }, items: [nl.speelplaats], acceptAlso: ["Op de speelplaats spelen de kinderen."] }
  - { id: s13, target: "In juli is het vakantie.", native: { en: "The holidays are in July." }, items: [nl.vakantie], acceptAlso: ["Het is vakantie in juli."] }
  - { id: s14, target: "Op dinsdag heeft hij turnles.", native: { en: "On Tuesdays he has PE." }, items: [nl.turnles], acceptAlso: ["Hij heeft op dinsdag turnles."] }
  - { id: s15, target: "Schrijf het in je schrift.", native: { en: "Write it in your exercise book." }, items: [nl.schrift] }
  - { id: s16, target: "Mag ik even je pen?", native: { en: "Can I borrow your pen for a moment?" }, items: [nl.pen], acceptAlso: ["Mag ik je pen even?"] }
  - { id: s17, target: "Ik teken met een potlood.", native: { en: "I'm drawing with a pencil." }, items: [nl.potlood, nl.tekenen] }
