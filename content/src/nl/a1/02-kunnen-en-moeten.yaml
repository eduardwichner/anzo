  - { id: s03, target: "Ik moet om acht uur op mijn werk zijn.", native: { en: "I have to be at work at eight o'clock." }, items: [nl.moeten], acceptAlso: ["Om acht uur moet ik op mijn werk zijn."] }
  - { id: s04, target: "Mag ik mijn fiets hier zetten?", native: { en: "May I leave my bike here?" }, items: [nl.mogen], acceptAlso: ["Mag ik hier mijn fiets zetten?"] }
  - { id: s05, target: "Je mag hier niet fietsen.", native: { en: "You're not allowed to cycle here." }, items: [nl.mogen], acceptAlso: ["Hier mag je niet fietsen."] }
