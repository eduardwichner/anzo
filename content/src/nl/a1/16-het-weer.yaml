  - { id: s19, target: "In februari is het koud.", native: { en: "In February it's cold." }, items: [nl.februari], acceptAlso: ["Het is koud in februari."] }
  - { id: s20, target: "In maart begint de lente.", native: { en: "Spring starts in March." }, items: [nl.maart, nl.lente], acceptAlso: ["De lente begint in maart."] }
  - { id: s21, target: "Mijn moeder is in april jarig.", native: { en: "My mother's birthday is in April." }, items: [nl.april] }
  - { id: s22, target: "In mei is het weer vaak mooi.", native: { en: "In May the weather is often nice." }, items: [nl.mei] }
  - { id: s23, target: "In juni zijn de dagen lang.", native: { en: "In June the days are long." }, items: [nl.juni] }
