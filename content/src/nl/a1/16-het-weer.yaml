  - { id: s25, target: "In augustus is het warm.", native: { en: "In August it's warm." }, items: [nl.augustus], acceptAlso: ["Het is warm in augustus."] }
  - { id: s26, target: "In september gaan de kinderen weer naar school.", native: { en: "In September the children go back to school." }, items: [nl.september], acceptAlso: ["De kinderen gaan in september weer naar school."] }
  - { id: s27, target: "Mijn zoon is in oktober jarig.", native: { en: "My son's birthday is in October." }, items: [nl.oktober], acceptAlso: ["Mijn zoon is jarig in oktober.", "In oktober is mijn zoon jarig."] }
  - { id: s28, target: "November is een donkere maand.", native: { en: "November is a dark month." }, items: [nl.november] }
  - { id: s29, target: "In december sneeuwt het soms.", native: { en: "In December it sometimes snows." }, items: [nl.december] }
  - { id: s30, target: "Ik ben op 12 mei jarig.", native: { en: "My birthday is on 12 May." }, items: [nl.mei], acceptAlso: ["Op 12 mei ben ik jarig."] }
