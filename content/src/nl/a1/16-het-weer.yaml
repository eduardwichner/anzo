sentences:
  - { id: s01, target: "Hoe is het weer vandaag?", native: { en: "What's the weather like today?" }, items: [nl.weer-n] }
  - { id: s02, target: "De zon schijnt.", native: { en: "The sun is shining." }, items: [nl.zon, nl.schijnen] }
  - { id: s03, target: "Er komt veel regen.", native: { en: "There's a lot of rain on the way." }, items: [nl.regen] }
  - { id: s04, target: "Het waait vandaag.", native: { en: "It's windy today." }, items: [nl.waaien], acceptAlso: ["Vandaag waait het."] }
  - { id: s05, target: "De wind is koud.", native: { en: "The wind is cold." }, items: [nl.wind] }
  - { id: s06, target: "In de winter ligt er soms sneeuw.", native: { en: "In winter there's sometimes snow on the ground." }, items: [nl.sneeuw, nl.winter] }
