  - { id: s09, target: "Het sneeuwt!", native: { en: "It's snowing!" }, items: [nl.sneeuwen] }
  - { id: s10, target: "Mijn jas is nat.", native: { en: "My coat is wet." }, items: [nl.nat] }
  - { id: s11, target: "Morgen is het droog.", native: { en: "Tomorrow it'll be dry." }, items: [nl.droog], acceptAlso: ["Het is morgen droog."] }
  - { id: s12, target: "Het is twintig graden.", native: { en: "It's twenty degrees." }, items: [nl.graad] }
  - { id: s13, target: "Neem een paraplu!", native: { en: "Take an umbrella!" }, items: [nl.paraplu] }
  - { id: s14, target: "In de lente is het weer mooi.", native: { en: "In spring the weather is nice." }, items: [nl.lente], acceptAlso: ["Het weer is mooi in de lente."] }
