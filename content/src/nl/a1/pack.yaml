source: >-
  Dutch as spoken in Flanders (standard Belgian Dutch), level A1 for adult English speakers. Every word is in the derived
  Dutch word list (content/src/nl/WORDLIST.md, npm run content:wordlist -- nl) at level A1 or Start: NT2Lex (Tack et al.
  2018, CC BY-NC-SA 4.0) levels by first observation, attestations in Naar Nederland (werkboek, word list) and topic
  additions for Belgian standard forms and Flemish everyday tasks. Units follow the Richtgraad 1 domains and roles of
  Flemish adult education (content/src/nl/SOURCES.md). Grammar: inversion (V2), separable verbs, modal verbs, basic er,
  possessives, time expressions, numbers to 1000, diminutives. English meanings written by the content author; plan:
  content/src/nl/PLAN.md.
