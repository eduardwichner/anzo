id: nl-pre-a1-u01
title: { en: Hello! }
icon: hello
topic: Greetings and politeness
vocabulary:
  - { target: hallo, native: { en: hello }, pos: exclamation, avoid: [nl.dag-groet] }
  - { id: nl.dag-groet, target: dag, native: { en: "hello, goodbye" }, pos: exclamation }
  - { target: goedemorgen, native: { en: good morning }, pos: exclamation }
  - { target: goedemiddag, native: { en: good afternoon }, pos: exclamation }
  - { target: goedenavond, native: { en: good evening }, pos: exclamation }
  - { target: goedenacht, native: { en: good night }, pos: exclamation }
  - { target: tot ziens, native: { en: goodbye }, pos: phrase, avoid: [nl.dag-groet, nl.tot-straks, nl.tot-morgen] }
  - { target: tot straks, native: { en: see you later }, pos: phrase, avoid: [nl.tot-morgen] }
  - { target: tot morgen, native: { en: see you tomorrow }, pos: phrase }
  - { target: hoe gaat het, native: { en: how are you }, pos: phrase }
  - { target: goed, native: { en: "good, fine" }, pos: adjective }
  - { target: prima, native: { en: "fine, great" }, pos: adverb }
  - { target: ja, native: { en: "yes" }, pos: exclamation }
  - { target: nee, native: { en: "no" }, pos: exclamation }
  - { target: oké, native: { en: OK }, pos: exclamation }
  - { target: dank u wel, native: { en: "thank you (formal)" }, pos: phrase, avoid: [nl.dank-je-wel, nl.bedankt] }
  - { target: dank je wel, native: { en: "thank you (informal)" }, pos: phrase, avoid: [nl.bedankt] }
  - { target: bedankt, native: { en: thanks }, pos: exclamation }
  - { target: alstublieft, native: { en: "please, you're welcome (formal)" }, pos: exclamation, avoid: [nl.alsjeblieft] }
  - { target: alsjeblieft, native: { en: "please, you're welcome (informal)" }, pos: exclamation }
  - { target: graag, native: { en: "gladly, I'd like" }, pos: adverb }
  - { target: sorry, native: { en: sorry }, pos: exclamation, avoid: [nl.pardon] }
  - { target: pardon, native: { en: "excuse me, pardon" }, pos: exclamation }
  - { target: welkom, native: { en: welcome }, pos: exclamation }
  - { target: de meneer, native: { en: "sir, Mr" }, pos: noun, plural: meneren }
  - { target: de mevrouw, native: { en: "madam, Mrs, Ms" }, pos: noun, plural: mevrouwen }
  - { target: de koffie, native: { en: coffee }, pos: noun, plural: "-", avoid: [nl.thee] }
sentences:
  - { id: s01, target: "Hallo Danca!", native: { en: "Hello, Danca!" }, items: [nl.hallo] }
  - { id: s02, target: "Dag mevrouw.", native: { en: "Hello, madam." }, items: [nl.dag-groet, nl.mevrouw] }
  - { id: s03, target: "Goedemorgen meneer!", native: { en: "Good morning, sir!" }, items: [nl.goedemorgen, nl.meneer] }
  - { id: s04, target: "Goedemiddag mevrouw Peeters.", native: { en: "Good afternoon, Mrs Peeters." }, items: [nl.goedemiddag, nl.mevrouw] }
  - { id: s05, target: "Goedenavond Tom.", native: { en: "Good evening, Tom." }, items: [nl.goedenavond] }
  - { id: s06, target: "Goedenacht Lisa!", native: { en: "Good night, Lisa!" }, items: [nl.goedenacht] }
  - { id: s07, target: "Dag mevrouw, tot ziens!", native: { en: "Goodbye, madam!" }, items: [nl.dag-groet, nl.tot-ziens, nl.mevrouw] }
