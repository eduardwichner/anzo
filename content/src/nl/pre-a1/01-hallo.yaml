  - { id: s12, target: "Prima, dank u wel.", native: { en: "Fine, thank you." }, items: [nl.prima, nl.dank-u-wel] }
  - { id: s13, target: "Ja, graag!", native: { en: "Yes, please!" }, items: [nl.ja, nl.graag] }
  - { id: s14, target: "Nee, dank je wel.", native: { en: "No, thank you." }, items: [nl.nee, nl.dank-je-wel] }
  - { id: s15, target: "Bedankt, Maria!", native: { en: "Thanks, Maria!" }, items: [nl.bedankt] }
  - { id: s16, target: "Een koffie, alstublieft.", native: { en: "A coffee, please." }, items: [nl.alstublieft, nl.koffie] }
  - { id: s17, target: "Water, alsjeblieft.", native: { en: "Water, please." }, items: [nl.alsjeblieft] }
  - { id: s18, target: "Sorry, meneer!", native: { en: "Sorry, sir!" }, items: [nl.sorry, nl.meneer] }
  - { id: s19, target: "Pardon, mevrouw?", native: { en: "Excuse me, madam?" }, items: [nl.pardon, nl.mevrouw] }
  - { id: s20, target: "Welkom in Gent!", native: { en: "Welcome to Ghent!" }, items: [nl.welkom] }
  - { id: s21, target: "Hoe gaat het, mevrouw?", native: { en: "How are you, madam?" }, items: [nl.hoe-gaat-het, nl.mevrouw] }
  - { id: s22, target: "Het gaat goed.", native: { en: "I'm fine." }, items: [nl.goed] }
  - { id: s23, target: "Oké, dank u wel, meneer.", native: { en: "OK, thank you, sir." }, items: [nl.oke, nl.dank-u-wel, nl.meneer] }
lessons:
  - { id: l01, title: { en: Hello and goodbye }, vocab: [nl.hallo, nl.dag-groet, nl.goedemorgen, nl.goedemiddag, nl.goedenavond, nl.goedenacht, nl.tot-ziens, nl.tot-straks, nl.tot-morgen] }
  - { id: l02, title: { en: How are you? }, vocab: [nl.hoe-gaat-het, nl.goed, nl.prima, nl.ja, nl.nee, nl.oke, nl.dank-u-wel, nl.dank-je-wel] }
  - { id: l03, title: { en: Please and thank you }, vocab: [nl.koffie, nl.bedankt, nl.alstublieft, nl.alsjeblieft, nl.graag, nl.sorry, nl.pardon, nl.welkom, nl.meneer, nl.mevrouw] }
