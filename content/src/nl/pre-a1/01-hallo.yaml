  - { id: s09, target: "Dag Jan, tot morgen!", native: { en: "Bye, Jan, see you tomorrow!" }, items: [nl.dag-groet, nl.tot-morgen] }
  - { id: s10, target: "Hallo Ahmed, hoe gaat het?", native: { en: "Hello, Ahmed, how are you?" }, items: [nl.hallo, nl.hoe-gaat-het] }
