  - { target: de functie, native: { en: "position, post (a job)" }, pos: noun, plural: functies }
  - { target: de motivatie, native: { en: motivation }, pos: noun, plural: "-" }
  - { target: de vaardigheid, native: { en: skill }, pos: noun, plural: vaardigheden }
  - { target: de eis, native: { en: requirement }, pos: noun, plural: eisen, avoid: [nl.voorwaarde] }
  - { target: het profiel, native: { en: profile }, pos: noun, plural: profielen }
  - { target: het aanbod, native: { en: "offer (what is offered)" }, pos: noun, plural: "-" }
