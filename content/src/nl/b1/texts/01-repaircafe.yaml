id: nl-b1-t01
kind: reading
title: { en: The repair café }
topic: Living in the neighbourhood (a local newsletter)
level: B1
paragraphs:
  - - { id: nl-b1-t01-s01, target: "Vorige maand ging de koffiemachine van Sofie kapot.", native: { en: "Last month Sofie's coffee machine broke down." } }
    - { id: nl-b1-t01-s02, target: "Een nieuwe kopen vond ze te duur, en de oude weggooien vond ze zonde.", native: { en: "She thought buying a new one was too expensive, and throwing the old one away a waste." } }
  - - { id: nl-b1-t01-s03, target: "Toen las ze in het stadsblad over het repaircafé in haar buurt.", native: { en: "Then she read in the local paper about the repair café in her neighbourhood." } }
    - { id: nl-b1-t01-s04, target: "Elke eerste zaterdag van de maand helpen vrijwilligers daar gratis met herstellingen.", native: { en: "Every first Saturday of the month volunteers help with repairs there, free of charge." } }
  - - { id: nl-b1-t01-s05, target: "Die zaterdag nam ze de machine mee naar het buurthuis.", native: { en: "That Saturday she took the machine to the community centre." } }
    - { id: nl-b1-t01-s06, target: "Eerst moest ze even wachten, maar daarna ging een vrijwilliger met haar aan tafel zitten.", native: { en: "First she had to wait a little, but then a volunteer sat down at a table with her." } }
    - { id: nl-b1-t01-s07, target: "Samen vonden ze het probleem: een kapot onderdeel van een paar euro.", native: { en: "Together they found the problem: a broken part that cost a few euros." } }
    - { id: nl-b1-t01-s10, target: "Het onderdeel moest besteld worden.", native: { en: "The part had to be ordered." } }
  - - { id: nl-b1-t01-s08, target: "Twee weken later werkte de machine weer.", native: { en: "Two weeks later the machine worked again." } }
    - { id: nl-b1-t01-s09, target: "Sofie was zo blij dat ze nu zelf af en toe komt helpen.", native: { en: "Sofie was so pleased that she now helps out there herself from time to time." } }
  - - { id: nl-b1-t01-s11, target: "Het repaircafé is open van tien tot vier uur. Iedereen is welkom.", native: { en: "The repair café is open from ten to four. Everyone is welcome." } }
glossary:
  - { word: stadsblad, native: { en: "local newspaper (from the town)" } }
  - { word: repaircafé, native: { en: "repair café (volunteers repair things for free)" } }
items: [nl.vrijwilliger, nl.buurthuis, nl.onderdeel, nl.weggooien]
