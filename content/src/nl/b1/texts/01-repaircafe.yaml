  - { id: nl-b1-t01-q2, type: true_false_notgiven, statement: "Het repaircafé is elke zaterdag open.", answer: false }
  - { id: nl-b1-t01-q3, type: true_false_notgiven, statement: "De vrijwilligers vragen geld voor hun hulp.", answer: false }
  - { id: nl-b1-t01-q4, type: true_false_notgiven, statement: "Het buurthuis ligt vlak bij het station.", answer: not_given }
