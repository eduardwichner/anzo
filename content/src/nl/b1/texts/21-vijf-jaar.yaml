  - { id: nl-b1-t21-q2, type: true_false_notgiven, statement: "Ze sprak al een beetje Nederlands toen ze in België aankwam.", answer: false }
  - { id: nl-b1-t21-q3, type: true_false_notgiven, statement: "Het duurde bijna twee jaar voordat haar diploma erkend werd.", answer: true }
  - { id: nl-b1-t21-q4, type: true_false_notgiven, statement: "Haar man werkt ook in een ziekenhuis.", answer: not_given }
