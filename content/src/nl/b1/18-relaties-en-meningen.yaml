  - { target: het begrip, native: { en: "understanding; concept" }, pos: noun, plural: begrippen }
  - { target: rekening houden met, native: { en: "to take into account" }, pos: phrase }
  - { target: het verschil, native: { en: difference }, pos: noun, plural: verschillen }
  - { target: de gewoonte, native: { en: habit }, pos: noun, plural: gewoontes }
  - { target: de schoonmoeder, native: { en: mother-in-law }, pos: noun, plural: schoonmoeders }
  - { target: de generatie, native: { en: generation }, pos: noun, plural: generaties }
