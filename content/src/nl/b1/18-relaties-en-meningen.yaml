id: nl-b1-u18
title: { en: Relationships and opinions }
icon: people
topic: Partners, family, habits; giving and defending an opinion (hoewel, enerzijds … anderzijds)
vocabulary:
  - { target: de relatie, native: { en: relationship }, pos: noun, plural: relaties }
  - { target: het koppel, native: { en: couple }, pos: noun, plural: koppels, alsoNL: het stel, avoid: [nl.een-paar] }
  - { target: samenwonen, native: { en: "to live together" }, pos: verb }
  - { target: scheiden, native: { en: "to divorce, to separate" }, pos: verb }
  - { target: de scheiding, native: { en: "divorce, separation" }, pos: noun, plural: scheidingen }
  - { target: de liefde, native: { en: love }, pos: noun, plural: "-" }
