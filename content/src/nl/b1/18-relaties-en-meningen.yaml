  - { target: het respect, native: { en: respect }, pos: noun, plural: "-" }
  - { target: de discussie, native: { en: "discussion, debate" }, pos: noun, plural: discussies }
  - { target: het argument, native: { en: argument (a reason) }, pos: noun, plural: argumenten }
  - { target: het standpunt, native: { en: "point of view, position" }, pos: noun, plural: standpunten }
  - { target: overtuigd, native: { en: convinced }, pos: adjective }
  - { target: akkoord, native: { en: "agreed, in agreement" }, pos: adjective }
  - { target: oneens, native: { en: "in disagreement (as in: to disagree)" }, pos: adjective }
  - { target: gelijk, native: { en: "equal; right (as in: to be right)" }, pos: adjective }
  - { target: enerzijds, native: { en: "on the one hand" }, pos: adverb, avoid: [nl.anderzijds] }
  - { target: anderzijds, native: { en: "on the other hand" }, pos: adverb }
  - { target: kortom, native: { en: "in short" }, pos: adverb }
