  - { target: le pantalon, native: { nl: de broek, en: "trousers" }, pos: noun, gender: m }
  - { target: la jupe, native: { nl: de rok, en: "skirt" }, pos: noun, gender: f }
  - { target: le t-shirt, native: { nl: het T-shirt, en: "T-shirt" }, pos: noun, gender: m }
  - { target: la chaussure, native: { nl: de schoen, en: "shoe" }, pos: noun, gender: f }
  - { target: le chapeau, native: { nl: de hoed, en: "hat" }, pos: noun, gender: m }
  - { target: le short, native: { nl: de korte broek, en: "shorts" }, pos: noun, gender: m, avoid: [fr.pantalon] }
  - { target: la veste, native: { nl: het jasje, en: "jacket" }, pos: noun, gender: f }
  - { target: le manteau, native: { nl: de jas, en: "coat" }, pos: noun, gender: m, avoid: [fr.veste] }
