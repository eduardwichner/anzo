  - { id: s18, target: "Il faut écouter.", native: { nl: "Je moet luisteren.", en: "You have to listen." }, items: [fr.il-faut] }
  - { id: s19, target: "Le bus arrive bientôt.", native: { nl: "De bus komt zo.", en: "The bus is coming soon." }, items: [fr.bientot] }
lessons:
  - { id: l01, title: { nl: Hoe en waar?, en: "How and where?" }, vocab: [fr.comment, fr.ou, fr.pourquoi, fr.quand, fr.combien, fr.qu-est-ce-que, fr.est-ce-que, fr.qui] }
  - { id: l02, title: { nl: En of ook, en: "And, or, too" }, vocab: [fr.quoi, fr.quel, fr.et, fr.ou-conj, fr.aussi, fr.il-faut, fr.bientot] }
