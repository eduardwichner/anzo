  - { target: "l'oiseau", native: { nl: de vogel, en: "bird" }, pos: noun, gender: m }
  - { target: le cheval, native: { nl: het paard, en: "horse" }, pos: noun, gender: m }
  - { target: le lapin, native: { nl: het konijn, en: "rabbit" }, pos: noun, gender: m }
  - { target: la souris, native: { nl: de muis, en: "mouse" }, pos: noun, gender: f }
  - { target: "l'éléphant", native: { nl: de olifant, en: "elephant" }, pos: noun, gender: m }
  - { target: la girafe, native: { nl: de giraf, en: "giraffe" }, pos: noun, gender: f }
