  - { id: s05, target: "Le jardin est derrière la maison.", native: { nl: "De tuin ligt achter het huis.", en: "The garden is behind the house." }, items: [fr.derriere] }
  - { id: s06, target: "Je suis à côté de Chloé.", native: { nl: "Ik zit naast Chloé.", en: "I'm next to Chloé." }, items: [fr.a-cote-de] }
