  - { target: sur, native: { nl: op, en: "on" }, pos: preposition }
  - { target: sous, native: { nl: onder, en: "under" }, pos: preposition }
  - { target: devant, native: { nl: voor, en: "in front of" }, pos: preposition }
  - { target: derrière, native: { nl: achter, en: "behind" }, pos: preposition }
  - { target: à côté de, native: { nl: naast, en: "next to" }, pos: preposition }
  - { target: chez, native: { nl: bij (iemand thuis), en: "at or to (someone's house)" }, pos: preposition }
  - { target: avec, native: { nl: met, en: "with" }, pos: preposition }
  - { target: pour, native: { nl: "voor (iemand), om te", en: "for, in order to" }, pos: preposition, avoid: [fr.devant] }
  - { target: loin, native: { nl: ver, en: "far" }, pos: adverb }
  - { target: il y a, native: { nl: "er is, er zijn", en: "there is, there are" }, pos: phrase }
sentences:
  - { id: s01, target: "Le chat est dans la boîte.", native: { nl: "De kat zit in de doos.", en: "The cat is in the box." }, items: [fr.dans] }
