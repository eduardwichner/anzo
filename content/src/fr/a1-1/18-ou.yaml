  - { id: s14, target: "Il y a un oiseau dans l'arbre.", native: { nl: "Er zit een vogel in de boom.", en: "There's a bird in the tree." }, items: [fr.il-y-a, fr.dans] }
lessons:
  - { id: l01, title: { nl: In en op, en: "In and on" }, vocab: [fr.dans, fr.sur, fr.sous, fr.devant, fr.derriere, fr.a-cote-de] }
  - { id: l02, title: { nl: Bij mij, en: "At my house" }, vocab: [fr.chez, fr.avec, fr.pour, fr.loin, fr.il-y-a] }
