id: fr-a1-1-u11
title: { nl: Lezen en schrijven, en: "Reading and writing" }
icon: school
topic: En classe; les consignes
vocabulary:
  - { target: lire, native: { nl: lezen, en: "to read" }, pos: verb }
  - { target: écrire, native: { nl: schrijven, en: "to write" }, pos: verb }
  - { target: dessiner, native: { nl: tekenen, en: "to draw" }, pos: verb }
  - { target: colorier, native: { nl: kleuren, en: "to colour in" }, pos: verb }
  - { target: écouter, native: { nl: luisteren, en: "to listen (to)" }, pos: verb }
  - { target: regarder, native: { nl: kijken (naar), en: "to look (at), to watch" }, pos: verb }
  - { target: parler, native: { nl: "praten, spreken", en: "to speak, to talk" }, pos: verb }
  - { target: répondre, native: { nl: antwoorden, en: "to answer" }, pos: verb }
  - { target: comprendre, native: { nl: begrijpen, en: "to understand" }, pos: verb }
  - { target: réfléchir, native: { nl: nadenken, en: "to think (carefully)" }, pos: verb }
