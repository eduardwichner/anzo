  - { target: poser, native: { nl: "(een vraag) stellen, neerleggen", en: "to ask (a question), to put down" }, pos: verb, avoid: [fr.mettre] }
  - { target: la question, native: { nl: de vraag, en: "question" }, pos: noun, gender: f }
