id: fr-a1-1-u15
title: { nl: Doe mee!, en: "Everyday verbs" }
icon: actions
topic: Les verbes être, avoir, aller, faire et autres
vocabulary:
  - { target: être, native: { nl: zijn, en: "to be" }, pos: verb }
  - { target: avoir, native: { nl: hebben, en: "to have" }, pos: verb }
  - { target: aller, native: { nl: gaan, en: "to go" }, pos: verb }
  - { target: faire, native: { nl: "doen, maken", en: "to do, to make" }, pos: verb }
  - { target: venir, native: { nl: komen, en: "to come" }, pos: verb }
  - { target: vouloir, native: { nl: willen, en: "to want" }, pos: verb }
  - { target: pouvoir, native: { nl: "kunnen, mogen", en: "can, to be able to, to be allowed to" }, pos: verb }
  - { target: devoir, native: { nl: moeten, en: "must, to have to" }, pos: verb }
  - { target: prendre, native: { nl: "pakken, nemen", en: "to take" }, pos: verb }
  - { target: mettre, native: { nl: "zetten, leggen, doen", en: "to put, to put on" }, pos: verb }
  - { target: donner, native: { nl: geven, en: "to give" }, pos: verb }
  - { target: dire, native: { nl: zeggen, en: "to say" }, pos: verb }
  - { target: voir, native: { nl: zien, en: "to see" }, pos: verb }
  - { target: aider, native: { nl: helpen, en: "to help" }, pos: verb }
sentences:
  - { id: s01, target: "Mon ami Côme est français.", native: { nl: "Mijn vriend Côme is Frans.", en: "My friend Côme is French." }, items: [fr.etre] }
  - { id: s02, target: "Tu es prêt ?", native: { nl: "Ben je klaar?", en: "Are you ready?" }, items: [fr.etre] }
  - { id: s03, target: "Nous avons un chat.", native: { nl: "We hebben een kat.", en: "We have a cat." }, items: [fr.avoir] }
