lessons:
  - { id: l01, title: { nl: Zijn en hebben, en: "To be and to have" }, vocab: [fr.etre, fr.avoir, fr.aller, fr.faire, fr.venir, fr.vouloir, fr.pouvoir] }
  - { id: l02, title: { nl: Pak je tas, en: "Take your bag" }, vocab: [fr.devoir, fr.prendre, fr.mettre, fr.donner, fr.dire, fr.voir, fr.aider] }
