  - { id: s03, target: "Est-ce que tes parents travaillent ?", native: { nl: "Werken je ouders?", en: "Do your parents work?" }, items: [fr.travailler] }
  - { id: s04, target: "Ma maman est médecin.", native: { nl: "Mijn mama is arts.", en: "My mum is a doctor." }, items: [fr.medecin] }
  - { id: s05, target: "Je vais chez le docteur.", native: { nl: "Ik ga naar de dokter.", en: "I'm going to the doctor's." }, items: [fr.docteur] }
  - { id: s06, target: "Le policier est devant la gare.", native: { nl: "De politieagent staat voor het station.", en: "The police officer is in front of the station." }, items: [fr.policier] }
  - { id: s07, target: "Mon oncle est pompier.", native: { nl: "Mijn oom is brandweerman.", en: "My uncle is a firefighter." }, items: [fr.pompier] }
