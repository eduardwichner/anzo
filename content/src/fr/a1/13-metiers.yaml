  - { id: s11, target: "Le cuisinier prépare la soupe.", native: { nl: "De kok maakt de soep.", en: "The cook is making the soup." }, items: [fr.cuisinier] }
  - { id: s12, target: "Mon chanteur préféré chante en anglais.", native: { nl: "Mijn lievelingszanger zingt in het Engels.", en: "My favourite singer sings in English." }, items: [fr.chanteur] }
