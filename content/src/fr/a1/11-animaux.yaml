sentences:
  - { id: s01, target: "Le serpent est long et vert.", native: { nl: "De slang is lang en groen.", en: "The snake is long and green." }, items: [fr.serpent] }
  - { id: s02, target: "L'ours dort dans la forêt.", native: { nl: "De beer slaapt in het bos.", en: "The bear is sleeping in the forest." }, items: [fr.ours, fr.foret] }
  - { id: s03, target: "Le crocodile a de grandes dents.", native: { nl: "De krokodil heeft grote tanden.", en: "The crocodile has big teeth." }, items: [fr.crocodile] }
