sentences:
  - { id: s01, target: "C'est un cadeau pour toi !", native: { nl: "Dit is een cadeautje voor jou!", en: "This is a present for you!" }, items: [fr.cadeau] }
  - { id: s02, target: "Il y a dix bougies sur le gâteau.", native: { nl: "Er staan tien kaarsjes op de taart.", en: "There are ten candles on the cake." }, items: [fr.bougie] }
  - { id: s03, target: "Surprise ! Bon anniversaire !", native: { nl: "Verrassing! Gefeliciteerd!", en: "Surprise! Happy birthday!" }, items: [fr.surprise, fr.bon-anniversaire] }
  - { id: s04, target: "Bon anniversaire, maman !", native: { nl: "Gefeliciteerd, mama!", en: "Happy birthday, Mum!" }, items: [fr.bon-anniversaire] }
  - { id: s05, target: "Nous fêtons l'anniversaire de Lucas.", native: { nl: "We vieren de verjaardag van Lucas.", en: "We're celebrating Lucas's birthday." }, items: [fr.feter] }
  - { id: s06, target: "J'offre un livre à mon ami.", native: { nl: "Ik geef mijn vriend een boek cadeau.", en: "I'm giving my friend a book as a present." }, items: [fr.offrir] }
  - { id: s07, target: "Bravo, c'est très bien !", native: { nl: "Bravo, dat is heel goed!", en: "Well done, that's very good!" }, items: [fr.bravo] }
  - { id: s08, target: "Bienvenue chez nous !", native: { nl: "Welkom bij ons thuis!", en: "Welcome to our house!" }, items: [fr.bienvenue] }
  - { id: s09, target: "Coucou, c'est Louise !", native: { nl: "Hoi, ik ben het, Louise!", en: "Hi, it's Louise!" }, items: [fr.coucou] }
  - { id: s10, target: "Quel est le programme de la soirée ?", native: { nl: "Wat staat er vanavond op het programma?", en: "What's the programme for the evening?" }, items: [fr.programme] }
  - { id: s11, target: "Il y a une affiche dans la classe.", native: { nl: "Er hangt een poster in de klas.", en: "There's a poster in the classroom." }, items: [fr.affiche] }
lessons:
  - { id: l01, title: { nl: Cadeaus, en: "Presents" }, vocab: [fr.cadeau, fr.bougie, fr.surprise, fr.bon-anniversaire, fr.feter, fr.offrir] }
  - { id: l02, title: { nl: Welkom!, en: "Welcome!" }, vocab: [fr.bravo, fr.bienvenue, fr.coucou, fr.programme, fr.affiche] }
