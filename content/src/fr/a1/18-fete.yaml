  - { target: la bougie, native: { nl: de kaars, en: "candle" }, pos: noun, gender: f }
  - { target: la surprise, native: { nl: de verrassing, en: "surprise" }, pos: noun, gender: f }
  - { target: bon anniversaire, native: { nl: gefeliciteerd (met je verjaardag), en: "happy birthday" }, pos: exclamation }
  - { target: fêter, native: { nl: vieren, en: "to celebrate" }, pos: verb }
  - { target: offrir, native: { nl: geven (als cadeau), en: "to give (as a present)" }, pos: verb }
  - { target: bravo, native: { nl: "goed zo, bravo", en: "well done, bravo" }, pos: exclamation }
  - { target: bienvenue, native: { nl: welkom, en: "welcome" }, pos: exclamation }
  - { target: coucou, native: { nl: "hoi, kiekeboe", en: "hi, hello (informal), peekaboo" }, pos: exclamation }
  - { target: le programme, native: { nl: het programma, en: "programme" }, pos: noun, gender: m }
