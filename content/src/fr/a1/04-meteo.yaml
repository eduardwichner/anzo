sentences:
  - { id: s01, target: "Il fait quel temps aujourd'hui ?", native: { nl: "Wat voor weer is het vandaag?", en: "What's the weather like today?" }, items: [fr.temps] }
  - { id: s02, target: "Aujourd'hui, il fait beau.", native: { nl: "Vandaag is het mooi weer.", en: "Today the weather is nice." }, items: [fr.il-fait-beau] }
  - { id: s03, target: "Il fait beau, on va à la plage ?", native: { nl: "Het is mooi weer, gaan we naar het strand?", en: "The weather's nice, shall we go to the beach?" }, items: [fr.il-fait-beau] }
  - { id: s04, target: "En été, il fait chaud.", native: { nl: "In de zomer is het warm.", en: "In summer it's hot." }, items: [fr.il-fait-chaud] }
  - { id: s05, target: "Il fait froid, mets ton manteau !", native: { nl: "Het is koud, doe je jas aan!", en: "It's cold, put your coat on!" }, items: [fr.il-fait-froid] }
  - { id: s06, target: "Il pleut, je reste à la maison.", native: { nl: "Het regent, ik blijf thuis.", en: "It's raining, I'm staying at home." }, items: [fr.pleuvoir] }
  - { id: s07, target: "Il neige ! On joue dehors ?", native: { nl: "Het sneeuwt! Gaan we buiten spelen?", en: "It's snowing! Shall we play outside?" }, items: [fr.neiger] }
  - { id: s08, target: "Ce matin, il y a de la pluie.", native: { nl: "Vanochtend regent het.", en: "There's rain this morning." }, items: [fr.pluie] }
  - { id: s09, target: "J'adore jouer dans la neige.", native: { nl: "Ik speel heel graag in de sneeuw.", en: "I love playing in the snow." }, items: [fr.neige] }
  - { id: s10, target: "Il y a beaucoup de vent.", native: { nl: "Het waait hard.", en: "It's very windy." }, items: [fr.vent] }
  - { id: s11, target: "Regarde le gros nuage noir !", native: { nl: "Kijk naar die grote zwarte wolk!", en: "Look at the big black cloud!" }, items: [fr.nuage] }
  - { id: s12, target: "Le ciel est bleu.", native: { nl: "De lucht is blauw.", en: "The sky is blue." }, items: [fr.ciel] }
  - { id: s13, target: "Le soir, je regarde les étoiles.", native: { nl: "'s Avonds kijk ik naar de sterren.", en: "In the evening I look at the stars." }, items: [fr.etoile] }
  - { id: s14, target: "La lune est blanche ce soir.", native: { nl: "Vanavond is de maan wit.", en: "The moon is white tonight." }, items: [fr.lune] }
  - { id: s15, target: "Mon chocolat est trop chaud !", native: { nl: "Mijn chocolademelk is te heet!", en: "My hot chocolate is too hot!" }, items: [fr.chaud] }
  - { id: s16, target: "L'eau de la mer est froide.", native: { nl: "Het zeewater is koud.", en: "The water in the sea is cold." }, items: [fr.froid] }
  - { id: s17, target: "Il fait mauvais aujourd'hui.", native: { nl: "Het is slecht weer vandaag.", en: "The weather is bad today." }, items: [fr.mauvais] }
lessons:
