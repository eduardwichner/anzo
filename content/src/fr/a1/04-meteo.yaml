  - { target: il fait froid, native: { nl: het is koud, en: "it's cold (weather)" }, pos: phrase }
  - { target: pleuvoir, native: { nl: regenen, en: "to rain" }, pos: verb }
  - { target: neiger, native: { nl: sneeuwen, en: "to snow" }, pos: verb }
