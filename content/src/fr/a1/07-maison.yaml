sentences:
  - { id: s01, target: "J'habite dans un appartement en ville.", native: { nl: "Ik woon in een appartement in de stad.", en: "I live in a flat in town." }, items: [fr.appartement] }
  - { id: s02, target: "On regarde la télévision dans le salon.", native: { nl: "We kijken televisie in de woonkamer.", en: "We watch television in the living room." }, items: [fr.salon] }
  - { id: s03, target: "Nous mangeons dans la salle à manger.", native: { nl: "We eten in de eetkamer.", en: "We eat in the dining room." }, items: [fr.salle-a-manger] }
  - { id: s04, target: "La salle de bain est en haut.", native: { nl: "De badkamer is boven.", en: "The bathroom is upstairs." }, items: [fr.salle-de-bain] }
  - { id: s05, target: "Où sont les toilettes, s'il vous plaît ?", native: { nl: "Waar is de wc, alstublieft?", en: "Where's the toilet, please?" }, items: [fr.toilettes] }
  - { id: s06, target: "Le chat dort dans l'escalier.", native: { nl: "De kat slaapt op de trap.", en: "The cat is sleeping on the stairs." }, items: [fr.escalier] }
  - { id: s07, target: "Ma chambre est au premier étage.", native: { nl: "Mijn slaapkamer is op de eerste verdieping.", en: "My bedroom is on the first floor." }, items: [fr.etage] }
  - { id: s08, target: "Il y a un dessin sur le mur.", native: { nl: "Er hangt een tekening aan de muur.", en: "There's a drawing on the wall." }, items: [fr.mur] }
  - { id: s09, target: "Le chat est sur le toit !", native: { nl: "De kat zit op het dak!", en: "The cat is on the roof!" }, items: [fr.toit] }
  - { id: s10, target: "Le vélo est dans le garage.", native: { nl: "De fiets staat in de garage.", en: "The bike is in the garage." }, items: [fr.garage] }
  - { id: s11, target: "Mes vêtements sont dans l'armoire.", native: { nl: "Mijn kleren liggen in de kast.", en: "My clothes are in the wardrobe." }, items: [fr.armoire] }
  - { id: s12, target: "Les assiettes sont dans le placard.", native: { nl: "De borden staan in de kast.", en: "The plates are in the cupboard." }, items: [fr.placard] }
  - { id: s13, target: "Je fais mes devoirs à mon bureau.", native: { nl: "Ik maak mijn huiswerk aan mijn bureau.", en: "I do my homework at my desk." }, items: [fr.bureau] }
  - { id: s14, target: "Papa dort sur le canapé.", native: { nl: "Papa slaapt op de bank.", en: "Dad is sleeping on the sofa." }, items: [fr.canape] }
  - { id: s15, target: "La lampe est à côté du lit.", native: { nl: "De lamp staat naast het bed.", en: "The lamp is next to the bed." }, items: [fr.lampe] }
  - { id: s16, target: "Où est la clé de la maison ?", native: { nl: "Waar is de huissleutel?", en: "Where's the house key?" }, items: [fr.cle] }
