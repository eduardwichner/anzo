  - { target: mars, native: { nl: maart, en: "March" }, pos: noun, gender: m }
  - { target: avril, native: { nl: april, en: "April" }, pos: noun, gender: m }
  - { target: mai, native: { nl: mei, en: "May" }, pos: noun, gender: m }
