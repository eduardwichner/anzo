  - { target: juillet, native: { nl: juli, en: "July" }, pos: noun, gender: m }
  - { target: août, native: { nl: augustus, en: "August" }, pos: noun, gender: m }
  - { target: septembre, native: { nl: september, en: "September" }, pos: noun, gender: m }
  - { target: octobre, native: { nl: oktober, en: "October" }, pos: noun, gender: m }
