id: fr-b2-u18
title: { nl: Talen en communicatie, en: "Languages and communication" }
icon: chat
topic: Apprendre et parler plusieurs langues, la Belgique et ses langues, la traduction, oser s'exprimer ; le participe présent (parlant, ayant grandi, ne sachant pas) et le gérondif (en parlant)
