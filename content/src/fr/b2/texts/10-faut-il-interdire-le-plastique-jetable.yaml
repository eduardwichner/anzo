questions:
  - { id: fr-b2-t10-q1, type: summary, options: ["L'auteur pense qu'une interdiction du plastique jetable est utile mais ne suffit pas : il faut aussi faire payer les entreprises, mieux recycler et changer nos habitudes.", "L'auteur pense qu'il ne faut pas interdire le plastique jetable, parce que les produits qui le remplacent sont pires.", "L'auteur pense qu'une interdiction du plastique jetable suffit, parce que les sacs en papier demandent moins d'énergie et que les entreprises ne doivent rien changer."], correct: 0 }
  - { id: fr-b2-t10-q2, type: mc, question: "Qu'est-ce qui s'est passé dans les pays qui ont interdit les sacs en plastique ?", options: ["Leur utilisation a beaucoup baissé.", "Les magasins ont fermé.", "Les gens ont acheté plus de bouteilles."], correct: 0 }
  - { id: fr-b2-t10-q3, type: true_false_notgiven, statement: "Les sacs en papier demandent moins d'énergie que les sacs en plastique.", answer: false }
  - { id: fr-b2-t10-q4, type: true_false_notgiven, statement: "Le lycée de l'auteur a déjà interdit les bouteilles en plastique.", answer: not_given }
  - { id: fr-b2-t10-q5, type: true_false_notgiven, statement: "Selon l'auteur, les entreprises devraient payer pour leurs déchets.", answer: true }
  - { id: fr-b2-t10-q6, type: match_heading, paragraph: 3, options: ["Pourquoi une interdiction ne suffit pas", "Les arguments pour une interdiction", "Ce que l'auteur propose"], correct: 0 }
