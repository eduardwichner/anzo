questions:
  - { id: fr-b2-t11-q1, type: summary, options: ["Un chercheur qui compte les oiseaux sur une petite île a vu leur nombre diminuer de presque la moitié, surtout parce que les poissons dont ils se nourrissent partent ailleurs.", "Un chercheur qui compte les oiseaux sur une petite île a vu leur nombre augmenter grâce à la protection de l'île.", "Un chercheur qui compte les oiseaux sur une petite île pense que leur nombre diminue surtout parce que des chasseurs viennent sur l'île chaque été."], correct: 0 }
  - { id: fr-b2-t11-q2, type: mc, question: "Pourquoi les jeunes oiseaux ont-ils du mal à survivre ?", options: ["Leurs parents doivent aller très loin pour trouver à manger.", "Des chasseurs viennent sur l'île.", "Il fait trop froid sur l'île."], correct: 0 }
  - { id: fr-b2-t11-q3, type: true_false_notgiven, statement: "Certains oiseaux reviennent sur l'île depuis plus de vingt ans.", answer: true }
  - { id: fr-b2-t11-q4, type: true_false_notgiven, statement: "Martin Leroy pense qu'il existe une solution simple.", answer: false }
