id: fr-b2-t14
kind: reading
title: { nl: Een avond in de musical, en: "An evening at the musical" }
topic: Arts et spectacles (une critique dans le journal du lycée)
level: B2
paragraphs:
  - - { id: fr-b2-t14-s01, target: "Quand j'ai appris que notre lycée allait monter une comédie musicale tirée d'une vieille pièce célèbre, je n'étais pas très enthousiaste.", native: { nl: "Toen ik hoorde dat onze school een musical zou opvoeren naar een beroemd oud toneelstuk, was ik niet erg enthousiast.", en: "When I heard that our lycée was going to put on a musical based on a famous old play, I wasn't very enthusiastic." } }
    - { id: fr-b2-t14-s02, target: "Je m'attendais à deux longues heures d'élèves qui oublient leur texte.", native: { nl: "Ik verwachtte twee lange uren met leerlingen die hun tekst vergeten.", en: "I was expecting two long hours of pupils forgetting their lines." } }
    - { id: fr-b2-t14-s03, target: "Je me trompais complètement.", native: { nl: "Ik vergiste me volledig.", en: "I was completely wrong." } }
  - - { id: fr-b2-t14-s04, target: "Beaucoup de spectateurs connaissent déjà l'histoire.", native: { nl: "Veel toeschouwers kennen het verhaal al.", en: "Many members of the audience already know the story." } }
    - { id: fr-b2-t14-s05, target: "Deux jeunes tombent amoureux, bien que leurs familles se détestent depuis des années.", native: { nl: "Twee jongeren worden verliefd, hoewel hun families elkaar al jaren haten.", en: "Two young people fall in love, even though their families have hated each other for years." } }
    - { id: fr-b2-t14-s06, target: "Dans cette version moderne, toutefois, les familles sont deux groupes de musique, et les amoureux se rencontrent à un concert dans leur ville.", native: { nl: "In deze moderne versie zijn de families echter twee muziekgroepen, en de geliefden ontmoeten elkaar op een concert in hun stad.", en: "In this modern version, however, the families are two bands, and the lovers meet at a concert in their town." } }
  - - { id: fr-b2-t14-s07, target: "La musique est la grande réussite du spectacle.", native: { nl: "De muziek is het grote succes van de voorstelling.", en: "The music is the show's great success." } }
    - { id: fr-b2-t14-s08, target: "Toutes les chansons ont été écrites par des élèves, et j'ai encore certaines mélodies dans la tête une semaine plus tard.", native: { nl: "Alle liedjes werden door leerlingen geschreven, en sommige melodieën zitten een week later nog in mijn hoofd.", en: "All the songs were written by pupils, and a week later I still have some of the tunes in my head." } }
    - { id: fr-b2-t14-s09, target: "Les paroles sont intelligentes et souvent très drôles, alors que la dernière chanson est si émouvante que la moitié du public pleurait.", native: { nl: "De songteksten zijn slim en vaak erg grappig, terwijl het laatste lied zo ontroerend is dat de helft van het publiek huilde.", en: "The lyrics are clever and often very funny, while the last song is so moving that half the audience was in tears." } }
  - - { id: fr-b2-t14-s10, target: "Le spectacle n'est pas parfait, bien sûr.", native: { nl: "De voorstelling is natuurlijk niet perfect.", en: "Of course, the show isn't perfect." } }
    - { id: fr-b2-t14-s11, target: "La première partie est trop longue, et malgré de bons micros, on entendait mal certains chanteurs à la voix plus douce.", native: { nl: "Het eerste deel is te lang, en ondanks goede microfoons waren sommige zangers met een zachtere stem slecht te horen.", en: "The first half is too long, and despite good microphones, some of the singers with softer voices were hard to hear." } }
    - { id: fr-b2-t14-s12, target: "Néanmoins, l'énergie des comédiens fait vite oublier ces petits problèmes.", native: { nl: "Toch doet de energie van de acteurs deze kleine problemen snel vergeten.", en: "Nevertheless, the actors' energy soon makes you forget these small problems." } }
  - - { id: fr-b2-t14-s13, target: "Faut-il y aller ?", native: { nl: "Moet je gaan?", en: "Should you go?" } }
    - { id: fr-b2-t14-s14, target: "Oui, si vous trouvez encore un billet : les trois premières soirées étaient complètes, et à la fin, les applaudissements ont continué pendant presque dix minutes.", native: { nl: "Ja, als je nog een ticket vindt: de eerste drie avonden waren uitverkocht, en op het einde ging het applaus bijna tien minuten door.", en: "Yes, if you can still find a ticket: the first three nights were sold out, and at the end the applause went on for almost ten minutes." } }
    - { id: fr-b2-t14-s15, target: "Même si vous n'aimez pas les comédies musicales, celle-ci mérite d'être vue.", native: { nl: "Ook als je niet van musicals houdt, is deze het zien waard.", en: "Even if you don't like musicals, this one is worth seeing." } }
