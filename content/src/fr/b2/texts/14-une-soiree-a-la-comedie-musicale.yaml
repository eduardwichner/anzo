questions:
  - { id: fr-b2-t14-q1, type: summary, options: ["L'auteur a beaucoup aimé la comédie musicale du lycée : malgré quelques petits problèmes, la musique et l'énergie des comédiens en font un vrai succès.", "L'auteur a trouvé la comédie musicale du lycée trop longue et décevante, et il conseille de ne pas y aller.", "L'auteur a aimé les chansons de la comédie musicale du lycée, mais il trouve que les comédiens n'avaient pas d'énergie et que le public s'ennuyait."], correct: 0 }
  - { id: fr-b2-t14-q2, type: mc, question: "Qui a écrit les chansons ?", options: ["Des élèves.", "Un musicien célèbre.", "Le professeur de musique."], correct: 0 }
  - { id: fr-b2-t14-q3, type: true_false_notgiven, statement: "Dans cette version, les deux familles sont des groupes de musique.", answer: true }
  - { id: fr-b2-t14-q4, type: true_false_notgiven, statement: "Selon l'auteur, la première partie est trop courte.", answer: false }
  - { id: fr-b2-t14-q5, type: true_false_notgiven, statement: "Le spectacle va partir en tournée dans d'autres lycées.", answer: not_given }
  - { id: fr-b2-t14-q6, type: match_heading, paragraph: 4, options: ["Quelques petits problèmes", "Une histoire connue", "Des chansons inoubliables"], correct: 0 }
