  - { id: fr-b2-t18-q2, type: mc, question: "Pourquoi Jade n'osait-elle pas parler pendant sa première année d'école ?", options: ["Elle avait peur qu'on se moque de son accent.", "Elle ne comprenait rien.", "Ses professeurs le lui interdisaient."], correct: 0 }
