questions:
  - { id: fr-b2-t16-q1, type: summary, options: ["Des étudiants vivent chez des personnes âgées pour un petit loyer en échange d'aide, ce qui aide les deux générations et crée des liens entre elles.", "Les personnes âgées louent leur maison très cher aux étudiants, ce qui provoque des conflits entre les générations.", "Des étudiants vivent chez des personnes âgées sans payer de loyer, mais ce modèle crée surtout des conflits entre les deux générations."], correct: 0 }
  - { id: fr-b2-t16-q2, type: mc, question: "Que fait l'association ?", options: ["Elle met les deux générations en contact et aide à écrire une sorte de contrat.", "Elle paie le loyer des étudiants.", "Elle construit des logements sociaux."], correct: 0 }
  - { id: fr-b2-t16-q3, type: true_false_notgiven, statement: "Yanis peut organiser des fêtes chez Simone.", answer: false }
  - { id: fr-b2-t16-q4, type: true_false_notgiven, statement: "Les enfants de Simone sont rassurés depuis que Yanis habite chez elle.", answer: true }
  - { id: fr-b2-t16-q5, type: true_false_notgiven, statement: "Yanis veut rester chez Simone après ses études.", answer: not_given }
  - { id: fr-b2-t16-q6, type: match_heading, paragraph: 2, options: ["Pourquoi ce modèle se développe", "Comment vivent Simone et Yanis", "Ce qu'ils ont appris l'un de l'autre"], correct: 0 }
