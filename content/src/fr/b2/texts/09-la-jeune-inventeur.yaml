questions:
  - { id: fr-b2-t09-q1, type: summary, options: ["Après la chute de sa grand-mère, une adolescente a conçu un petit appareil qui appelle à l'aide, et il est maintenant testé dans sa ville.", "Une adolescente a acheté une montre pour sa grand-mère, qui ne sait pas utiliser le téléphone.", "Une entreprise de la région a conçu un appareil pour les personnes âgées et l'a vendu à Camille."], correct: 0 }
  - { id: fr-b2-t09-q2, type: mc, question: "Pourquoi le premier prototype n'était-il pas pratique ?", options: ["Il était trop grand et la batterie était vite vide.", "Il était trop cher.", "Il n'envoyait pas de messages."], correct: 0 }
  - { id: fr-b2-t09-q3, type: true_false_notgiven, statement: "L'appareil envoie un message à un voisin.", answer: false }
  - { id: fr-b2-t09-q4, type: true_false_notgiven, statement: "L'appareil envoie un message dès que la personne tombe.", answer: false }
  - { id: fr-b2-t09-q5, type: true_false_notgiven, statement: "La grand-mère de Camille porte maintenant l'appareil.", answer: not_given }
