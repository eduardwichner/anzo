id: fr-b2-t07
kind: reading
title: { nl: Wat we weggooien, en: "What we throw away" }
topic: Alimentation et gaspillage (un article dans le journal d'un collège)
level: B2
paragraphs:
  - - { id: fr-b2-t07-s01, target: "Chaque année, environ un tiers de la nourriture produite dans le monde n'est jamais mangée.", native: { nl: "Elk jaar wordt ongeveer een derde van het voedsel dat in de wereld geproduceerd wordt nooit opgegeten.", en: "Every year, about a third of the food produced in the world is never eaten." } }
    - { id: fr-b2-t07-s02, target: "Une partie se perd avant d'arriver dans les magasins, mais dans les pays riches, une grande quantité est tout simplement jetée à la maison.", native: { nl: "Een deel gaat verloren voor het in de winkels aankomt, maar in rijke landen wordt een grote hoeveelheid gewoon thuis weggegooid.", en: "Some of it is lost before it reaches the shops, but in rich countries a large amount is simply thrown away at home." } }
  - - { id: fr-b2-t07-s03, target: "Pourquoi gaspillons-nous autant ?", native: { nl: "Waarom verspillen we zoveel?", en: "Why do we waste so much?" } }
    - { id: fr-b2-t07-s04, target: "D'abord, nous achetons plus que nécessaire, surtout quand les supermarchés proposent trois produits pour le prix de deux.", native: { nl: "Ten eerste kopen we meer dan nodig, vooral als supermarkten drie producten voor de prijs van twee aanbieden.", en: "First, we buy more than we need, especially when supermarkets offer three products for the price of two." } }
    - { id: fr-b2-t07-s05, target: "Ensuite, beaucoup de gens ne comprennent pas les dates sur les emballages et jettent des produits qu'on peut encore manger.", native: { nl: "Verder begrijpen veel mensen de data op de verpakking niet en gooien ze producten weg die nog gegeten kunnen worden.", en: "Next, many people don't understand the dates on the packaging and throw away products that can still be eaten." } }
    - { id: fr-b2-t07-s06, target: "Les restaurants, eux, servent souvent des portions trop grandes.", native: { nl: "De restaurants serveren dan weer vaak te grote porties.", en: "Restaurants, for their part, often serve portions that are too big." } }
  - - { id: fr-b2-t07-s07, target: "Le problème n'est pas seulement une question d'argent.", native: { nl: "Het probleem is niet alleen een kwestie van geld.", en: "The problem isn't just a question of money." } }
    - { id: fr-b2-t07-s08, target: "Pour produire et transporter la nourriture, il faut énormément d'eau et d'énergie.", native: { nl: "Om voedsel te produceren en te vervoeren is enorm veel water en energie nodig.", en: "Producing and transporting food takes an enormous amount of water and energy." } }
    - { id: fr-b2-t07-s09, target: "Quand elle finit à la poubelle, tout cela est gaspillé aussi.", native: { nl: "Als het in de vuilnisbak belandt, is dat allemaal ook verspild.", en: "When it ends up in the bin, all that is wasted too." } }
  - - { id: fr-b2-t07-s10, target: "Heureusement, de petits gestes peuvent aider.", native: { nl: "Gelukkig kunnen kleine gebaren helpen.", en: "Fortunately, small actions can help." } }
    - { id: fr-b2-t07-s11, target: "Dans notre collège, des élèves ont créé un « club des restes » : une fois par semaine, ils cuisinent un repas avec ce qui reste à la cantine.", native: { nl: "In onze school hebben leerlingen een \"restjesclub\" opgericht: één keer per week koken ze een maaltijd met wat er in de kantine overblijft.", en: "At our collège, some pupils have started a \"leftovers club\": once a week they cook a meal with what's left over in the canteen." } }
    - { id: fr-b2-t07-s12, target: "« Au début, les gens pensaient que ce serait fade, raconte Zoé, quinze ans. Maintenant, il y a toujours une file. »", native: { nl: "\"In het begin dachten de mensen dat het flauw zou zijn,\" vertelt Zoé, vijftien. \"Nu staat er altijd een rij.\"", en: "\"At first, people thought it would be bland,\" says Zoé, fifteen. \"Now there's always a queue.\"" } }
