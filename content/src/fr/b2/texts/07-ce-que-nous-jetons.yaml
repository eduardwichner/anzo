questions:
  - { id: fr-b2-t07-q1, type: summary, options: ["Une grande partie de la nourriture est jetée, ce qui gaspille de l'argent, de l'eau et de l'énergie, mais de petits gestes, comme le club des restes de l'école, peuvent aider.", "La plupart de la nourriture se perd dans les fermes, donc les familles ne peuvent presque rien faire contre le gaspillage.", "Les supermarchés ont arrêté de vendre trois produits pour le prix de deux à cause du gaspillage."], correct: 0 }
  - { id: fr-b2-t07-q2, type: mc, question: "Pourquoi les gens jettent-ils des produits qu'on peut encore manger ?", options: ["Ils ne comprennent pas les dates sur les emballages.", "Ils n'aiment pas les restes.", "Les supermarchés le leur demandent."], correct: 0 }
