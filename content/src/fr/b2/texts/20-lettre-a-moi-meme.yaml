questions:
  - { id: fr-b2-t20-q1, type: summary, options: ["Une élève de seize ans écrit à la personne qu'elle sera dans dix ans : elle parle de ses rêves, de ses inquiétudes pour l'avenir et lui donne un conseil.", "Une élève de seize ans écrit à son professeur pour lui expliquer pourquoi elle veut devenir vétérinaire.", "Une élève de seize ans écrit à une amie qui a déménagé : elle parle de ses rêves, de ses inquiétudes pour le climat et lui donne un conseil."], correct: 0 }
  - { id: fr-b2-t20-q2, type: mc, question: "Pourquoi l'élève trouve-t-elle l'avenir un peu effrayant ?", options: ["Beaucoup de métiers futurs n'existent pas encore.", "Elle n'aime pas l'école.", "Son amie va déménager."], correct: 0 }
  - { id: fr-b2-t20-q3, type: true_false_notgiven, statement: "Aujourd'hui, l'élève voudrait devenir vétérinaire.", answer: true }
  - { id: fr-b2-t20-q4, type: true_false_notgiven, statement: "L'élève est très optimiste pour le climat.", answer: false }
  - { id: fr-b2-t20-q5, type: true_false_notgiven, statement: "Manon et l'élève se connaissent depuis l'âge de six ans.", answer: not_given }
  - { id: fr-b2-t20-q6, type: match_heading, paragraph: 3, options: ["Ce que j'espère que tu as gardé", "Mes inquiétudes", "Un dernier conseil"], correct: 0 }
