questions:
  - { id: fr-b2-t06-q1, type: summary, options: ["Un homme qui avait de l'anxiété a commencé à marcher chaque jour sur le conseil de son médecin, et malgré des débuts difficiles, il a fini par courir dix kilomètres.", "Un homme qui avait de l'anxiété a refusé les médicaments et s'est préparé en quelques semaines pour une course de quarante kilomètres.", "Une médecin explique pourquoi les personnes qui ont de l'anxiété doivent éviter le sport jusqu'à ce qu'elles aillent mieux."], correct: 0 }
  - { id: fr-b2-t06-q2, type: mc, question: "Qu'est-ce que le médecin a proposé à Thomas ?", options: ["Marcher trente minutes par jour.", "Prendre des médicaments.", "Courir quarante kilomètres."], correct: 0 }
  - { id: fr-b2-t06-q3, type: true_false_notgiven, statement: "Le médecin de Thomas fait beaucoup de sport.", answer: not_given }
  - { id: fr-b2-t06-q4, type: true_false_notgiven, statement: "Thomas a presque abandonné deux fois.", answer: true }
  - { id: fr-b2-t06-q5, type: true_false_notgiven, statement: "Thomas faisait beaucoup de sport pendant la journée.", answer: false }
