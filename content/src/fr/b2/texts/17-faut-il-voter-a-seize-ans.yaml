questions:
  - { id: fr-b2-t17-q1, type: summary, options: ["L'auteur pense que les jeunes de seize ans devraient avoir le droit de vote, à condition que l'école les prépare mieux.", "L'auteur pense que les jeunes de seize ans ne sont pas encore prêts à voter.", "L'auteur pense que les jeunes de seize ans devraient voter, et que l'école ne doit rien changer pour les préparer."], correct: 0 }
  - { id: fr-b2-t17-q2, type: mc, question: "Quel argument des adversaires est donné dans le texte ?", options: ["Les jeunes pourraient voter comme leurs parents.", "Les jeunes ne paient pas d'impôts.", "Les jeunes ne s'intéressent pas au climat."], correct: 0 }
  - { id: fr-b2-t17-q3, type: true_false_notgiven, statement: "Selon l'auteur, beaucoup d'adultes ne comprennent pas mieux la politique que les jeunes.", answer: true }
  - { id: fr-b2-t17-q4, type: true_false_notgiven, statement: "Selon l'auteur, à seize ans, on peut déjà payer des impôts.", answer: true }
  - { id: fr-b2-t17-q5, type: true_false_notgiven, statement: "La plupart des jeunes Belges ont voté pour le même parti en 2024.", answer: not_given }
