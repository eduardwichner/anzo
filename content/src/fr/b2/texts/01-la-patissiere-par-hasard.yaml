  - { id: fr-b2-t01-q1, type: summary, options: ["Une adolescente timide a découvert la pâtisserie par hasard et, grâce à sa persévérance et à un professeur qui l'a encouragée, elle a gagné un concours.", "Une adolescente qui a toujours voulu être cuisinière raconte comment ses parents l'ont inscrite à une école de cuisine célèbre.", "Une professeure explique pourquoi les élèves timides devraient participer à des concours à la télévision."], correct: 0 }
  - { id: fr-b2-t01-q2, type: mc, question: "Pourquoi Lina a-t-elle fait son premier gâteau ?", options: ["Sa grand-mère était malade.", "Elle voulait participer à un concours.", "Son professeur le lui a demandé."], correct: 0 }
  - { id: fr-b2-t01-q3, type: true_false_notgiven, statement: "Le premier gâteau de Lina était réussi.", answer: false }
  - { id: fr-b2-t01-q4, type: true_false_notgiven, statement: "Lina a entendu parler du concours à la télévision.", answer: false }
