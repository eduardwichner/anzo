  gaps: [fr-b2-t08-s04, fr-b2-t08-s07, fr-b2-t08-s10, fr-b2-t08-s15]
  extra:
    - { id: fr-b2-t08-x1, target: "Dans la plupart des régions du monde, les requins ne sont pas dangereux pour les humains.", native: { nl: "In de meeste delen van de wereld zijn haaien niet gevaarlijk voor mensen.", en: "In most parts of the world, sharks are not dangerous to humans." } }
