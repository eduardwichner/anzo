questions:
  - { id: fr-b2-t08-q1, type: summary, options: ["Une fausse photo a été partagée par des millions de personnes et même publiée par des sites d'information, ce qui montre que nous croyons plus facilement ce qui nous surprend et qu'il faut vérifier les sources.", "Une vraie photo d'un requin dans une rue a été partagée par des millions de personnes, mais les sites d'information ont refusé de la publier.", "Les journalistes expliquent comment prendre de belles photos pendant une inondation."], correct: 0 }
  - { id: fr-b2-t08-q2, type: mc, question: "Pourquoi partage-t-on si vite les images sensationnelles ?", options: ["Elles nous font peur ou nous surprennent, et on les partage avant de réfléchir.", "Les sites d'information nous paient pour les partager.", "Elles viennent toujours de sources fiables."], correct: 0 }
  - { id: fr-b2-t08-q3, type: true_false_notgiven, statement: "La photo avait été prise par un photographe célèbre.", answer: not_given }
  - { id: fr-b2-t08-q4, type: true_false_notgiven, statement: "Un rédacteur en chef a reconnu que personne n'avait vérifié d'où venait la photo.", answer: true }
  - { id: fr-b2-t08-q5, type: true_false_notgiven, statement: "Selon l'article, il ne faut plus rien croire de ce qu'on lit en ligne.", answer: false }
  - { id: fr-b2-t08-q6, type: match_heading, paragraph: 4, options: ["Trois questions à se poser", "Pourquoi nous y croyons", "Ce que les sites ont dit"], correct: 0 }
