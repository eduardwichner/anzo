questions:
  - { id: fr-b2-t12-q1, type: summary, options: ["L'auteur et son frère se sont perdus dans la brume en montagne, mais le frère a utilisé une vieille boussole, et ils ont trouvé un refuge avant la nuit.", "L'auteur et son frère se sont perdus en montagne et ont dû passer la nuit dehors avant d'être retrouvés.", "L'auteur et son frère racontent comment ils ont escaladé un sommet sans carte."], correct: 0 }
  - { id: fr-b2-t12-q2, type: mc, question: "Pourquoi l'auteur n'a-t-il pas pu utiliser la carte de son téléphone ?", options: ["La batterie était vide.", "Il n'y avait pas de réseau.", "Le téléphone était tombé sur les rochers."], correct: 0 }
  - { id: fr-b2-t12-q3, type: true_false_notgiven, statement: "La boussole avait été donnée au frère par leur grand-père.", answer: true }
  - { id: fr-b2-t12-q4, type: true_false_notgiven, statement: "Le frère de l'auteur avait une boussole dans son sac.", answer: true }
  - { id: fr-b2-t12-q5, type: true_false_notgiven, statement: "L'auteur et son frère ont téléphoné à leurs parents depuis le refuge.", answer: not_given }
  - { id: fr-b2-t12-q6, type: match_heading, paragraph: 3, options: ["Un frère qui reste calme", "Plus de sentier", "Enfin arrivés"], correct: 0 }
