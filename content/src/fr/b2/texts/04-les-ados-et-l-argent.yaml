questions:
  - { id: fr-b2-t04-q1, type: summary, options: ["Avec les paiements par carte et par téléphone, les jeunes voient moins ce qu'ils dépensent, mais quelques habitudes simples peuvent les aider.", "Les jeunes d'aujourd'hui dépensent mieux leur argent que leurs parents, parce qu'ils vérifient leur compte sur leur téléphone chaque jour.", "Les banques vont bientôt refuser le paiement en liquide pour protéger les jeunes."], correct: 0 }
  - { id: fr-b2-t04-q2, type: mc, question: "Pourquoi ceux qui paient en liquide dépensent-ils moins ?", options: ["Donner des billets, c'est un peu comme perdre quelque chose.", "Les magasins font une réduction.", "Le paiement en liquide prend plus de temps."], correct: 0 }
  - { id: fr-b2-t04-q3, type: true_false_notgiven, statement: "La plupart des jeunes interrogés ont un travail le week-end.", answer: not_given }
  - { id: fr-b2-t04-q4, type: true_false_notgiven, statement: "Près de la moitié des jeunes ont déjà manqué d'argent avant la fin du mois.", answer: true }
  - { id: fr-b2-t04-q5, type: true_false_notgiven, statement: "Le texte conseille d'acheter tout de suite ce qu'on veut.", answer: false }
