# Words of the French course that sound like another word of the course: never a single-word listen_type
# (the learner cannot hear which one is meant). Used by scripts/content/generator.js for every French pack without
# `legacyListenType` (fr-b1 onwards; the DELF Prim packs keep their locked exercises).
groups:
  - [mer, mère, maire]
  - [vert, verre, vers]
  - [cent, sans, sang]
  - [fin, faim]
  - [fois, foie]
  - [mètre, mettre, maître]
  - [peau, pot]
  - [poids, pois]
  - [mai, mais]
  - [ou, où]
  - [son, sont]
  - [ces, ses]
  - [cours, court, cour]
  - [tante, tente]
  - [père, paire]
  - [cou, coup, coût]
  - [vingt, vin]
  - [lait, laid]
  - [temps, tant]
  - [voix, voie, voit]
  - [pain, pin]
  - [compte, conte]
  - [sel, selle]
  - [air, aire]
  - [chêne, chaîne]
  - [pêche, pêcher]
  - [vol, vole]
  - [col, colle]
  - [champ, chant]
  - [moi, mois]
  - [toi, toit]
