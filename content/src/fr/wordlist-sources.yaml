# Sources of the derived French word list (npm run content:wordlist -- fr → content/reference/extracted/wordlist-fr.json).
# Method and counts: content/src/fr/WORDLIST.md. This file holds no text of the DELF Prim papers: only
#   lexicon  French lemmas with part of speech and gender ("lemma = pos [gender]", ";" separates entries on a line).
#            pos: n v adj adv prep conj pron det num ord phrase interj q; gender: m f mf mpl fpl.
#            "lemma~tag" keeps two lemmas with the same spelling apart (orange~fruit, goûter~v); additions name the key.
#            Which of them the papers attest, at which level and where, the builder finds in the extracted texts.
#   names    proper names (attested in the papers, plus a few added for sentences)
#   exclude  exam-instruction words of the child-facing text, by reason (listed in WORDLIST.md)
#   topic    additions: everyday child vocabulary a DELF Prim theme needs at that level (theme + justification)
#   parity   additions: concepts the English YLE plan teaches at the matching level (content/src/en/PLAN.md)

