  - { target: certainement, native: { nl: zeker, en: "certainly" }, pos: adverb }
  - { target: évidemment, native: { nl: "vanzelfsprekend, natuurlijk", en: "obviously, of course" }, pos: adverb }
  - { target: apparemment, native: { nl: blijkbaar, en: "apparently" }, pos: adverb }
  - { target: sembler, native: { nl: lijken, en: "to seem, to appear" }, pos: verb }
  - { target: le doute, native: { nl: de twijfel, en: "doubt" }, pos: noun, gender: m }
  - { target: la raison, native: { nl: de reden, en: "reason" }, pos: noun, gender: f }
  - { target: le sens, native: { nl: de zin (betekenis), en: "meaning, sense" }, pos: noun, gender: m }
