  - { target: l'opinion, native: { nl: de mening, en: "opinion" }, pos: noun, gender: f }
  - { target: à mon avis, native: { nl: volgens mij, en: "in my opinion" }, pos: phrase }
  - { target: l'argument, native: { nl: het argument, en: "argument (for or against)" }, pos: noun, gender: m }
  - { target: l'avantage, native: { nl: het voordeel, en: "advantage" }, pos: noun, gender: m, avoid: [fr.inconvenient] }
