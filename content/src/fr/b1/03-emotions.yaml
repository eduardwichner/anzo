  - { target: soulagé, native: { nl: opgelucht, en: "relieved" }, pos: adjective }
  - { target: stressé, native: { nl: gestrest, en: "stressed" }, pos: adjective }
  - { target: gêné, native: { nl: "opgelaten, gegeneerd", en: "embarrassed, awkward" }, pos: adjective }
