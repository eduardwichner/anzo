  - { target: bouillir, native: { nl: koken (van water), en: "to boil" }, pos: verb, avoid: [fr.cuire, fr.cuisiner] }
  - { target: épicé, native: { nl: pittig, en: "spicy" }, pos: adjective, typedAlso: { en: [piquant] } }
