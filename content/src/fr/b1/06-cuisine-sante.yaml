  - { target: l'os, native: { nl: het bot, en: "bone" }, pos: noun, gender: m }
  - { target: la peau, native: { nl: de huid, en: "skin" }, pos: noun, gender: f }
  - { target: respirer, native: { nl: ademen, en: "to breathe" }, pos: verb }
  - { target: la maladie, native: { nl: de ziekte, en: "illness, disease" }, pos: noun, gender: f }
  - { target: le traitement, native: { nl: de behandeling, en: "treatment" }, pos: noun, gender: m }
  - { target: médical, native: { nl: medisch, en: "medical" }, pos: adjective }
  - { id: fr.fatigue-n, target: la fatigue, native: { nl: de vermoeidheid, en: "tiredness" }, pos: noun, gender: f }
