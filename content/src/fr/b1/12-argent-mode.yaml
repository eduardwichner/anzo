  - { target: la laine, native: { nl: de wol, en: "wool" }, pos: noun, gender: f }
  - { target: le cuir, native: { nl: het leer, en: "leather" }, pos: noun, gender: m }
  - { target: le bijou, native: { nl: het juweel, en: "piece of jewellery, jewel" }, pos: noun, gender: m }
  - { target: la mode, native: { nl: de mode, en: "fashion" }, pos: noun, gender: f }
  - { target: le produit, native: { nl: het product, en: "product" }, pos: noun, gender: m }
  - { target: le service, native: { nl: de dienst, en: "service" }, pos: noun, gender: m }
  - { target: le choix, native: { nl: de keuze, en: "choice" }, pos: noun, gender: m }
  - { target: comparer, native: { nl: vergelijken, en: "to compare" }, pos: verb }
  - { target: gaspiller, native: { nl: verspillen, en: "to waste" }, pos: verb }
  - { target: le gaspillage, native: { nl: de verspilling, en: "waste" }, pos: noun, gender: m }
