  - { target: la monnaie, native: { nl: "het wisselgeld, de munt", en: "small change, coins, currency" }, pos: noun, gender: f }
  - { target: les soldes, native: { nl: de solden (uitverkoop), en: "the sales" }, pos: noun, gender: m }
