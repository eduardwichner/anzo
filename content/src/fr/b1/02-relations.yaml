  - { target: chauve, native: { nl: kaal, en: "bald" }, pos: adjective }
  - { target: tolérant, native: { nl: verdraagzaam, en: "tolerant" }, pos: adjective }
  - { id: fr.age-adj, target: âgé, native: { nl: "oud, bejaard", en: "elderly, old" }, pos: adjective }
  - { target: aveugle, native: { nl: blind, en: "blind" }, pos: adjective }
  - { target: francophone, native: { nl: Franstalig, en: "French-speaking" }, pos: adjective }
