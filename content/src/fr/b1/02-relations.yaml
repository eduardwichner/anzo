  - { target: la beauté, native: { nl: de schoonheid, en: "beauty" }, pos: noun, gender: f }
  - { target: honnête, native: { nl: eerlijk, en: "honest" }, pos: adjective }
  - { target: impoli, native: { nl: onbeleefd, en: "rude, impolite" }, pos: adjective }
