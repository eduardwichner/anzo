  - { target: high-tech, native: { nl: hightech, en: "high-tech" }, pos: adjective }
  - { target: le contenu, native: { nl: de inhoud, en: "content" }, pos: noun, gender: m }
  - { target: la révolution, native: { nl: de revolutie, en: "revolution" }, pos: noun, gender: f }
  - { target: l'annonce, native: { nl: "de advertentie, de aankondiging", en: "advert, ad, announcement" }, pos: noun, gender: f }
  - { target: la source, native: { nl: de bron, en: "source" }, pos: noun, gender: f }
