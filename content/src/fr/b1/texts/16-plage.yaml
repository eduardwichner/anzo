  - { id: fr-b1-t16-q1, type: mc, question: "Combien de bénévoles ont nettoyé la plage ?", options: ["Cent cinquante.", "Cinquante.", "Mille."], correct: 0 }
  - { id: fr-b1-t16-q2, type: true_false_notgiven, statement: "Julie travaille comme professeure de biologie.", answer: not_given }
  - { id: fr-b1-t16-q3, type: true_false_notgiven, statement: "Après une tempête, il y a de nouveaux déchets sur la plage.", answer: true }
  - { id: fr-b1-t16-q4, type: true_false_notgiven, statement: "Les bénévoles ont trouvé seulement du plastique.", answer: false }
  - { id: fr-b1-t16-q5, type: mc, question: "Que va faire l'association en mai ?", options: ["Visiter les écoles.", "Nettoyer une autre plage.", "Organiser une fête."], correct: 0 }
  - { id: fr-b1-t16-q6, type: match_heading, paragraph: 3, options: ["Dangereux pour les animaux", "Une tonne de déchets", "Des visites dans les écoles"], correct: 0 }
