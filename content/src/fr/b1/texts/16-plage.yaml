id: fr-b1-t16
kind: reading
title: { nl: Een schoon strand, en: "A clean beach" }
topic: L'environnement (un article sur une action de nettoyage à la côte)
level: B1
paragraphs:
  - - { id: fr-b1-t16-s01, target: "Dimanche matin, cent cinquante bénévoles ont nettoyé la plage d'Ostende.", native: { nl: "Zondagochtend hebben honderdvijftig vrijwilligers het strand van Oostende schoongemaakt.", en: "On Sunday morning, a hundred and fifty volunteers cleaned the beach at Ostend." } }
    - { id: fr-b1-t16-s02, target: "La journée était organisée par une association environnementale de la région.", native: { nl: "De dag werd georganiseerd door een milieuvereniging uit de streek.", en: "The day was organised by an environmental association from the region." } }
  - - { id: fr-b1-t16-s03, target: "En trois heures, les participants ont ramassé presque une tonne de déchets.", native: { nl: "In drie uur hebben de deelnemers bijna een ton afval opgeraapt.", en: "In three hours, the participants picked up almost a tonne of rubbish." } }
    - { id: fr-b1-t16-s04, target: "Il y avait surtout du plastique, mais aussi du métal et du verre.", native: { nl: "Het was vooral plastic, maar ook metaal en glas.", en: "It was mainly plastic, but there was also metal and glass." } }
    - { id: fr-b1-t16-s05, target: "Après chaque tempête, le courant apporte de nouveaux déchets sur la plage.", native: { nl: "Na elke storm brengt de stroming nieuw afval naar het strand.", en: "After every storm, the current brings new rubbish onto the beach." } }
  - - { id: fr-b1-t16-s06, target: "« Le plastique est très dangereux pour les animaux marins », explique Julie, la présidente de l'association.", native: { nl: "\"Plastic is heel gevaarlijk voor zeedieren\", zegt Julie, de voorzitster van de vereniging.", en: "\"Plastic is very dangerous for sea animals,\" explains Julie, the chair of the association." } }
    - { id: fr-b1-t16-s07, target: "« Les oiseaux et les poissons le mangent, et beaucoup en meurent. »", native: { nl: "\"Vogels en vissen eten het op, en veel van hen sterven eraan.\"", en: "\"Birds and fish eat it, and many of them die from it.\"" } }
  - - { id: fr-b1-t16-s08, target: "L'association veut aussi sensibiliser les jeunes : elle viendra dans les écoles de la ville en mai.", native: { nl: "De vereniging wil ook jongeren bewust maken: ze komt in mei naar de scholen van de stad.", en: "The association also wants to raise young people's awareness: it will visit the town's schools in May." } }
    - { id: fr-b1-t16-s09, target: "Selon Julie, chaque petit geste compte, même ramasser une seule bouteille.", native: { nl: "Volgens Julie telt elk klein gebaar, zelfs één enkele fles oprapen.", en: "According to Julie, every small action counts, even picking up a single bottle." } }

items: [fr.benevole, fr.association, fr.environnemental, fr.region, fr.participant, fr.ramasser, fr.tonne, fr.plastique, fr.metal, fr.tempete, fr.courant, fr.marin, fr.mourir, fr.sensibiliser, fr.geste, fr.president, fr.surtout, fr.selon, fr.meme]
