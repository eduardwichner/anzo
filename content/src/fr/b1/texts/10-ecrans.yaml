  - { sentence: fr-b1-t10-s03, word: passent, kind: finite_verb, hint: { nl: "passer (présent)", en: "passer (present)" } }
  - { sentence: fr-b1-t10-s06, word: trouve, kind: finite_verb, hint: { nl: "trouver (présent)", en: "trouver (present)" } }
  - { sentence: fr-b1-t10-s08, word: a, kind: finite_verb, hint: { nl: "avoir (présent: … montré)", en: "avoir (present: … montré)" } }
