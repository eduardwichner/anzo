  - { sentence: fr-b1-t15-s08, word: parlerai, kind: finite_verb, hint: { nl: "parler (futur)", en: "parler (future)" } }
  - { sentence: fr-b1-t15-s09, word: pourra, kind: finite_verb, hint: { nl: "pouvoir (futur)", en: "pouvoir (future)" } }
orderable: true
