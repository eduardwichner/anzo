  - { word: Montréal, native: { nl: "Montréal (stad in Canada)", en: "Montreal (a city in Canada)" } }
items: [fr.honnete, fr.se-disputer, fr.amitie, fr.contact, fr.confiance, fr.soutenir, fr.respecter, fr.choix, fr.meme-si, fr.respect, fr.exactement, fr.meme]
questions:
  - { id: fr-b1-t03-q1, type: mc, question: "Pour Inès, un vrai ami…", options: ["dit la vérité.", "est toujours d'accord avec elle.", "habite près de chez elle."], correct: 0 }
  - { id: fr-b1-t03-q2, type: true_false_notgiven, statement: "Inès ne parle plus à sa meilleure amie.", answer: false }
  - { id: fr-b1-t03-q3, type: true_false_notgiven, statement: "Le meilleur ami de Théo habite loin de lui.", answer: true }
  - { id: fr-b1-t03-q4, type: true_false_notgiven, statement: "Théo va rendre visite à son ami cet été.", answer: not_given }
  - { id: fr-b1-t03-q5, type: mc, question: "Qu'est-ce que Camille aime chez ses amis ?", options: ["Ils sont différents d'elle.", "Ils pensent comme elle.", "Ils sont très bavards."], correct: 0 }
  - { id: fr-b1-t03-q6, type: match_heading, paragraph: 3, options: ["Un ami loin, mais toujours proche", "Une dispute qui finit bien", "Des amis très différents"], correct: 0 }
