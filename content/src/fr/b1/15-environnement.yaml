  - { target: l'équilibre, native: { nl: het evenwicht, en: "balance" }, pos: noun, gender: m }
  - { target: le développement, native: { nl: de ontwikkeling, en: "development" }, pos: noun, gender: m }
  - { target: l'écotourisme, native: { nl: het ecotoerisme, en: "ecotourism" }, pos: noun, gender: m }
  - { target: sensibiliser, native: { nl: bewust maken, en: "to raise awareness, to make aware" }, pos: verb }
  - { target: accumuler, native: { nl: ophopen (verzamelen), en: "to pile up, to accumulate" }, pos: verb }
  - { target: la tonne, native: { nl: de ton (1000 kilo), en: "tonne" }, pos: noun, gender: f }
  - { target: le métal, native: { nl: het metaal, en: "metal" }, pos: noun, gender: m }
