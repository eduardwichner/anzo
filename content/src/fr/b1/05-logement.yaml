  - { target: aménager, native: { nl: inrichten, en: "to fit out, to convert, to arrange (a room)" }, pos: verb }
  - { target: rénover, native: { nl: renoveren, en: "to renovate" }, pos: verb }
  - { target: l'habitant, native: { nl: de bewoner, en: "resident, inhabitant" }, pos: noun, gender: m }
  - { target: désordonné, native: { nl: slordig, en: "untidy, messy" }, pos: adjective }
  - { target: déranger, native: { nl: storen, en: "to disturb, to bother" }, pos: verb }
  - { target: le bruit, native: { nl: het lawaai, en: "noise" }, pos: noun, gender: m }
  - { target: tranquille, native: { nl: rustig, en: "quiet, peaceful" }, pos: adjective }
  - { target: confortable, native: { nl: comfortabel, en: "comfortable" }, pos: adjective }
  - { target: loger, native: { nl: logeren, en: "to stay (with someone)" }, pos: verb }
  - { target: l'hébergement, native: { nl: "het logies, het onderdak", en: "accommodation" }, pos: noun, gender: m }
  - { target: l'appareil, native: { nl: het apparaat, en: "appliance, device" }, pos: noun, gender: m }
  - { target: le chantier, native: { nl: de bouwplaats, en: "building site" }, pos: noun, gender: m }
  - { target: le bricolage, native: { nl: het klussen, en: "DIY" }, pos: noun, gender: m }
