  - { target: nuageux, native: { nl: bewolkt, en: "cloudy" }, pos: adjective }
  - { target: ensoleillé, native: { nl: zonnig, en: "sunny" }, pos: adjective }
  - { target: "l'orage", native: { nl: het onweer, en: "storm, thunderstorm" }, pos: noun, gender: m }
  - { target: le brouillard, native: { nl: de mist, en: "fog" }, pos: noun, gender: m }
  - { target: la température, native: { nl: de temperatuur, en: "temperature" }, pos: noun, gender: f }
  - { target: le degré, native: { nl: de graad, en: "degree" }, pos: noun, gender: m }
  - { target: "l'arc-en-ciel", native: { nl: de regenboog, en: "rainbow" }, pos: noun, gender: m }
  - { target: la boule de neige, native: { nl: de sneeuwbal, en: "snowball" }, pos: noun, gender: f }
  - { target: le bonhomme de neige, native: { nl: de sneeuwpop, en: "snowman" }, pos: noun, gender: m }
