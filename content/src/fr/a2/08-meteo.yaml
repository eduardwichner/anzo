sentences:
  - { id: s01, target: "Qu'est-ce que dit la météo pour demain ?", native: { nl: "Wat zegt het weerbericht voor morgen?", en: "What does the weather forecast say for tomorrow?" }, items: [fr.meteo], acceptAlso: ["Qu'est-ce que la météo dit pour demain ?"] }
  - { id: s02, target: "Le ciel est nuageux ce matin.", native: { nl: "Vanochtend is de lucht bewolkt.", en: "The sky is cloudy this morning." }, items: [fr.nuageux] }
  - { id: s03, target: "Demain, le temps va être ensoleillé.", native: { nl: "Morgen wordt het zonnig weer.", en: "Tomorrow it's going to be sunny." }, items: [fr.ensoleille] }
  - { id: s04, target: "Il y a eu un orage cette nuit.", native: { nl: "Er was vannacht onweer.", en: "There was a storm last night." }, items: [fr.orage] }
  - { id: s05, target: "Avec le brouillard, je ne vois rien.", native: { nl: "Met die mist zie ik niets.", en: "I can't see anything in this fog." }, items: [fr.brouillard] }
  - { id: s06, target: "Quelle est la température aujourd'hui ?", native: { nl: "Wat is de temperatuur vandaag?", en: "What's the temperature today?" }, items: [fr.temperature] }
  - { id: s07, target: "Il fait vingt degrés.", native: { nl: "Het is twintig graden.", en: "It's twenty degrees." }, items: [fr.degre] }
  - { id: s08, target: "Regarde, un arc-en-ciel !", native: { nl: "Kijk, een regenboog!", en: "Look, a rainbow!" }, items: [fr.arc-en-ciel] }
  - { id: s09, target: "Paul m'a lancé une boule de neige !", native: { nl: "Paul heeft een sneeuwbal naar me gegooid!", en: "Paul threw a snowball at me!" }, items: [fr.boule-de-neige] }
  - { id: s10, target: "Nous avons fait un grand bonhomme de neige.", native: { nl: "We hebben een grote sneeuwpop gemaakt.", en: "We made a big snowman." }, items: [fr.bonhomme-de-neige] }
  - { id: s11, target: "On fait de la luge à la montagne.", native: { nl: "We gaan sleeën in de bergen.", en: "We go sledging in the mountains." }, items: [fr.luge] }
lessons:
  - { id: l01, title: { nl: Zon en wolken, en: "Sun and clouds" }, vocab: [fr.meteo, fr.nuageux, fr.ensoleille, fr.orage, fr.brouillard, fr.temperature] }
  - { id: l02, title: { nl: Sneeuwpret, en: "Fun in the snow" }, vocab: [fr.degre, fr.arc-en-ciel, fr.boule-de-neige, fr.bonhomme-de-neige, fr.luge] }
