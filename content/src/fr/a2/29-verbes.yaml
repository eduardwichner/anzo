sentences:
  - { id: s01, target: "Je suis tombée de vélo.", native: { nl: "Ik ben van mijn fiets gevallen.", en: "I fell off my bike." }, items: [fr.tomber] }
  - { id: s02, target: "Je veux devenir vétérinaire.", native: { nl: "Ik wil dierenarts worden.", en: "I want to become a vet." }, items: [fr.devenir] }
  - { id: s03, target: "Nous sommes revenus de vacances hier.", native: { nl: "We zijn gisteren teruggekomen van vakantie.", en: "We came back from holiday yesterday." }, items: [fr.revenir] }
  - { id: s04, target: "Non ! J'ai cassé mon stylo !", native: { nl: "Nee! Ik heb mijn pen kapotgemaakt!", en: "Oh no! I've broken my pen!" }, items: [fr.casser] }
  - { id: s05, target: "Nous avons construit un château de sable.", native: { nl: "We hebben een zandkasteel gebouwd.", en: "We built a sandcastle." }, items: [fr.construire] }
  - { id: s06, target: "Papa va réparer mon vélo.", native: { nl: "Papa gaat mijn fiets maken.", en: "Dad is going to fix my bike." }, items: [fr.reparer] }
  - { id: s07, target: "Tu te souviens de notre voyage ?", native: { nl: "Weet je onze reis nog?", en: "Do you remember our trip?" }, items: [fr.se-souvenir] }
  - { id: s08, target: "Je me suis perdue dans la ville.", native: { nl: "Ik ben verdwaald in de stad.", en: "I got lost in the town." }, items: [fr.se-perdre] }
  - { id: s09, target: "J'ai décidé de faire du judo.", native: { nl: "Ik heb besloten om op judo te gaan.", en: "I've decided to do judo." }, items: [fr.decider] }
  - { id: s10, target: "Tu peux pousser la porte ? Elle est lourde.", native: { nl: "Kun je de deur openduwen? Hij is zwaar.", en: "Can you push the door? It's heavy." }, items: [fr.pousser] }
  - { id: s11, target: "Ne tire pas la queue du chat !", native: { nl: "Trek niet aan de staart van de kat!", en: "Don't pull the cat's tail!" }, items: [fr.tirer] }
  - { id: s12, target: "Ne touche pas, c'est chaud !", native: { nl: "Niet aanraken, het is heet!", en: "Don't touch, it's hot!" }, items: [fr.toucher] }
  - { id: s13, target: "Le chien suit le chat.", native: { nl: "De hond volgt de kat.", en: "The dog is following the cat." }, items: [fr.suivre] }
  - { id: s14, target: "Mon livre a disparu !", native: { nl: "Mijn boek is verdwenen!", en: "My book has disappeared!" }, items: [fr.disparaitre] }
  - { id: s15, target: "Qu'est-ce que tu veux changer dans ta chambre ?", native: { nl: "Wat wil jij veranderen in je kamer?", en: "What do you want to change in your bedroom?" }, items: [fr.changer] }
  - { id: s16, target: "Le poisson est petit, mais il va grandir.", native: { nl: "De vis is klein, maar hij gaat groeien.", en: "The fish is small, but it's going to grow." }, items: [fr.grandir] }
  - { id: s17, target: "J'ai rencontré une nouvelle amie à la piscine.", native: { nl: "Ik heb in het zwembad een nieuwe vriendin leren kennen.", en: "I met a new friend at the swimming pool." }, items: [fr.rencontrer] }
  - { id: s18, target: "Mon papa peut nous réserver des places au cinéma.", native: { nl: "Mijn papa kan plaatsen in de bioscoop voor ons reserveren.", en: "My dad can reserve seats for us at the cinema." }, items: [fr.reserver] }
  - { id: s19, target: "Les ours vivent dans la forêt.", native: { nl: "Beren leven in het bos.", en: "Bears live in the forest." }, items: [fr.vivre] }
lessons:
  - { id: l01, title: { nl: Gevallen!, en: "I fell!" }, vocab: [fr.tomber, fr.devenir, fr.revenir, fr.casser, fr.construire, fr.reparer, fr.disparaitre] }
  - { id: l02, title: { nl: Duwen en trekken, en: "Pushing and pulling" }, vocab: [fr.se-souvenir, fr.se-perdre, fr.decider, fr.pousser, fr.tirer, fr.toucher] }
  - { id: l03, title: { nl: Groot worden, en: "Growing up" }, vocab: [fr.suivre, fr.changer, fr.grandir, fr.rencontrer, fr.reserver, fr.vivre] }
