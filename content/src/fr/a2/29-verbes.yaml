  - { target: suivre, native: { nl: volgen, en: "to follow" }, pos: verb }
  - { target: disparaître, native: { nl: verdwijnen, en: "to disappear" }, pos: verb }
  - { target: changer, native: { nl: veranderen, en: "to change" }, pos: verb }
  - { target: grandir, native: { nl: "groeien, groot worden", en: "to grow, to grow up" }, pos: verb }
