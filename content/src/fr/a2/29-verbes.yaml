  - { target: construire, native: { nl: bouwen, en: "to build" }, pos: verb }
  - { target: réparer, native: { nl: "repareren, maken", en: "to repair, to fix, to mend" }, pos: verb }
  - { target: se souvenir, native: { nl: zich herinneren, en: "to remember" }, pos: verb }
  - { target: se perdre, native: { nl: verdwalen, en: "to get lost" }, pos: verb }
