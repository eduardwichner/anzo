id: fr-a2-u06
title: { nl: Hoe voel je je?, en: "How are you feeling?" }
icon: people
topic: Les sentiments; dire ce qu'on aime
vocabulary:
  - { target: heureux, native: { nl: gelukkig, en: "happy" }, pos: adjective }
  - { target: malheureux, native: { nl: ongelukkig, en: "unhappy" }, pos: adjective }
  - { target: fâché, native: { nl: boos, en: "angry, annoyed" }, pos: adjective }
  - { target: fier, native: { nl: trots, en: "proud" }, pos: adjective }
  - { target: inquiet, native: { nl: ongerust, en: "worried" }, pos: adjective }
  - { target: surpris, native: { nl: "verrast, verbaasd", en: "surprised" }, pos: adjective }
  - { target: calme, native: { nl: "rustig, kalm", en: "calm, quiet" }, pos: adjective }
  - { target: curieux, native: { nl: nieuwsgierig, en: "curious" }, pos: adjective }
  - { target: la joie, native: { nl: "de vreugde, de blijdschap", en: "joy" }, pos: noun, gender: f, avoid: [fr.chance] }
  - { target: avoir peur, native: { nl: bang zijn, en: "to be afraid, to be scared" }, pos: phrase }
  - { target: rire, native: { nl: lachen, en: "to laugh" }, pos: verb }
  - { target: pleurer, native: { nl: huilen, en: "to cry" }, pos: verb }
