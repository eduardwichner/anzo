sentences:
  - { id: s01, target: "Il faut protéger l'environnement.", native: { nl: "We moeten het milieu beschermen.", en: "We must protect the environment." }, items: [fr.environnement, fr.proteger] }
  - { id: s02, target: "La Terre est une planète.", native: { nl: "De aarde is een planeet.", en: "The Earth is a planet." }, items: [fr.planete, fr.terre] }
  - { id: s03, target: "Notre planète est très belle.", native: { nl: "Onze planeet is heel mooi.", en: "Our planet is very beautiful." }, items: [fr.planete] }
  - { id: s04, target: "L'astronaute est allé dans l'espace.", native: { nl: "De astronaut is naar de ruimte gegaan.", en: "The astronaut went into space." }, items: [fr.astronaute, fr.espace] }
  - { id: s05, target: "La fusée part ce soir.", native: { nl: "De raket vertrekt vanavond.", en: "The rocket leaves tonight." }, items: [fr.fusee] }
  - { id: s06, target: "Plus tard, je serai astronaute !", native: { nl: "Later word ik astronaut!", en: "Later on, I'll be an astronaut!" }, items: [fr.astronaute] }
  - { id: s07, target: "Mets les déchets dans la poubelle.", native: { nl: "Gooi het afval in de vuilnisbak.", en: "Put the rubbish in the bin." }, items: [fr.dechet, fr.poubelle] }
  - { id: s08, target: "Il y a trop de pollution en ville.", native: { nl: "Er is te veel vervuiling in de stad.", en: "There's too much pollution in town." }, items: [fr.pollution] }
  - { id: s09, target: "Ne jette pas tes papiers dans la rue !", native: { nl: "Gooi je papiertjes niet op straat!", en: "Don't throw your bits of paper in the street!" }, items: [fr.jeter] }
  - { id: s10, target: "À l'école, nous recyclons le papier.", native: { nl: "Op school recyclen we papier.", en: "At school we recycle paper." }, items: [fr.recycler, fr.papier] }
  - { id: s11, target: "On peut recycler les bouteilles.", native: { nl: "Je kunt flessen recyclen.", en: "You can recycle bottles." }, items: [fr.recycler] }
