sentences:
  - { id: s01, target: "Ma grand-mère m'a donné sa recette.", native: { nl: "Mijn oma heeft me haar recept gegeven.", en: "My grandmother gave me her recipe." }, items: [fr.recette] }
  - { id: s02, target: "J'aime cuisiner avec mon papa.", native: { nl: "Ik kook graag met mijn papa.", en: "I like cooking with my dad." }, items: [fr.cuisiner] }
  - { id: s03, target: "Pour les crêpes, il faut de la farine.", native: { nl: "Voor pannenkoeken heb je bloem nodig.", en: "For pancakes you need flour." }, items: [fr.farine] }
  - { id: s04, target: "Tu peux me donner le sel ?", native: { nl: "Kun je me het zout aangeven?", en: "Can you pass me the salt?" }, items: [fr.sel] }
  - { id: s05, target: "Il y a trop de poivre dans la soupe !", native: { nl: "Er zit te veel peper in de soep!", en: "There's too much pepper in the soup!" }, items: [fr.poivre] }
  - { id: s06, target: "Je mange du pain avec du miel.", native: { nl: "Ik eet brood met honing.", en: "I eat bread with honey." }, items: [fr.miel] }
  - { id: s07, target: "Je mange un yaourt à la fraise.", native: { nl: "Ik eet een aardbeienyoghurt.", en: "I'm eating a strawberry yoghurt." }, items: [fr.yaourt] }
  - { id: s08, target: "Au petit-déjeuner, je mange des céréales.", native: { nl: "Bij het ontbijt eet ik ontbijtgranen.", en: "For breakfast I eat cereal." }, items: [fr.cereales] }
  - { id: s09, target: "Les cerises sont rouges et délicieuses.", native: { nl: "De kersen zijn rood en heerlijk.", en: "The cherries are red and delicious." }, items: [fr.cerise] }
  - { id: s10, target: "Nous avons trouvé des champignons dans la forêt.", native: { nl: "We hebben in het bos paddenstoelen gevonden.", en: "We found mushrooms in the forest." }, items: [fr.champignon] }
  - { id: s11, target: "Je n'aime pas l'oignon.", native: { nl: "Ik hou niet van ui.", en: "I don't like onion." }, items: [fr.oignon] }
  - { id: s12, target: "Mange tes haricots verts !", native: { nl: "Eet je sperziebonen op!", en: "Eat your green beans!" }, items: [fr.haricot] }
  - { id: s13, target: "J'adore le riz avec des petits pois.", native: { nl: "Ik ben gek op rijst met doperwtjes.", en: "I love rice with peas." }, items: [fr.petit-pois] }
  - { id: s14, target: "Ce soir, on mange des saucisses.", native: { nl: "Vanavond eten we worstjes.", en: "Tonight we're having sausages." }, items: [fr.saucisse] }
  - { id: s15, target: "Maman a fait une tarte aux pommes.", native: { nl: "Mama heeft een appeltaart gemaakt.", en: "Mum made an apple tart." }, items: [fr.tarte] }
  - { id: s16, target: "Le dimanche, je mange un croissant.", native: { nl: "Op zondag eet ik een croissant.", en: "On Sundays I eat a croissant." }, items: [fr.croissant] }
