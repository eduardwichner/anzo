  - { id: s05, target: "Ton dessin est vraiment beau.", native: { nl: "Je tekening is echt mooi.", en: "Your drawing is really beautiful." }, items: [fr.vraiment] }
  - { id: s06, target: "J'ai seulement deux euros.", native: { nl: "Ik heb maar twee euro.", en: "I only have two euros." }, items: [fr.seulement] }
  - { id: s07, target: "Il y a peu d'élèves aujourd'hui.", native: { nl: "Er zijn vandaag weinig leerlingen.", en: "There aren't many pupils today." }, items: [fr.peu] }
  - { id: s08, target: "Peut-être qu'il va pleuvoir.", native: { nl: "Misschien gaat het regenen.", en: "Maybe it's going to rain." }, items: [fr.peut-etre] }
