sentences:
  - { id: s01, target: "J'ai besoin de mon livre de géographie.", native: { nl: "Ik heb mijn aardrijkskundeboek nodig.", en: "I need my geography book." }, items: [fr.avoir-besoin-de] }
  - { id: s02, target: "Vous n'avez pas besoin d'apporter votre cahier.", native: { nl: "Jullie hoeven jullie schrift niet mee te nemen.", en: "You don't need to bring your exercise book." }, items: [fr.avoir-besoin-de] }
