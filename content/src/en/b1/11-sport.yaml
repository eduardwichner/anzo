  - { id: s78, target: "My brother works out three times a week.", native: { nl: "Mijn broer sport drie keer per week." }, items: [en.work-out] }
  - { id: s79, target: "Swimming is great for your fitness.", native: { nl: "Zwemmen is geweldig voor je conditie." }, items: [en.fitness] }
  - { id: s80, target: "I want to get fit before the summer.", native: { nl: "Ik wil fit worden voor de zomer." }, items: [en.get-fit] }
  - { id: s81, target: "My grandparents are still very active.", native: { nl: "Mijn grootouders zijn nog heel actief." }, items: [en.active] }
  - { id: s82, target: "Team sports take a lot of time and energy.", native: { nl: "Teamsporten kosten veel tijd en energie." }, items: [en.energy] }
  - { id: s83, target: "The average age of the players is nineteen.", native: { nl: "De gemiddelde leeftijd van de spelers is negentien." }, items: [en.average] }
  - { id: s84, target: "Has the training session started yet? Yes, it has just started.", native: { nl: "Is de trainingssessie al begonnen? Ja, ze is net begonnen." }, items: [en.session, en.training] }
