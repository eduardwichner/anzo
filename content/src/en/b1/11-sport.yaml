sentences:
  - { id: s01, target: "Athletics is my favourite sport at school.", native: { nl: "Atletiek is mijn favoriete sport op school." }, items: [en.athletics] }
  - { id: s02, target: "Athletes from more than two hundred countries took part.", native: { nl: "Atleten uit meer dan tweehonderd landen deden mee." }, items: [en.athlete], finite: { word: took, hint: { nl: "take (verleden tijd: … part)" } } }
  - { id: s03, target: "She's the fastest runner in our club.", native: { nl: "Ze is de snelste hardloopster van onze club." }, items: [en.runner] }
  - { id: s04, target: "Running is a cheap way to keep fit.", native: { nl: "Hardlopen is een goedkope manier om fit te blijven." }, items: [en.running, en.fit] }
