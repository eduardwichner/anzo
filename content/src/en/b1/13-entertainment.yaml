sentences:
  - { id: s01, target: "There's a lot of entertainment for children at the festival.", native: { nl: "Er is veel vermaak voor kinderen op het festival." }, items: [en.entertainment] }
  - { id: s02, target: "A clown entertained the guests.", native: { nl: "Een clown vermaakte de gasten." }, items: [en.entertain], finite: { word: entertained, hint: { nl: "entertain (verleden tijd)" } } }
  - { id: s03, target: "Lots of celebrities came to the film's first night.", native: { nl: "Veel beroemdheden kwamen naar de première van de film." }, items: [en.celebrity] }
  - { id: s04, target: "She's a well-known singer in Brazil.", native: { nl: "Ze is een bekende zangeres in Brazilië." }, items: [en.well-known] }
  - { id: s05, target: "The show is looking for young people with talent.", native: { nl: "De show zoekt jongeren met talent." }, items: [en.talent] }
  - { id: s06, target: "My cousin is a talented dancer.", native: { nl: "Mijn nicht is een getalenteerde danseres." }, items: [en.talented, en.dancer] }
  - { id: s07, target: "I'm a big fan of this band.", native: { nl: "Ik ben een grote fan van deze band." }, items: [en.fan] }
  - { id: s08, target: "The audience clapped for five minutes.", native: { nl: "Het publiek klapte vijf minuten lang." }, items: [en.audience] }
  - { id: s09, target: "Our seats are in the front row.", native: { nl: "Onze plaatsen zijn op de eerste rij." }, items: [en.row] }
  - { id: s10, target: "We bought ice cream in the interval.", native: { nl: "We kochten ijs in de pauze." }, items: [en.interval] }
  - { id: s11, target: "Hurry up! The film is almost over.", native: { nl: "Schiet op! De film is bijna afgelopen." }, items: [en.be-over] }
  - { id: s12, target: "The band will perform at the festival on Sunday.", native: { nl: "De band treedt zondag op tijdens het festival." }, items: [en.perform], acceptAlso: ["On Sunday the band will perform at the festival."] }
  - { id: s13, target: "The evening performance starts at half past seven.", native: { nl: "De avondvoorstelling begint om half acht." }, items: [en.performance] }
  - { id: s14, target: "The street performers were doing tricks with fire.", native: { nl: "De straatartiesten deden trucs met vuur." }, items: [en.performer] }
  - { id: s15, target: "She's the best actress in the film.", native: { nl: "Zij is de beste actrice in de film." }, items: [en.actress] }
  - { id: s16, target: "He plays the role of a teacher.", native: { nl: "Hij speelt de rol van een leraar." }, items: [en.role] }
  - { id: s17, target: "The last scene made everybody cry.", native: { nl: "Door de laatste scène moest iedereen huilen." }, items: [en.scene] }
  - { id: s18, target: "We painted the set for the school play.", native: { nl: "We schilderden het decor voor het schooltoneelstuk." }, items: [en.set] }
  - { id: s19, target: "I'm in the drama club at school.", native: { nl: "Ik zit bij de toneelclub op school." }, items: [en.drama] }
  - { id: s20, target: "Let's watch a comedy. I need a laugh.", native: { nl: "Laten we een komedie kijken. Ik heb zin om te lachen." }, items: [en.comedy] }
  - { id: s21, target: "My sister loves books with a bit of romance.", native: { nl: "Mijn zus houdt van boeken met een beetje romantiek." }, items: [en.romance] }
  - { id: s22, target: "It's a romantic film about two students.", native: { nl: "Het is een romantische film over twee studenten." }, items: [en.romantic] }
  - { id: s23, target: "The thriller was so exciting that I couldn't stop reading.", native: { nl: "De thriller was zo spannend dat ik niet kon stoppen met lezen." }, items: [en.thriller] }
  - { id: s24, target: "I never watch horror films before bed.", native: { nl: "Ik kijk nooit horrorfilms voor het slapengaan." }, items: [en.horror] }
  - { id: s25, target: "The film has lots of action and fast cars.", native: { nl: "De film heeft veel actie en snelle auto's." }, items: [en.action] }
  - { id: s26, target: "Which superhero would you like to be?", native: { nl: "Welke superheld zou je willen zijn?" }, items: [en.superhero] }
  - { id: s27, target: "The hero of the story is a young farmer.", native: { nl: "De held van het verhaal is een jonge boer." }, items: [en.hero] }
  - { id: s28, target: "The heroine is a brave girl who saves her village.", native: { nl: "De heldin is een dapper meisje dat haar dorp redt." }, items: [en.heroine] }
  - { id: s29, target: "The plot is quite complicated.", native: { nl: "Het verhaal is vrij ingewikkeld." }, items: [en.plot] }
  - { id: s30, target: "I didn't like the ending of the book.", native: { nl: "Ik vond het einde van het boek niet leuk." }, items: [en.ending] }
