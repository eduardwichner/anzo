  - { id: s33, target: "Do you believe in magic?", native: { nl: "Geloof jij in magie?" }, items: [en.magic] }
  - { id: s34, target: "Can you show me a card trick?", native: { nl: "Kun je me een kaarttruc laten zien?" }, items: [en.trick] }
  - { id: s35, target: "You need a lot of imagination to write stories.", native: { nl: "Je hebt veel fantasie nodig om verhalen te schrijven." }, items: [en.imagination] }
  - { id: s36, target: "The artist created a picture out of a thousand photos.", native: { nl: "De kunstenaar maakte een afbeelding uit duizend foto's." }, items: [en.create] }
  - { id: s37, target: "She's very creative and makes her own clothes.", native: { nl: "Ze is heel creatief en maakt haar eigen kleren." }, items: [en.creative] }
  - { id: s38, target: "Her grandmother inspired her to become a singer.", native: { nl: "Haar oma inspireerde haar om zangeres te worden." }, items: [en.inspire] }
  - { id: s39, target: "The director told the actors to start again.", native: { nl: "De regisseur zei tegen de acteurs dat ze opnieuw moesten beginnen." }, items: [en.director] }
  - { id: s40, target: "She wants to be a film maker.", native: { nl: "Ze wil filmmaker worden." }, items: [en.film-maker] }
  - { id: s41, target: "The cameraman followed the runners on a motorbike.", native: { nl: "De cameraman volgde de lopers op een motor." }, items: [en.cameraman] }
  - { id: s42, target: "The school is putting on a production of a famous musical.", native: { nl: "De school brengt een productie van een beroemde musical op de planken." }, items: [en.production] }
  - { id: s43, target: "We visited a TV studio on our school trip.", native: { nl: "We bezochten een tv-studio tijdens ons schoolreisje." }, items: [en.studio] }
