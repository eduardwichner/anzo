  - { id: s45, target: "I've missed the last episode.", native: { nl: "Ik heb de laatste aflevering gemist." }, items: [en.episode] }
  - { id: s46, target: "My grandma watches the same soap opera every evening.", native: { nl: "Mijn oma kijkt elke avond naar dezelfde soap." }, items: [en.soap-opera], acceptAlso: ["Every evening my grandma watches the same soap opera."] }
  - { id: s47, target: "The singer was a guest on a chat show.", native: { nl: "De zangeres was te gast in een praatprogramma." }, items: [en.chat-show] }
  - { id: s48, target: "There's a firework display on the beach tonight.", native: { nl: "Er is vanavond een vuurwerkshow op het strand." }, items: [en.display] }
  - { id: s49, target: "We went to the ballet at Christmas.", native: { nl: "We gingen met Kerstmis naar het ballet." }, items: [en.ballet] }
  - { id: s50, target: "Opera singers need very strong voices.", native: { nl: "Operazangers hebben een heel sterke stem nodig." }, items: [en.opera, en.voice] }
  - { id: s51, target: "My brother plays the violin in the school orchestra.", native: { nl: "Mijn broer speelt viool in het schoolorkest." }, items: [en.orchestra] }
  - { id: s52, target: "Dad listens to classical music while he cooks.", native: { nl: "Papa luistert naar klassieke muziek terwijl hij kookt." }, items: [en.classical] }
  - { id: s53, target: "There's a jazz concert in the park tonight.", native: { nl: "Er is vanavond een jazzconcert in het park." }, items: [en.jazz] }
  - { id: s54, target: "They play traditional folk music from Ireland.", native: { nl: "Ze spelen traditionele volksmuziek uit Ierland." }, items: [en.folk] }
  - { id: s55, target: "She wants to be a pop star.", native: { nl: "Ze wil popster worden." }, items: [en.pop] }
  - { id: s56, target: "Rap music started in New York.", native: { nl: "Rapmuziek is in New York ontstaan." }, items: [en.rap] }
  - { id: s57, target: "He dances to hip hop in his bedroom.", native: { nl: "Hij danst op hiphop in zijn slaapkamer." }, items: [en.hip-hop] }
  - { id: s58, target: "My parents love old soul music.", native: { nl: "Mijn ouders houden van oude soulmuziek." }, items: [en.soul] }
  - { id: s59, target: "Everyone in my family is musical.", native: { nl: "Iedereen in mijn familie is muzikaal." }, items: [en.musical] }
  - { id: s60, target: "The musicians played until midnight.", native: { nl: "De muzikanten speelden tot middernacht." }, items: [en.musician] }
  - { id: s61, target: "The band needs a new guitarist.", native: { nl: "De band heeft een nieuwe gitarist nodig." }, items: [en.guitarist] }
  - { id: s62, target: "Singing with friends is great fun.", native: { nl: "Zingen met vrienden is erg leuk." }, items: [en.singing] }
  - { id: s63, target: "She has a beautiful voice.", native: { nl: "Ze heeft een prachtige stem." }, items: [en.voice] }
  - { id: s64, target: "I've played the flute since I was eight.", native: { nl: "Ik speel al fluit sinds mijn achtste." }, items: [en.flute] }
  - { id: s65, target: "Learning the trumpet is noisy for the neighbours!", native: { nl: "Trompet leren spelen is lawaaierig voor de buren!" }, items: [en.trumpet] }
  - { id: s66, target: "Her brother accompanied her on the piano.", native: { nl: "Haar broer begeleidde haar op de piano." }, items: [en.accompany] }
  - { id: s67, target: "Their new album comes out next month.", native: { nl: "Hun nieuwe album komt volgende maand uit." }, items: [en.album] }
  - { id: s68, target: "We recorded a song for our music project.", native: { nl: "We namen een liedje op voor ons muziekproject." }, items: [en.record], finite: { word: recorded, hint: { nl: "record (verleden tijd)" } } }
  - { id: s69, target: "This recording was made in 1960.", native: { nl: "Deze opname is in 1960 gemaakt." }, items: [en.recording] }
  - { id: s70, target: "The soundtrack of the film is better than the film itself.", native: { nl: "De soundtrack van de film is beter dan de film zelf." }, items: [en.soundtrack] }
  - { id: s71, target: "The DJ played music all night.", native: { nl: "De dj draaide de hele nacht muziek." }, items: [en.dj] }
  - { id: s72, target: "Speak into the microphone, please.", native: { nl: "Spreek in de microfoon, alstublieft." }, items: [en.microphone] }
  - { id: s73, target: "The music was too loud, so we moved away from the speakers.", native: { nl: "De muziek was te hard, dus we gingen verder van de boxen af staan." }, items: [en.speaker] }
  - { id: s74, target: "Use headphones on the train, please.", native: { nl: "Gebruik een koptelefoon in de trein, alsjeblieft." }, items: [en.headphones], acceptAlso: ["Please use headphones on the train."] }
  - { id: s75, target: "Can you turn the volume down a bit?", native: { nl: "Kun je het volume wat lager zetten?" }, items: [en.volume, en.turn-down] }
  - { id: s76, target: "Turn up the radio! I love this song.", native: { nl: "Zet de radio harder! Ik vind dit liedje geweldig." }, items: [en.turn-up] }
  - { id: s77, target: "Could you turn down the music? I'm trying to study.", native: { nl: "Kun je de muziek zachter zetten? Ik probeer te studeren." }, items: [en.turn-down], acceptAlso: ["Could you turn the music down? I'm trying to study."] }
  - { id: s78, target: "Pause the film. I want to get a drink.", native: { nl: "Zet de film op pauze. Ik wil iets te drinken pakken." }, items: [en.pause] }
  - { id: s79, target: "Grandad still has an old CD player.", native: { nl: "Opa heeft nog een oude cd-speler." }, items: [en.cd-player] }
  - { id: s80, target: "Nobody uses our DVD player any more.", native: { nl: "Niemand gebruikt onze dvd-speler nog." }, items: [en.dvd-player] }
  - { id: s81, target: "My favourite painter lived in France.", native: { nl: "Mijn favoriete schilder woonde in Frankrijk." }, items: [en.painter] }
  - { id: s82, target: "The actor who plays the hero is only sixteen.", native: { nl: "De acteur die de held speelt, is pas zestien." }, items: [en.hero] }
  - { id: s83, target: "The film that we saw last night was a thriller.", native: { nl: "De film die we gisteravond zagen, was een thriller." }, items: [en.thriller], build: true }
