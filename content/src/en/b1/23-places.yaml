  - { id: s38, target: "We had a magnificent view of the mountains.", native: { nl: "We hadden een prachtig uitzicht op de bergen." }, items: [en.magnificent] }
  - { id: s39, target: "The view from the top of the tower is spectacular.", native: { nl: "Het uitzicht vanaf de top van de toren is spectaculair." }, items: [en.spectacular, en.tower] }
