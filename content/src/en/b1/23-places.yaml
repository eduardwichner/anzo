  - { id: s55, target: "We rented a little cottage in the countryside.", native: { nl: "We huurden een klein huisje op het platteland." }, items: [en.cottage] }
  - { id: s56, target: "We stayed dry in a small hut during the storm.", native: { nl: "We bleven droog in een kleine hut tijdens de storm." }, items: [en.hut], acceptAlso: ["During the storm we stayed dry in a small hut."] }
