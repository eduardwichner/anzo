  - { id: s48, target: "There's a monument to the soldiers in the square.", native: { nl: "Er staat een monument voor de soldaten op het plein." }, items: [en.monument] }
  - { id: s49, target: "We met by the statue in the park.", native: { nl: "We spraken af bij het standbeeld in het park." }, items: [en.statue] }
  - { id: s50, target: "Children were playing in the fountain.", native: { nl: "Er speelden kinderen in de fontein." }, items: [en.fountain] }
  - { id: s51, target: "The king lived in this palace.", native: { nl: "De koning woonde in dit paleis." }, items: [en.palace] }
