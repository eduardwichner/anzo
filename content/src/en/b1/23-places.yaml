  - { id: s58, target: "The fishing boats are back in the harbour.", native: { nl: "De vissersboten liggen weer in de haven." }, items: [en.harbour] }
  - { id: s59, target: "Rotterdam is one of the biggest ports in the world.", native: { nl: "Rotterdam is een van de grootste havens ter wereld." }, items: [en.port] }
  - { id: s60, target: "We spent a week at the seaside.", native: { nl: "We brachten een week door aan zee." }, items: [en.seaside] }
  - { id: s61, target: "A small river runs through the valley.", native: { nl: "Er stroomt een kleine rivier door de vallei." }, items: [en.valley] }
  - { id: s62, target: "The scenery in Scotland is beautiful.", native: { nl: "Het landschap in Schotland is prachtig." }, items: [en.scenery] }
  - { id: s63, target: "This is the area where my mother grew up.", native: { nl: "Dit is het gebied waar mijn moeder is opgegroeid." }, items: [en.area] }
  - { id: s64, target: "That's the man whose cottage is next to the castle.", native: { nl: "Dat is de man wiens huisje naast het kasteel staat." }, items: [en.cottage] }
