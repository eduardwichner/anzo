sentences:
  - { id: s01, target: "This area is famous for its cheese.", native: { nl: "Dit gebied is beroemd om zijn kaas." }, items: [en.area] }
  - { id: s02, target: "It often rains in this region.", native: { nl: "Het regent vaak in deze regio." }, items: [en.region], acceptAlso: ["In this region it often rains."] }
  - { id: s03, target: "We live in a quiet district of the city.", native: { nl: "We wonen in een rustige wijk van de stad." }, items: [en.district] }
  - { id: s04, target: "The centre is a car-free zone.", native: { nl: "Het centrum is een autovrije zone." }, items: [en.zone] }
  - { id: s05, target: "Asia is the biggest continent.", native: { nl: "Azië is het grootste werelddeel." }, items: [en.continent] }
  - { id: s06, target: "What's the capital of Australia?", native: { nl: "Wat is de hoofdstad van Australië?" }, items: [en.capital] }
  - { id: s07, target: "The population of the town has doubled.", native: { nl: "De bevolking van de stad is verdubbeld." }, items: [en.population] }
  - { id: s08, target: "We read about it in the local newspaper.", native: { nl: "We lazen erover in de plaatselijke krant." }, items: [en.local] }
  - { id: s09, target: "The hotel is in a very central location.", native: { nl: "Het hotel ligt heel centraal." }, items: [en.central, en.location] }
  - { id: s10, target: "It's colder in northern England.", native: { nl: "Het is kouder in het noorden van Engeland." }, items: [en.northern] }
  - { id: s11, target: "Southern Spain is hot and dry in summer.", native: { nl: "Zuid-Spanje is warm en droog in de zomer." }, items: [en.southern], acceptAlso: ["In summer southern Spain is hot and dry."] }
  - { id: s12, target: "They live in a small village in eastern Germany.", native: { nl: "Ze wonen in een klein dorp in Oost-Duitsland." }, items: [en.eastern] }
  - { id: s13, target: "The storm will reach western Scotland tonight.", native: { nl: "De storm bereikt vanavond het westen van Schotland." }, items: [en.western], acceptAlso: ["Tonight the storm will reach western Scotland."] }
  - { id: s14, target: "Newcastle is in the northeast of England.", native: { nl: "Newcastle ligt in het noordoosten van Engeland." }, items: [en.northeast] }
  - { id: s15, target: "Liverpool is in the northwest.", native: { nl: "Liverpool ligt in het noordwesten." }, items: [en.northwest] }
  - { id: s16, target: "The wind is coming from the southeast.", native: { nl: "De wind komt uit het zuidoosten." }, items: [en.southeast] }
  - { id: s17, target: "Cornwall is in the southwest of England.", native: { nl: "Cornwall ligt in het zuidwesten van Engeland." }, items: [en.southwest] }
