  - { id: s45, target: "We're studying modern architecture.", native: { nl: "We bestuderen moderne architectuur." }, items: [en.architecture] }
  - { id: s46, target: "The festival attracts thousands of visitors.", native: { nl: "Het festival trekt duizenden bezoekers aan." }, items: [en.attract] }
