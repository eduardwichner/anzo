  - { id: s34, target: "The river is very wide here.", native: { nl: "De rivier is hier heel breed." }, items: [en.wide] }
  - { id: s35, target: "He has broad shoulders.", native: { nl: "Hij heeft brede schouders." }, items: [en.broad] }
  - { id: s36, target: "The path up the hill is very steep.", native: { nl: "Het pad de heuvel op is heel steil." }, items: [en.steep] }
