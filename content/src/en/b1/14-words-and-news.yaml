sentences:
  - { id: s01, target: "English grammar is easier than German grammar.", native: { nl: "De Engelse grammatica is makkelijker dan de Duitse." }, items: [en.grammar] }
  - { id: s02, target: "Reading helps you to learn new vocabulary.", native: { nl: "Lezen helpt je om nieuwe woordenschat te leren." }, items: [en.vocabulary] }
  - { id: s03, target: "What's the meaning of this word?", native: { nl: "Wat is de betekenis van dit woord?" }, items: [en.meaning] }
  - { id: s04, target: "Learn these useful phrases before your trip.", native: { nl: "Leer deze nuttige uitdrukkingen voor je reis." }, items: [en.phrase] }
  - { id: s05, target: "We're learning the past tense this week.", native: { nl: "We leren deze week de verleden tijd." }, items: [en.tense], acceptAlso: ["This week we're learning the past tense."] }
  - { id: s06, target: "Check your spelling before you hand it in.", native: { nl: "Controleer je spelling voordat je het inlevert." }, items: [en.spelling] }
  - { id: s07, target: "A, E, I, O and U are vowels.", native: { nl: "A, E, I, O en U zijn klinkers." }, items: [en.vowel] }
  - { id: s08, target: "The word 'street' has a lot of consonants.", native: { nl: "Het woord 'street' heeft veel medeklinkers." }, items: [en.consonant] }
  - { id: s09, target: "How do you pronounce your surname?", native: { nl: "Hoe spreek je je achternaam uit?" }, items: [en.pronounce] }
  - { id: s10, target: "Her pronunciation is very clear.", native: { nl: "Haar uitspraak is heel duidelijk." }, items: [en.pronunciation] }
  - { id: s11, target: "He speaks English with an Irish accent.", native: { nl: "Hij spreekt Engels met een Iers accent." }, items: [en.accent] }
  - { id: s12, target: "Dolphins communicate with sounds.", native: { nl: "Dolfijnen communiceren met geluiden." }, items: [en.communicate] }
  - { id: s13, target: "Good communication is important in a team.", native: { nl: "Goede communicatie is belangrijk in een team." }, items: [en.communication] }
  - { id: s14, target: "Can you translate this letter into Dutch?", native: { nl: "Kun je deze brief in het Nederlands vertalen?" }, items: [en.translate] }
  - { id: s15, target: "The translation isn't very good.", native: { nl: "De vertaling is niet erg goed." }, items: [en.translation] }
  - { id: s16, target: "Look up the word in your dictionary.", native: { nl: "Zoek het woord op in je woordenboek." }, items: [en.look-up], acceptAlso: ["Look the word up in your dictionary."] }
  - { id: s17, target: "The teacher asked me to read the poem aloud.", native: { nl: "De leraar vroeg me het gedicht hardop voor te lezen." }, items: [en.aloud, en.poem] }
  - { id: s18, target: "Every sentence ends with a full stop.", native: { nl: "Elke zin eindigt met een punt." }, items: [en.full-stop] }
  - { id: s19, target: "You need a comma after the first part of the sentence.", native: { nl: "Je hebt een komma nodig na het eerste deel van de zin." }, items: [en.comma] }
  - { id: s20, target: "We're studying a short period of history.", native: { nl: "We bestuderen een korte periode uit de geschiedenis." }, items: [en.period] }
  - { id: s21, target: "Read the first paragraph again.", native: { nl: "Lees de eerste alinea nog eens." }, items: [en.paragraph] }
  - { id: s22, target: "Underline the most important words.", native: { nl: "Onderstreep de belangrijkste woorden." }, items: [en.underline] }
