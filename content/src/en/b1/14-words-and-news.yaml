  - { id: s65, target: "She mentioned that she had a new job.", native: { nl: "Ze zei terloops dat ze een nieuwe baan had." }, items: [en.mention] }
  - { id: s66, target: "There's a notice on the door about the meeting.", native: { nl: "Er hangt een mededeling op de deur over de vergadering." }, items: [en.notice] }
