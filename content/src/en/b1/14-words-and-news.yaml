  - { id: s73, target: "Is this sentence true or false?", native: { nl: "Is deze zin waar of onwaar?" }, items: [en.false] }
  - { id: s74, target: "The writer of the song is unknown.", native: { nl: "De schrijver van het liedje is onbekend." }, items: [en.unknown] }
  - { id: s75, target: "Social media has a big influence on teenagers.", native: { nl: "Sociale media hebben een grote invloed op tieners." }, items: [en.influence] }
  - { id: s76, target: "Please fill in this questionnaire about our school.", native: { nl: "Vul alsjeblieft deze vragenlijst over onze school in." }, items: [en.questionnaire] }
  - { id: s77, target: "I saw an ad for a cheap bike online.", native: { nl: "Ik zag online een advertentie voor een goedkope fiets." }, items: [en.ad], acceptAlso: ["I saw an ad online for a cheap bike."] }
  - { id: s78, target: "There are too many adverts on TV.", native: { nl: "Er is te veel reclame op tv." }, items: [en.advert] }
  - { id: s79, target: "The shop advertises in the local newspaper.", native: { nl: "De winkel adverteert in de plaatselijke krant." }, items: [en.advertise] }
  - { id: s80, target: "The reporter said that the match was very exciting.", native: { nl: "De verslaggever zei dat de wedstrijd heel spannend was." }, items: [en.reporter] }
  - { id: s81, target: "The teacher asked us what the poem was about.", native: { nl: "De leraar vroeg ons waar het gedicht over ging." }, items: [en.poem] }
  - { id: s82, target: "The reporter told me that she was tired.", native: { nl: "De verslaggeefster zei me dat ze moe was." }, items: [en.reporter], build: true }
  - { id: s83, target: "He asked me if I liked the novel.", native: { nl: "Hij vroeg me of ik de roman leuk vond." }, items: [en.novel] }
