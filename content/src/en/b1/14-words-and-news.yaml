  - { id: s36, target: "The detective found the answer in the last chapter.", native: { nl: "De detective vond het antwoord in het laatste hoofdstuk." }, items: [en.detective, en.chapter] }
  - { id: s37, target: "My brother loves films about spies.", native: { nl: "Mijn broer houdt van films over spionnen." }, items: [en.spy] }
