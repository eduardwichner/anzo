  - { id: s43, target: "We're reading poetry in English lessons this term.", native: { nl: "We lezen dit trimester poëzie in de Engelse les." }, items: [en.poetry], acceptAlso: ["This term we're reading poetry in English lessons."] }
  - { id: s44, target: "Her first book became a bestseller.", native: { nl: "Haar eerste boek werd een bestseller." }, items: [en.bestseller] }
  - { id: s45, target: "I can't remember the title of the song.", native: { nl: "Ik kan me de titel van het liedje niet herinneren." }, items: [en.title] }
  - { id: s46, target: "Look at the contents page to find the chapter.", native: { nl: "Kijk in de inhoudsopgave om het hoofdstuk te vinden." }, items: [en.contents] }
  - { id: s47, target: "Don't judge a book by its cover.", native: { nl: "Beoordeel een boek niet op zijn kaft." }, items: [en.cover] }
  - { id: s48, target: "Her story was published in the school magazine.", native: { nl: "Haar verhaal werd gepubliceerd in het schooltijdschrift." }, items: [en.publish] }
  - { id: s49, target: "The publisher sent the book to every school.", native: { nl: "De uitgever stuurde het boek naar elke school." }, items: [en.publisher] }
