  - { id: s54, target: "Have you seen this month's issue of the magazine?", native: { nl: "Heb je het nummer van het tijdschrift van deze maand al gezien?" }, items: [en.issue] }
  - { id: s55, target: "I always read the sports section first.", native: { nl: "Ik lees altijd eerst de sportrubriek." }, items: [en.section] }
  - { id: s56, target: "We wrote a report about our school trip.", native: { nl: "We schreven een verslag over ons schoolreisje." }, items: [en.report], finite: { word: wrote, hint: { nl: "write (verleden tijd)" } } }
  - { id: s57, target: "A reporter interviewed the winners.", native: { nl: "Een verslaggever interviewde de winnaars." }, items: [en.reporter] }
  - { id: s58, target: "The presenter of the quiz show is very funny.", native: { nl: "De presentator van de quizshow is heel grappig." }, items: [en.presenter] }
  - { id: s59, target: "We watched a documentary about whales.", native: { nl: "We keken naar een documentaire over walvissen." }, items: [en.documentary] }
