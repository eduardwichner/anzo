  - { id: s24, target: "Write down your address here.", native: { nl: "Schrijf je adres hier op." }, items: [en.write-down], acceptAlso: ["Write your address down here."] }
  - { id: s25, target: "Writing stories is my favourite hobby.", native: { nl: "Verhalen schrijven is mijn favoriete hobby." }, items: [en.writing] }
