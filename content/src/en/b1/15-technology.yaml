  - { id: s27, target: "This web page has information about the museum.", native: { nl: "Op deze webpagina staat informatie over het museum." }, items: [en.web-page] }
  - { id: s28, target: "Go back to the homepage and click on the first link.", native: { nl: "Ga terug naar de homepagina en klik op de eerste link." }, items: [en.homepage, en.click, en.link] }
