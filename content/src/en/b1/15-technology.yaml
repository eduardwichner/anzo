sentences:
  - { id: s01, target: "Technology changes very quickly.", native: { nl: "Technologie verandert heel snel." }, items: [en.technology] }
  - { id: s02, target: "The telephone was an important invention.", native: { nl: "De telefoon was een belangrijke uitvinding." }, items: [en.invention] }
  - { id: s03, target: "Who was the inventor of the computer?", native: { nl: "Wie was de uitvinder van de computer?" }, items: [en.inventor] }
  - { id: s04, target: "Please switch off all electronic equipment.", native: { nl: "Schakel alstublieft alle elektronische apparatuur uit." }, items: [en.electronic] }
  - { id: s05, target: "We use digital books at school.", native: { nl: "We gebruiken digitale boeken op school." }, items: [en.digital], acceptAlso: ["At school we use digital books."] }
  - { id: s06, target: "Grandad bought a digital camera for his holiday.", native: { nl: "Opa kocht een digitale camera voor zijn vakantie." }, items: [en.digital-camera] }
  - { id: s07, target: "Hand-held games were very popular thirty years ago.", native: { nl: "Draagbare spelcomputers waren dertig jaar geleden heel populair." }, items: [en.hand-held], acceptAlso: ["Thirty years ago hand-held games were very popular."] }
  - { id: s08, target: "Almost everyone in my class has a smartphone.", native: { nl: "Bijna iedereen in mijn klas heeft een smartphone." }, items: [en.smartphone], acceptAlso: ["In my class almost everyone has a smartphone."] }
  - { id: s09, target: "Call me on my mobile.", native: { nl: "Bel me op mijn mobieltje." }, items: [en.mobile] }
  - { id: s10, target: "My battery is nearly dead.", native: { nl: "Mijn batterij is bijna leeg." }, items: [en.battery] }
  - { id: s11, target: "I need a cable to connect the printer.", native: { nl: "Ik heb een kabel nodig om de printer aan te sluiten." }, items: [en.cable, en.connect] }
  - { id: s12, target: "There are thirty PCs in the computer room.", native: { nl: "Er staan dertig pc's in het computerlokaal." }, items: [en.pc], acceptAlso: ["In the computer room there are thirty PCs."] }
  - { id: s13, target: "The software is fine, but the hardware is old.", native: { nl: "De software is goed, maar de hardware is oud." }, items: [en.hardware, en.software] }
  - { id: s14, target: "The school has a new computer system.", native: { nl: "De school heeft een nieuw computersysteem." }, items: [en.system] }
  - { id: s15, target: "Ask your parents before you install an app.", native: { nl: "Vraag het je ouders voordat je een app installeert." }, items: [en.install], acceptAlso: ["Before you install an app, ask your parents."] }
  - { id: s16, target: "My phone needs an update.", native: { nl: "Mijn telefoon heeft een update nodig." }, items: [en.update] }
  - { id: s17, target: "The new version of the game is much faster.", native: { nl: "De nieuwe versie van het spel is veel sneller." }, items: [en.version] }
  - { id: s18, target: "Don't open that email. It might contain a virus.", native: { nl: "Open die e-mail niet. Er zou een virus in kunnen zitten." }, items: [en.virus] }
  - { id: s19, target: "Websites collect a lot of data about their users.", native: { nl: "Websites verzamelen veel gegevens over hun gebruikers." }, items: [en.data, en.user] }
  - { id: s20, target: "The server is down, so the website isn't working.", native: { nl: "De server ligt plat, dus de website werkt niet." }, items: [en.server] }
  - { id: s21, target: "The school network is very slow today.", native: { nl: "Het schoolnetwerk is vandaag heel traag." }, items: [en.network], acceptAlso: ["Today the school network is very slow."] }
