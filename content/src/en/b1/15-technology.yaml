  - { id: s32, target: "Select the photos you want to print.", native: { nl: "Selecteer de foto's die je wilt printen." }, items: [en.select, en.print] }
  - { id: s33, target: "Drag the file into the folder.", native: { nl: "Sleep het bestand naar de map." }, items: [en.drag, en.folder] }
  - { id: s34, target: "Press the green button to start.", native: { nl: "Druk op de groene knop om te beginnen." }, items: [en.press], acceptAlso: ["To start, press the green button."] }
  - { id: s35, target: "She can type very fast.", native: { nl: "Ze kan heel snel typen." }, items: [en.type] }
  - { id: s36, target: "I deleted the photo by mistake.", native: { nl: "Ik heb de foto per ongeluk gewist." }, items: [en.delete] }
  - { id: s37, target: "The film is on a disc.", native: { nl: "De film staat op een schijfje." }, items: [en.disc] }
  - { id: s38, target: "You can download the app for free.", native: { nl: "Je kunt de app gratis downloaden." }, items: [en.download] }
  - { id: s39, target: "I uploaded the video last night.", native: { nl: "Ik heb de video gisteravond geüpload." }, items: [en.upload], acceptAlso: ["Last night I uploaded the video."] }
  - { id: s40, target: "Please attach a photo to your email.", native: { nl: "Voeg alsjeblieft een foto bij je e-mail." }, items: [en.attach] }
  - { id: s41, target: "The printer has run out of paper.", native: { nl: "De printer heeft geen papier meer." }, items: [en.printer] }
  - { id: s42, target: "The graphics in this game are amazing.", native: { nl: "De graphics in dit spel zijn geweldig." }, items: [en.graphics] }
  - { id: s43, target: "Where's the remote control for the TV?", native: { nl: "Waar is de afstandsbediening van de tv?" }, items: [en.control] }
  - { id: s44, target: "I don't spend much time on social media.", native: { nl: "Ik breng niet veel tijd door op sociale media." }, items: [en.social-media] }
  - { id: s45, target: "She writes a blog about her travels.", native: { nl: "Ze schrijft een blog over haar reizen." }, items: [en.blog] }
  - { id: s46, target: "The blogger has thousands of readers.", native: { nl: "De blogger heeft duizenden lezers." }, items: [en.blogger] }
  - { id: s47, target: "I listen to a science podcast on the bus.", native: { nl: "Ik luister in de bus naar een wetenschapspodcast." }, items: [en.podcast], acceptAlso: ["On the bus I listen to a science podcast."] }
  - { id: s48, target: "Watch this funny video clip!", native: { nl: "Kijk deze grappige videoclip!" }, items: [en.video-clip] }
  - { id: s49, target: "We talked to Grandma using the webcam.", native: { nl: "We praatten met oma via de webcam." }, items: [en.webcam] }
  - { id: s50, target: "Let's take a selfie in front of the castle!", native: { nl: "Laten we een selfie maken voor het kasteel!" }, items: [en.selfie] }
  - { id: s51, target: "Don't share photos of other people without asking.", native: { nl: "Deel geen foto's van andere mensen zonder het te vragen." }, items: [en.share] }
  - { id: s52, target: "Lots of people commented on her post.", native: { nl: "Veel mensen reageerden op haar bericht." }, items: [en.comment] }
  - { id: s53, target: "Be careful who you talk to in a chatroom.", native: { nl: "Pas op met wie je praat in een chatroom." }, items: [en.chatroom] }
  - { id: s54, target: "I got a text message from my brother.", native: { nl: "Ik kreeg een sms'je van mijn broer." }, items: [en.text-message] }
  - { id: s55, target: "Has the mail arrived yet?", native: { nl: "Is de post al gekomen?" }, items: [en.mail] }
  - { id: s56, target: "A parcel came for you this morning.", native: { nl: "Er kwam vanochtend een pakket voor je." }, items: [en.parcel], acceptAlso: ["This morning a parcel came for you."] }
  - { id: s57, target: "Did you receive my email?", native: { nl: "Heb je mijn e-mail ontvangen?" }, items: [en.receive] }
  - { id: s58, target: "I'm still waiting for a reply.", native: { nl: "Ik wacht nog steeds op antwoord." }, items: [en.reply] }
  - { id: s59, target: "Best regards, Daniel", native: { nl: "Met vriendelijke groeten, Daniel" }, items: [en.regards] }
  - { id: s60, target: "Yours sincerely, Anna Taylor", native: { nl: "Hoogachtend, Anna Taylor" }, items: [en.sincerely] }
  - { id: s61, target: "Some offices still use a fax machine.", native: { nl: "Sommige kantoren gebruiken nog een faxapparaat." }, items: [en.fax] }
  - { id: s62, target: "The operator connected me to the hotel.", native: { nl: "De telefonist verbond me door met het hotel." }, items: [en.operator] }
  - { id: s63, target: "In an emergency, dial 112.", native: { nl: "Bel in een noodgeval 112." }, items: [en.dial], acceptAlso: ["Dial 112 in an emergency."] }
  - { id: s64, target: "Thirty years ago, you had to dial up to get online.", native: { nl: "Dertig jaar geleden moest je inbellen om online te gaan." }, items: [en.dial-up], acceptAlso: ["You had to dial up to get online thirty years ago."] }
  - { id: s65, target: "I'll ring you up tomorrow.", native: { nl: "Ik bel je morgen op." }, items: [en.ring-up], acceptAlso: ["Tomorrow I'll ring you up."] }
  - { id: s66, target: "She's busy at the moment. Can she ring you back?", native: { nl: "Ze is op dit moment bezig. Kan ze je terugbellen?" }, items: [en.ring-back] }
  - { id: s67, target: "He hung up before I could say goodbye.", native: { nl: "Hij hing op voordat ik gedag kon zeggen." }, items: [en.hang-up], finite: { word: hung, hint: { nl: "hang (verleden tijd: … up)" } }, acceptAlso: ["Before I could say goodbye, he hung up."] }
  - { id: s68, target: "Can you put me through to the manager, please?", native: { nl: "Kunt u me doorverbinden met de manager, alstublieft?" }, items: [en.put-through] }
  - { id: s69, target: "Could you pass on a message to your mum?", native: { nl: "Kun je een boodschap aan je moeder doorgeven?" }, items: [en.pass-on] }
  - { id: s70, target: "Leave a message on the answerphone.", native: { nl: "Laat een bericht achter op het antwoordapparaat." }, items: [en.answerphone] }
  - { id: s71, target: "Smartphones are used for much more than calls.", native: { nl: "Smartphones worden voor veel meer gebruikt dan bellen." }, items: [en.smartphone] }
