  - { sentence: en-b1-t22-s04, word: requested, kind: finite_verb, hint: { nl: "request (verleden tijd)" } }
  - { sentence: en-b1-t22-s07, word: closed, kind: finite_verb, hint: { nl: "close (verleden tijd)" } }
  - { sentence: en-b1-t22-s09, word: are, kind: finite_verb, hint: { nl: "be (tegenwoordige tijd)" } }
