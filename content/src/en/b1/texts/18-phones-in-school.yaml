  - { sentence: en-b1-t18-s05, word: did, kind: finite_verb, hint: { nl: "do (verleden tijd)" } }
  - { sentence: en-b1-t18-s09, word: seems, kind: finite_verb, hint: { nl: "seem (tegenwoordige tijd)" } }
