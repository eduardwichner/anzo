id: en-b1-t29
kind: reading
title: { nl: De wetenschapsclub meet de school }
topic: Numbers and measuring (a report by a school science club)
level: B1
paragraphs:
  - - { id: en-b1-t29-s01, target: "Every Thursday after school, the science club meets in the laboratory.", native: { nl: "Elke donderdag na school komt de wetenschapsclub samen in het laboratorium." } }
    - { id: en-b1-t29-s02, target: "This term, our teacher gave us an unusual project: to measure the school.", native: { nl: "Dit trimester gaf onze leraar ons een ongewoon project: de school opmeten." } }
  - - { id: en-b1-t29-s03, target: "At first we thought it would be easy, but it took ages.", native: { nl: "Eerst dachten we dat het makkelijk zou zijn, maar het duurde een eeuwigheid." } }
    - { id: en-b1-t29-s04, target: "We measured the length of the playground with a long tape: it is exactly forty-two metres.", native: { nl: "We maten de lengte van het schoolplein met een lang meetlint: het is precies tweeënveertig meter." } }
    - { id: en-b1-t29-s05, target: "Measuring the height of the building was harder, so we used its shadow and a little arithmetic.", native: { nl: "De hoogte van het gebouw meten was moeilijker, dus gebruikten we de schaduw ervan en een beetje rekenwerk." } }
  - - { id: en-b1-t29-s06, target: "We also weighed every pupil's school bag on a Monday morning.", native: { nl: "We wogen ook op een maandagochtend de schooltas van elke leerling." } }
    - { id: en-b1-t29-s07, target: "The average bag weighed approximately six kilogrammes, and the heaviest one weighed eleven!", native: { nl: "De gemiddelde tas woog ongeveer zes kilogram, en de zwaarste woog er elf!" } }
    - { id: en-b1-t29-s08, target: "Doctors say a bag should not be more than ten percent of your weight, so many bags are too heavy.", native: { nl: "Artsen zeggen dat een tas niet meer dan tien procent van je gewicht mag zijn, dus veel tassen zijn te zwaar." } }
  - - { id: en-b1-t29-s09, target: "In the end, we put all our results in a diagram and showed it at the school's open evening.", native: { nl: "Uiteindelijk zetten we al onze resultaten in een diagram en lieten we het zien op de open avond van de school." } }
    - { id: en-b1-t29-s10, target: "Next term we are going to measure how much water the school uses every day.", native: { nl: "Volgend trimester gaan we meten hoeveel water de school elke dag gebruikt." } }
glossary:
  - { word: tape, native: { nl: meetlint } }
