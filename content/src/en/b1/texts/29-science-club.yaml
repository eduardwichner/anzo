  - { id: en-b1-t29-q2, type: true_false_notgiven, statement: "Measuring the school was as easy as the students expected.", answer: false }
  - { id: en-b1-t29-q3, type: true_false_notgiven, statement: "The heaviest bag belonged to the youngest pupil.", answer: not_given }
  - { id: en-b1-t29-q4, type: true_false_notgiven, statement: "The playground is forty-two metres long.", answer: true }
  - { id: en-b1-t29-q5, type: mc, question: "How did they measure the height of the building?", options: ["With its shadow and some arithmetic.", "With a long tape from the roof.", "They asked the architect."], correct: 0 }
  - { id: en-b1-t29-q6, type: match_heading, paragraph: 3, options: ["Heavy school bags", "Measuring the playground", "Plans for next term"], correct: 0 }
