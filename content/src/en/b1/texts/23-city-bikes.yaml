id: en-b1-t23
kind: reading
title: { nl: Fietsen in de stad }
topic: Getting around (a notice from the city council about a new bike scheme)
level: B1
paragraphs:
  - - { id: en-b1-t23-s01, target: "From 1 April, you can hire a city bike at forty stations in the town centre.", native: { nl: "Vanaf 1 april kun je een stadsfiets huren bij veertig stations in het stadscentrum." } }
    - { id: en-b1-t23-s02, target: "The bikes are a cheap and healthy way to get around, and they help to reduce traffic jams and pollution.", native: { nl: "De fietsen zijn een goedkope en gezonde manier om je te verplaatsen, en ze helpen om files en vervuiling te verminderen." } }
  - - { id: en-b1-t23-s03, target: "To use the bikes, download the City Bikes app and sign up with your credit card.", native: { nl: "Om de fietsen te gebruiken, download je de City Bikes-app en meld je je aan met je kredietkaart." } }
    - { id: en-b1-t23-s04, target: "The first thirty minutes of every ride are free.", native: { nl: "De eerste dertig minuten van elke rit zijn gratis." } }
    - { id: en-b1-t23-s05, target: "After that, it costs one pound for every extra half hour.", native: { nl: "Daarna kost het één pond voor elk extra halfuur." } }
  - - { id: en-b1-t23-s06, target: "Please ride safely. Always use the cycle lanes, and never ride on the pavement.", native: { nl: "Fiets alsjeblieft veilig. Gebruik altijd de fietspaden, en fiets nooit op de stoep." } }
    - { id: en-b1-t23-s07, target: "Give way to pedestrians at crossings, and stop at red traffic lights.", native: { nl: "Geef voorrang aan voetgangers bij oversteekplaatsen, en stop bij rode verkeerslichten." } }
    - { id: en-b1-t23-s08, target: "Children under fourteen must ride with an adult.", native: { nl: "Kinderen onder de veertien moeten met een volwassene fietsen." } }
  - - { id: en-b1-t23-s09, target: "If a bike breaks down, leave it at the nearest station and report the problem in the app.", native: { nl: "Als een fiets kapotgaat, laat hem dan bij het dichtstbijzijnde station achter en meld het probleem in de app." } }
    - { id: en-b1-t23-s10, target: "Our team checks every bike once a week, so most problems are fixed quickly.", native: { nl: "Ons team controleert elke fiets één keer per week, dus de meeste problemen worden snel opgelost." } }
glossary:
  - { word: cycle lanes, native: { nl: fietspaden } }
