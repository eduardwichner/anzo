  - { id: en-b1-t24-q1, type: mc, question: "What does Jacob think about his village?", options: ["It's boring.", "It's too crowded.", "It's very lively."], correct: 0 }
  - { id: en-b1-t24-q2, type: true_false_notgiven, statement: "There are lots of buses in Jacob's village.", answer: false }
  - { id: en-b1-t24-q3, type: true_false_notgiven, statement: "Ella lives in the capital.", answer: true }
  - { id: en-b1-t24-q4, type: true_false_notgiven, statement: "Ella's parents have a car.", answer: not_given }
  - { id: en-b1-t24-q5, type: mc, question: "What do the cousins plan to do?", options: ["Exchange homes for a month.", "Move to the countryside together.", "Visit a museum tonight."], correct: 0 }
