  - { id: en-b1-t11-q2, type: true_false_notgiven, statement: "Teenagers need less than eight hours of sleep.", answer: false }
  - { id: en-b1-t11-q3, type: true_false_notgiven, statement: "Mrs Evans has worked at the school for many years.", answer: not_given }
  - { id: en-b1-t11-q4, type: true_false_notgiven, statement: "Tired students have more accidents in sport.", answer: true }
  - { id: en-b1-t11-q5, type: mc, question: "Why should you avoid screens before bed?", options: ["The light keeps your brain awake.", "Phones are expensive.", "Your eyes get tired."], correct: 0 }
  - { id: en-b1-t11-q6, type: match_heading, paragraph: 3, options: ["Two simple tips", "Why sleep matters", "Where to get help"], correct: 0 }
