id: en-b1-t19
kind: reading
title: { nl: Een dag uit het leven van een dierenarts }
topic: Jobs (an interview in a careers magazine for young people)
level: B1
paragraphs:
  - - { id: en-b1-t19-s01, target: "Sarah Patel has been a vet in a small town in Wales for twelve years.", native: { nl: "Sarah Patel is al twaalf jaar dierenarts in een klein stadje in Wales." } }
    - { id: en-b1-t19-s02, target: "We asked her what her job is really like.", native: { nl: "We vroegen haar hoe haar werk echt is." } }
  - - { id: en-b1-t19-s03, target: "\"My day usually starts at eight, when I check the animals that stayed overnight,\" she explains.", native: { nl: "\"Mijn dag begint meestal om acht uur, wanneer ik de dieren controleer die er de nacht zijn gebleven,\" legt ze uit." } }
    - { id: en-b1-t19-s04, target: "\"Then the receptionist opens the doors, and the first owners arrive with their cats, dogs and rabbits.\"", native: { nl: "\"Daarna doet de receptionist de deuren open, en komen de eerste baasjes met hun katten, honden en konijnen.\"" } }
  - - { id: en-b1-t19-s05, target: "In the afternoon she often visits farms, because many of her patients are cows and sheep.", native: { nl: "'s Middags bezoekt ze vaak boerderijen, omdat veel van haar patiënten koeien en schapen zijn." } }
    - { id: en-b1-t19-s06, target: "\"It's hard work, especially in winter, but I love being outdoors.\"", native: { nl: "\"Het is zwaar werk, vooral in de winter, maar ik ben graag buiten.\"" } }
  - - { id: en-b1-t19-s07, target: "When she gets back from the farms, Sarah manages a team of six: two other vets, three nurses and the receptionist.", native: { nl: "Als ze terug is van de boerderijen, leidt Sarah een team van zes: twee andere dierenartsen, drie dierenartsassistenten en de receptionist." } }
    - { id: en-b1-t19-s08, target: "\"My colleagues are the best part of the job,\" she says.", native: { nl: "\"Mijn collega's zijn het beste deel van het werk,\" zegt ze." } }
    - { id: en-b1-t19-s09, target: "\"We work long hours, so we have to support each other.\"", native: { nl: "\"We werken lange dagen, dus we moeten elkaar steunen.\"" } }
  - - { id: en-b1-t19-s10, target: "Her advice for young people who want to become vets?", native: { nl: "Haar advies voor jongeren die dierenarts willen worden?" } }
    - { id: en-b1-t19-s11, target: "\"Study hard, especially biology and chemistry, and try to get some experience. I started as a volunteer at an animal hospital when I was fifteen.\"", native: { nl: "\"Studeer hard, vooral biologie en scheikunde, en probeer wat ervaring op te doen. Ik begon als vrijwilliger in een dierenziekenhuis toen ik vijftien was.\"" } }
