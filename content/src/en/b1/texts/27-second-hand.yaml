id: en-b1-t27
kind: reading
title: { nl: Mode van de tweede hand }
topic: Fashion (a magazine article written by a teenager)
level: B1
paragraphs:
  - - { id: en-b1-t27-s01, target: "A year ago, I made a decision: I wasn't going to buy any new clothes for twelve months.", native: { nl: "Een jaar geleden nam ik een beslissing: ik zou twaalf maanden lang geen nieuwe kleren kopen." } }
    - { id: en-b1-t27-s02, target: "My friends thought I was crazy, because I've always loved fashion.", native: { nl: "Mijn vrienden vonden me gek, omdat ik altijd van mode heb gehouden." } }
  - - { id: en-b1-t27-s03, target: "I had read an article about how much water is needed to make one cotton T-shirt, and I was shocked.", native: { nl: "Ik had een artikel gelezen over hoeveel water er nodig is om één katoenen T-shirt te maken, en ik was geschokt." } }
    - { id: en-b1-t27-s04, target: "I also realised that half the clothes in my wardrobe were things I had only worn once or twice.", native: { nl: "Ik besefte ook dat de helft van de kleren in mijn kledingkast dingen waren die ik maar een of twee keer had gedragen." } }
  - - { id: en-b1-t27-s05, target: "So instead of going to the shopping centre, I started looking in second-hand shops and online.", native: { nl: "Dus in plaats van naar het winkelcentrum te gaan, begon ik in tweedehandswinkels en online te zoeken." } }
    - { id: en-b1-t27-s06, target: "I found a stylish leather jacket for fifteen pounds and some amazing old-fashioned dresses.", native: { nl: "Ik vond een stijlvol leren jasje voor vijftien pond en een paar geweldige ouderwetse jurken." } }
    - { id: en-b1-t27-s07, target: "When something didn't fit, my grandmother showed me how to make it smaller, and I even learned to sew buttons on properly.", native: { nl: "Als iets niet paste, liet mijn oma me zien hoe ik het kleiner kon maken, en ik leerde zelfs knopen goed aan te naaien." } }
  - - { id: en-b1-t27-s08, target: "My year is over now, but I don't think I'll go back.", native: { nl: "Mijn jaar is nu voorbij, maar ik denk niet dat ik nog nieuwe kleren ga kopen." } }
    - { id: en-b1-t27-s09, target: "I've saved a lot of money, my style is more original, and lots of my friends have started doing the same thing.", native: { nl: "Ik heb veel geld gespaard, mijn stijl is origineler, en veel van mijn vrienden zijn hetzelfde gaan doen." } }
