  - { id: en-b1-t07-q2, type: true_false_notgiven, statement: "The owner of the flat lives in the same building.", answer: not_given }
  - { id: en-b1-t07-q3, type: true_false_notgiven, statement: "The heating in the flat does not work properly.", answer: true }
  - { id: en-b1-t07-q4, type: true_false_notgiven, statement: "Isla's room is very big.", answer: false }
  - { id: en-b1-t07-q5, type: mc, question: "What did the elderly lady do?", options: ["She brought them a cake.", "She repaired the heating.", "She helped them hang pictures."], correct: 0 }
