sentences:
  - { id: s01, target: "My grandparents live in the countryside.", native: { nl: "Mijn opa en oma wonen op het platteland." }, items: [en.countryside] }
  - { id: s02, target: "Our village is very small.", native: { nl: "Ons dorp is heel klein." }, items: [en.village] }
  - { id: s03, target: "There are cows and sheep on the farm.", native: { nl: "Er zijn koeien en schapen op de boerderij." }, items: [en.farm] }
