id: en-a1
cefr: A1
# The exercises of the Pre-A1 to A2 packs are locked: the homophone rule for single-word listen_type is for new packs only.
legacyListenType: true
# Every sentence no exercise uses gets one in an optional extra lesson (<unit>-extra), appended after the
# locked exercises (new ids only).
extraLessons: true
source: >-
  Cambridge English Young Learners word list (149681-yle-flyers-word-list.pdf, exams from 2018): A1 Movers entries of
  the combined 'Pre A1 Starters, A1 Movers and A2 Flyers alphabetic vocabulary list' (British forms; American variants
  left out; words already taught at Starters are not taught again), numbers 21-100 and ordinals 1st-20th from its
  'Numbers' note, names from the Movers names list of the YLE Handbook for Teachers (153612). Sentences use Starters
  and Movers structures from the handbook's 'Grammar and structures' lists and any word up to Movers. Every word is
  checked with npm run content:trace -- en. Dutch translations written by the content author.
  Sources: content/src/en/a1/*.yaml; plan: content/src/en/PLAN.md.
omit:
  - { word: blonde, reason: "spelling variant of blond, which is taught (u02)" }
