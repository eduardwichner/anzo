    why: >-
      B2 First for Schools: the writing tasks (an email about a summer job, an article about future careers) and the speaking
      topics on work and the future; recruitment, working conditions and self-employment are the B2 range of the work domain.
      Attested in the paper: shift, flexibility, demanding, reference. Parity: nl-b2-u02 (werk en loopbaan), fr-b2.
    noun: [vacancy, applicant, internship, apprenticeship, income, promotion, supervisor, workplace, workload, overtime, shift, flexibility, responsibility, reference, entrepreneur, shortage]
    verb: [recruit, resign, commute]
    adj: [freelance, self-employed, flexible, remote, demanding, rewarding, skilled]
    phrase: [take on, take over, be in charge of]
  - id: b04-money
