# English B2 word list, derived: the groups below add level-B2 entries to wordlist-en.json on top of the
# YLE and B1 Preliminary lists (npm run content:wordlist; scripts/content/wordlist-en.js). Cambridge publishes no B2 list:
# a word the B2 First for Schools sample paper 1 uses is marked attested automatically (the builder checks the paper's text);
# the other words are topic words, each group with its justification. A word already on the YLE or B1 list is an error.
# Fields per group: id, theme, why, word lists noun / verb / adj / adv / prep / conj / phrase, and newSense (a word whose
# spelling matches a lower-list entry that is another word: make up "to be friends again" vs the noun make-up).
names: [Leo, Hart, Okafor, Priya, Sam, Mia, Tom, Aisha, Ben, Hannah, Dawson, Mill, Jamie, Clarke, Zara, Leeds, Nadia, Rahman, Eva, Lund, Ellie, Moore, Mozart, Shakespeare, Hollywood, Austria, Grace, Ollie, Kofi, Lily, Daniel, Sofia, Scotland, Darwin, Mars, Alexander, Fleming, Megan, Leon, Ruby]
groups:
  - id: b01-personality
    theme: "Personality, talent and ambition"
    why: >-
      B2 First for Schools: Reading Part 5 "Ballet dancer by chance" (scholarship, enrol, by chance), the writing and speaking
      tasks about people and ambitions; describing personality and coping with setbacks is B2 range (CEFR B2: a good range
      of vocabulary for matters connected to his field and most general topics). Parity: nl-b2-u01, fr-b2 u01.
    noun: [determination, scholarship, confidence, personality, motivation, failure, audition, role model, potential, passion, rehearsal, pressure]
    verb: [enrol, cope, struggle, overcome]
    adj: [ambitious, determined, gifted, sensitive, stubborn, modest, outgoing, impatient, motivated, dedicated, remarkable]
    adv: [eventually, gradually]
    phrase: [by chance, look up to]
  - id: b02-learning
    theme: "Studying and learning for life"
    why: >-
      B2 First for Schools: the essay task in the sample paper (school and learning), Listening Part 4 and the speaking topics
      about school life; study skills, assessment and online learning are the B2 range of the education domain. Attested in
      the paper: lifelong, concentration, attendance, assessment, effective, keep up with. Parity: nl-b2-u09, fr-b2.
    noun: [assignment, deadline, concentration, distraction, attendance, tutor, plagiarism, assessment, feedback, mentor, curiosity, discipline]
    verb: [memorise, focus, discourage, assess, broaden]
    adj: [lifelong, academic, practical, theoretical, compulsory, optional, effective]
    phrase: [take notes, figure out, catch up, fall behind, keep up with, drop out]
