      saving, debt and advertising are B2 range in the consumer domain. Attested in the paper: payment, spending.
      Parity: nl-b2-u03 (geld en consumptie), fr-b2.
    noun: [budget, expense, debt, savings, consumer, purchase, impulse, advertising, brand, payment, allowance, cost of living, necessity, wealth, poverty, investment, profit, spending, subscription, temptation, survey]
