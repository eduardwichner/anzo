  - { id: l03, title: { nl: Goed zo! }, vocab: [en.ok, en.nice, en.great, en.cool, en.fantastic, en.wow] }
  - { id: l04, title: { nl: "Hoera en o jee" }, vocab: [en.hooray, en.well-done, en.me-too, en.don-t-worry, en.oh-dear, en.pardon] }
