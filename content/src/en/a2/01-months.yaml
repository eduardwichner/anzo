sentences:
  - { id: s01, target: "My birthday is in January.", native: { nl: "Ik ben in januari jarig." }, items: [en.january] }
  - { id: s02, target: "February is a short month.", native: { nl: "Februari is een korte maand." }, items: [en.february, en.month] }
  - { id: s03, target: "We go skiing in March.", native: { nl: "In maart gaan we skiën." }, items: [en.march] }
  - { id: s04, target: "It often rains in April.", native: { nl: "Het regent vaak in april." }, items: [en.april] }
  - { id: s05, target: "There are a lot of flowers in May.", native: { nl: "In mei zijn er veel bloemen." }, items: [en.may] }
  - { id: s06, target: "We will go to the beach in June.", native: { nl: "In juni gaan we naar het strand." }, items: [en.june] }
  - { id: s07, target: "School finishes in July.", native: { nl: "In juli is de school uit." }, items: [en.july] }
  - { id: s08, target: "August is the hottest month.", native: { nl: "Augustus is de warmste maand." }, items: [en.august, en.month] }
  - { id: s09, target: "School starts again in September.", native: { nl: "In september begint de school weer." }, items: [en.september] }
  - { id: s10, target: "The leaves fall in October.", native: { nl: "In oktober vallen de bladeren." }, items: [en.october] }
  - { id: s11, target: "It is often foggy in November.", native: { nl: "In november is het vaak mistig." }, items: [en.november] }
  - { id: s12, target: "We have a holiday in December.", native: { nl: "In december hebben we vakantie." }, items: [en.december] }
  - { id: s13, target: "In spring the trees are green again.", native: { nl: "In de lente zijn de bomen weer groen." }, items: [en.spring] }
  - { id: s14, target: "We swim in the sea in summer.", native: { nl: "In de zomer zwemmen we in de zee." }, items: [en.summer] }
  - { id: s15, target: "In autumn the leaves turn brown.", native: { nl: "In de herfst worden de bladeren bruin." }, items: [en.autumn] }
  - { id: s16, target: "It snowed a lot last winter.", native: { nl: "Het heeft vorige winter veel gesneeuwd." }, items: [en.winter] }
  - { id: s17, target: "Look at the calendar.", native: { nl: "Kijk op de kalender." }, items: [en.calendar] }
  - { id: s18, target: "What's the date today?", native: { nl: "Welke datum is het vandaag?" }, items: [en.date], acceptAlso: ["What is the date today?"] }
  - { id: s19, target: "I write in my diary every evening.", native: { nl: "Ik schrijf elke avond in mijn dagboek." }, items: [en.diary] }
  - { id: s20, target: "This castle is more than a century old.", native: { nl: "Dit kasteel is meer dan een eeuw oud." }, items: [en.century] }
  - { id: s21, target: "What do you want to be in the future?", native: { nl: "Wat wil jij in de toekomst worden?" }, items: [en.future] }
  - { id: s22, target: "In which month is your birthday?", native: { nl: "In welke maand ben jij jarig?" }, items: [en.month] }
