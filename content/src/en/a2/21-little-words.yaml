  - { target: million, native: { nl: miljoen }, pos: number }
  - { target: kilometre, native: { nl: kilometer }, pos: noun }
  - { target: thirtieth, native: { nl: dertigste }, pos: adjective }
  - { target: how long, native: { nl: hoe lang }, pos: question }
  - { target: if, native: { nl: "als (wanneer)" }, pos: conjunction }
