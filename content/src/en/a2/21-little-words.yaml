  - { id: l02, title: { nl: Als en ook }, vocab: [en.if, en.as, en.as-as, en.also, en.actually, en.instead] }
  - { id: l03, title: { nl: Misschien }, vocab: [en.might, en.should, en.will, en.perhaps, en.quite, en.just] }
  - { id: l04, title: { nl: Plotseling }, vocab: [en.still, en.suddenly, en.usually, en.while, en.next, en.happen] }
  - { id: l05, title: { nl: "Graag gedaan, het is warm" }, vocab: [en.of-course, en.no-problem, en.you-re-welcome, en.if-you-want, en.warm] }
