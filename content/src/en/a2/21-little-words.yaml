  - { target: as … as, native: { nl: "even … als" }, pos: phrase }
  - { target: also, native: { nl: ook }, pos: adverb }
  - { target: actually, native: { nl: eigenlijk }, pos: adverb }
  - { target: instead, native: { nl: in plaats daarvan }, pos: adverb }
