id: en-b2-u17
title: { nl: "Regels, rechten en de wet" }
icon: law
topic: Laws and rights, crime and justice (without violence), rules for young people, democracy; the impersonal passive (It is said that …, He is believed to …) and be supposed to
vocabulary:
  - { target: legal, native: { nl: "wettelijk, legaal" }, pos: adjective, avoid: [en.illegal] }
  - { target: illegal, native: { nl: illegaal }, pos: adjective, avoid: [en.legal] }
  - { target: trial, native: { nl: "proces (in de rechtbank)" }, pos: noun }
  - { target: jury, native: { nl: jury }, pos: noun, noBlank: true }
  - { target: witness, native: { nl: getuige }, pos: noun }
  - { target: evidence, native: { nl: bewijs }, pos: noun }
  - { target: innocent, native: { nl: onschuldig }, pos: adjective, avoid: [en.guilty] }
  - { target: commit, native: { nl: "plegen (een misdaad)" }, pos: verb }
  - { target: punishment, native: { nl: straf }, pos: noun }
  - { target: investigate, native: { nl: onderzoeken }, pos: verb }
  - { target: suspect, native: { nl: verdachte }, pos: noun }
  - { target: victim, native: { nl: slachtoffer }, pos: noun }
  - { target: theft, native: { nl: diefstal }, pos: noun }
  - { target: vandalism, native: { nl: vandalisme }, pos: noun, noBlank: true }
  - { target: offence, native: { nl: "overtreding, misdrijf" }, pos: noun }
  - { target: regulation, native: { nl: "voorschrift, regel" }, pos: noun }
  - { target: obey, native: { nl: gehoorzamen }, pos: verb }
