  - { target: freedom, native: { nl: vrijheid }, pos: noun }
  - { target: democracy, native: { nl: democratie }, pos: noun, noBlank: true }
  - { target: parliament, native: { nl: parlement }, pos: noun, noBlank: true }
  - { target: minister, native: { nl: minister }, pos: noun, noBlank: true }
  - { target: policy, native: { nl: beleid }, pos: noun }
  - { target: curfew, native: { nl: "avondklok, uur waarop je thuis moet zijn" }, pos: noun }
  - { target: prohibit, native: { nl: verbieden }, pos: verb, avoid: [en.ban] }
  - { target: CCTV, native: { nl: "camerabewaking" }, pos: noun }
