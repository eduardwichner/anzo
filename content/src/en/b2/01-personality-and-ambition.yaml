id: en-b2-u01
title: { nl: Karakter en ambitie }
icon: star
topic: Personality, talent and ambition, coping with setbacks; the present perfect continuous (has been -ing for / since)
vocabulary:
  - { target: ambitious, native: { nl: ambitieus }, pos: adjective }
  - { target: determined, native: { nl: "vastberaden, vastbesloten" }, pos: adjective }
  - { target: determination, native: { nl: vastberadenheid }, pos: noun }
  - { target: scholarship, native: { nl: "studiebeurs" }, pos: noun }
  - { target: enrol, native: { nl: "zich inschrijven (voor een cursus of school)" }, pos: verb }
  - { target: gifted, native: { nl: "begaafd, getalenteerd" }, pos: adjective, avoid: [en.talented] }
  - { target: confidence, native: { nl: "zelfvertrouwen, vertrouwen" }, pos: noun }
  - { target: personality, native: { nl: persoonlijkheid }, pos: noun }
  - { target: sensitive, native: { nl: gevoelig }, pos: adjective }
  - { target: stubborn, native: { nl: koppig }, pos: adjective }
  - { target: modest, native: { nl: bescheiden }, pos: adjective }
  - { target: outgoing, native: { nl: "extravert, open" }, pos: adjective, avoid: [en.sociable] }
  - { target: impatient, native: { nl: ongeduldig }, pos: adjective }
  - { target: motivated, native: { nl: gemotiveerd }, pos: adjective }
  - { target: motivation, native: { nl: motivatie }, pos: noun }
  - { target: failure, native: { nl: "mislukking, falen" }, pos: noun }
  - { target: cope, native: { nl: "het aankunnen, omgaan met (+ with)" }, pos: verb }
  - { target: struggle, native: { nl: "worstelen, moeite hebben (met)" }, pos: verb }
  - { target: overcome, native: { nl: overwinnen }, pos: verb }
  - { target: by chance, native: { nl: "toevallig, bij toeval" }, pos: phrase, noBlank: true }
  - { target: audition, native: { nl: auditie }, pos: noun }
  - { target: role model, native: { nl: "rolmodel, voorbeeld" }, pos: noun }
  - { target: potential, native: { nl: "potentieel, mogelijkheden" }, pos: noun }
  - { target: passion, native: { nl: passie }, pos: noun }
