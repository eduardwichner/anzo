id: en-b2-u10
title: { nl: Klimaat en milieu }
icon: leaf
topic: Climate change and its causes, extreme weather, plastic and waste, protest and campaigns; the third conditional (If we had acted earlier, … would have …)
vocabulary:
  - { target: greenhouse gas, native: { nl: broeikasgas }, pos: noun }
  - { target: carbon, native: { nl: koolstof }, pos: noun }
  - { target: emissions, native: { nl: "uitstoot" }, pos: noun }
  - { target: carbon footprint, native: { nl: "CO2-voetafdruk, koolstofvoetafdruk" }, pos: noun }
  - { target: fossil fuels, native: { nl: "fossiele brandstoffen" }, pos: noun }
  - { target: coal, native: { nl: steenkool }, pos: noun }
  - { target: pollute, native: { nl: vervuilen }, pos: verb }
  - { target: eco-friendly, native: { nl: milieuvriendelijk }, pos: adjective }
  - { target: reuse, native: { nl: hergebruiken }, pos: verb, avoid: [en.recycle] }
  - { target: single-use, native: { nl: "wegwerp-, voor eenmalig gebruik" }, pos: adjective }
  - { target: biodegradable, native: { nl: "biologisch afbreekbaar" }, pos: adjective }
  - { target: landfill, native: { nl: "vuilnisbelt, stortplaats" }, pos: noun }
  - { target: drought, native: { nl: droogte }, pos: noun }
  - { target: heatwave, native: { nl: hittegolf }, pos: noun }
  - { target: extreme, native: { nl: extreem }, pos: adjective, noBlank: true }
  - { target: sea level, native: { nl: zeespiegel }, pos: noun }
  - { target: melt, native: { nl: smelten }, pos: verb }
  - { target: glacier, native: { nl: gletsjer }, pos: noun }
  - { target: deforestation, native: { nl: ontbossing }, pos: noun }
  - { target: biodiversity, native: { nl: biodiversiteit }, pos: noun, noBlank: true }
  - { target: protest, native: { nl: "protesteren" }, pos: verb }
  - { target: campaign, native: { nl: "campagne, actie" }, pos: noun, noBlank: true }
  - { target: activist, native: { nl: "activist, actievoerder" }, pos: noun }
  - { target: ban, native: { nl: "verbieden; verbod" }, pos: verb }
  - { target: impact, native: { nl: "invloed, impact" }, pos: noun }
  - { target: threat, native: { nl: bedreiging }, pos: noun }
  - { target: threaten, native: { nl: bedreigen }, pos: verb }
