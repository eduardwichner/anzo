  - { target: compulsory, native: { nl: verplicht }, pos: adjective, avoid: [en.optional] }
  - { target: optional, native: { nl: "keuze-, niet verplicht" }, pos: adjective, avoid: [en.compulsory] }
  - { target: plagiarism, native: { nl: plagiaat }, pos: noun }
  - { target: assess, native: { nl: "beoordelen, evalueren" }, pos: verb }
  - { target: assessment, native: { nl: "beoordeling, evaluatie" }, pos: noun }
  - { target: feedback, native: { nl: feedback }, pos: noun, noBlank: true }
  - { target: mentor, native: { nl: mentor }, pos: noun, noBlank: true }
