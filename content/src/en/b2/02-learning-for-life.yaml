  - { target: keep up with, native: { nl: "bijhouden, bijbenen" }, pos: phrase }
  - { target: drop out, native: { nl: "afhaken, stoppen met een opleiding" }, pos: phrase }
  - { target: broaden, native: { nl: verbreden }, pos: verb }
