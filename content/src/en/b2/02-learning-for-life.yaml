id: en-b2-u02
title: { nl: Een leven lang leren }
icon: school
topic: Studying effectively, assignments and deadlines, feedback, online and classroom learning; verbs with the gerund or the infinitive (avoid doing, decide to do, stop doing / to do, remember doing / to do)
vocabulary:
  - { target: lifelong, native: { nl: levenslang }, pos: adjective }
  - { target: assignment, native: { nl: "opdracht, taak (voor school)" }, pos: noun }
  - { target: deadline, native: { nl: deadline }, pos: noun, noBlank: true }
  - { target: memorise, native: { nl: "uit het hoofd leren" }, pos: verb }
  - { target: concentration, native: { nl: concentratie }, pos: noun }
  - { target: distraction, native: { nl: afleiding }, pos: noun }
