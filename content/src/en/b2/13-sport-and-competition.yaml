id: en-b2-u13
title: { nl: Sport en competitie }
icon: sport
topic: Competing and winning, fair play, training and tactics, chess as a sport; modals of deduction about the past (must have, can't have, might have)
vocabulary:
  - { target: opponent, native: { nl: tegenstander }, pos: noun, avoid: [en.rival] }
  - { target: referee, native: { nl: scheidsrechter }, pos: noun }
  - { target: spectator, native: { nl: toeschouwer }, pos: noun, avoid: [en.supporter] }
  - { target: athletic, native: { nl: "atletisch, sportief" }, pos: adjective }
  - { target: amateur, native: { nl: amateur }, pos: adjective, noBlank: true }
  - { target: competitive, native: { nl: "competitief, prestatiegericht" }, pos: adjective }
  - { target: rival, native: { nl: "rivaal" }, pos: noun, avoid: [en.opponent] }
  - { target: rivalry, native: { nl: rivaliteit }, pos: noun }
  - { target: victory, native: { nl: overwinning }, pos: noun }
  - { target: medal, native: { nl: medaille }, pos: noun }
  - { target: trophy, native: { nl: trofee }, pos: noun }
  - { target: tactic, native: { nl: tactiek }, pos: noun, avoid: [en.strategy] }
  - { target: strategy, native: { nl: strategie }, pos: noun, avoid: [en.tactic] }
  - { target: endurance, native: { nl: "uithoudingsvermogen" }, pos: noun, avoid: [en.stamina] }
  - { target: sportsmanship, native: { nl: "sportiviteit" }, pos: noun }
  - { target: fair play, native: { nl: "eerlijk spel, fair play" }, pos: noun, noBlank: true }
  - { target: keep fit, native: { nl: "fit blijven" }, pos: phrase, noBlank: true }
  - { target: outcome, native: { nl: "uitslag, afloop" }, pos: noun, noBlank: true }
  - { target: underdog, native: { nl: "de zwakkere partij (die niet verwacht wordt te winnen)" }, pos: noun }
  - { target: cheer, native: { nl: "juichen, aanmoedigen" }, pos: verb }
  - { target: calculate, native: { nl: berekenen }, pos: verb }
  - { target: sponsor, native: { nl: sponsor }, pos: noun, noBlank: true }
