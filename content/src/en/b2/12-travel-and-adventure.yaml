  - { target: overland, native: { nl: "over land" }, pos: adverb }
  - { target: summit, native: { nl: "top (van een berg)" }, pos: noun, avoid: [en.peak] }
  - { target: trail, native: { nl: "pad, wandelpad" }, pos: noun, avoid: [en.path] }
  - { target: mist, native: { nl: "nevel, mist" }, pos: noun, avoid: [en.fog] }
