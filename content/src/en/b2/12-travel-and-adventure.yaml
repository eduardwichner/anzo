id: en-b2-u12
title: { nl: Reizen en avontuur }
icon: travel
topic: Planning trips, travel problems, adventure in the mountains, culture shock and homesickness; narrative tenses (past continuous, past perfect, past perfect continuous)
vocabulary:
  - { target: itinerary, native: { nl: "reisplan, reisschema" }, pos: noun }
  - { target: landmark, native: { nl: "bezienswaardigheid, herkenningspunt" }, pos: noun }
