questions:
  - { id: en-b2-t18-q1, type: summary, options: ["Fleming discovered penicillin by chance when mould killed bacteria in a dish, but it took years and other researchers before it saved millions of lives.", "Fleming planned a long series of careful experiments for years, and he finally invented penicillin in his London laboratory, which saved millions of lives at once.", "Fleming lost his discovery during his holiday because someone cleaned his laboratory while he was away."], correct: 0 }
  - { id: en-b2-t18-q2, type: mc, question: "What did Fleming notice when he came back from holiday?", options: ["The bacteria around the mould had died.", "Someone had cleaned his dishes.", "The mould had disappeared."], correct: 0 }
  - { id: en-b2-t18-q3, type: true_false_notgiven, statement: "Fleming worked in a large laboratory with many assistants.", answer: false }
  - { id: en-b2-t18-q4, type: true_false_notgiven, statement: "Fleming's holiday lasted two weeks.", answer: not_given }
  - { id: en-b2-t18-q5, type: true_false_notgiven, statement: "For more than ten years after Fleming's discovery, little happened.", answer: true }
listeningQuestions:
