id: en-b2-t17
kind: reading
title: { nl: Moeten zestienjarigen kunnen stemmen? }
topic: Rules, rights and the law (an article on a news website for young people)
level: B2
paragraphs:
  - - { id: en-b2-t17-s01, target: "In most countries you have to be eighteen to vote, but a growing number of people think that age is too high.", native: { nl: "In de meeste landen moet je achttien zijn om te stemmen, maar steeds meer mensen vinden die leeftijd te hoog." } }
    - { id: en-b2-t17-s02, target: "In Austria and Scotland, sixteen-year-olds can already vote in some elections, and other countries are considering the same reform.", native: { nl: "In Oostenrijk en Schotland kunnen zestienjarigen al bij sommige verkiezingen stemmen, en andere landen overwegen dezelfde hervorming." } }
  - - { id: en-b2-t17-s13, target: "Those in favour have several arguments.", native: { nl: "De voorstanders hebben verschillende argumenten." } }
    - { id: en-b2-t17-s03, target: "At sixteen you can work, pay taxes and in some countries even get married, so why shouldn't you have a say in the laws that affect your life?", native: { nl: "Op je zestiende kun je werken, belastingen betalen en in sommige landen zelfs trouwen, dus waarom zou je niets te zeggen hebben over de wetten die je leven beïnvloeden?" } }
    - { id: en-b2-t17-s04, target: "Decisions about the climate, education and housing will affect young people for longer than anyone else.", native: { nl: "Beslissingen over het klimaat, onderwijs en huisvesting zullen jongeren langer treffen dan wie ook." } }
    - { id: en-b2-t17-s05, target: "Studies also suggest that people who vote at a young age are more likely to keep voting all their lives.", native: { nl: "Studies wijzen er ook op dat mensen die op jonge leeftijd stemmen, meer kans hebben om hun hele leven te blijven stemmen." } }
  - - { id: en-b2-t17-s06, target: "Not everyone agrees, however.", native: { nl: "Niet iedereen is het daarmee eens." } }
    - { id: en-b2-t17-s07, target: "Critics argue that most sixteen-year-olds are not mature enough and know too little about politics.", native: { nl: "Critici beweren dat de meeste zestienjarigen niet volwassen genoeg zijn en te weinig over politiek weten." } }
    - { id: en-b2-t17-s08, target: "They also point out that young people are supposed to be protected by the law, not to make it.", native: { nl: "Ze wijzen er ook op dat jongeren door de wet beschermd horen te worden, niet dat ze die wet zelf maken." } }
    - { id: en-b2-t17-s09, target: "Some fear that teenagers would simply vote the same way as their parents.", native: { nl: "Sommigen vrezen dat tieners gewoon hetzelfde zouden stemmen als hun ouders." } }
  - - { id: en-b2-t17-s10, target: "What does the evidence say?", native: { nl: "Wat zegt het bewijs?" } }
    - { id: en-b2-t17-s11, target: "In Austria, where sixteen-year-olds have voted since 2007, researchers found that young voters were just as interested in politics as older first-time voters.", native: { nl: "In Oostenrijk, waar zestienjarigen sinds 2007 stemmen, stelden onderzoekers vast dat jonge kiezers even geïnteresseerd waren in politiek als oudere kiezers die voor het eerst stemden." } }
    - { id: en-b2-t17-s12, target: "Many schools there now spend more time teaching students how parliament works, which is said to have made young people more confident about voting.", native: { nl: "Veel scholen daar besteden nu meer tijd aan uitleggen hoe het parlement werkt, wat jongeren naar verluidt meer vertrouwen heeft gegeven om te stemmen." } }
