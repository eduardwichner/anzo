questions:
  - { id: en-b2-t17-q1, type: summary, options: ["The article presents arguments for and against letting sixteen-year-olds vote and looks at what happened in Austria, where they already can.", "The article explains why sixteen-year-olds in Austria have lost the right to vote that they had since 2007.", "The article argues that young people should not be allowed to vote because they are not interested in politics."], correct: 0 }
  - { id: en-b2-t17-q2, type: mc, question: "What did researchers in Austria find?", options: ["Young voters were as interested in politics as older first-time voters.", "Most young voters voted the same way as their parents.", "Few sixteen-year-olds actually voted."], correct: 0 }
  - { id: en-b2-t17-q3, type: true_false_notgiven, statement: "Sixteen-year-olds can vote in some elections in Scotland.", answer: true }
