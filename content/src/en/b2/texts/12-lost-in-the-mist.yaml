  - { id: en-b2-t12-q1, type: summary, options: ["The writer and the writer's brother got lost in the mist in the mountains, but the brother used an old compass, and they found a hut before dark.", "The writer and the writer's brother got lost in the mountains and had to spend the night outside until rescuers found them the next morning.", "The writer and the writer's brother argue about whether to use a phone or a compass to plan their walk in the mountains."], correct: 0 }
  - { id: en-b2-t12-q2, type: mc, question: "Why couldn't the writer use the map on the phone?", options: ["The battery was empty.", "There was no signal.", "The phone had fallen on the rocks."], correct: 0 }
