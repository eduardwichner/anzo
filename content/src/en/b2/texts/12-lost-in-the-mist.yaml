id: en-b2-t12
kind: reading
title: { nl: Verdwaald in de nevel }
topic: Travel and adventure (a story for a writing competition)
level: B2
paragraphs:
  - - { id: en-b2-t12-s01, target: "We had been walking for almost five hours when the mist came down.", native: { nl: "We waren al bijna vijf uur aan het wandelen toen de nevel neerdaalde." } }
    - { id: en-b2-t12-s02, target: "One minute we could see the whole valley below us; the next, I could hardly see my brother, who was only a few metres ahead of me.", native: { nl: "Het ene moment konden we de hele vallei onder ons zien; het volgende kon ik mijn broer, die maar een paar meter voor me liep, nauwelijks zien." } }
    - { id: en-b2-t12-s03, target: "\"Stay close,\" he said. \"The trail goes left here.\"", native: { nl: "\"Blijf dichtbij,\" zei hij. \"Het pad gaat hier naar links.\"" } }
  - - { id: en-b2-t12-s04, target: "But after twenty minutes there was no trail any more.", native: { nl: "Maar na twintig minuten was er geen pad meer." } }
    - { id: en-b2-t12-s05, target: "The ground had become steep and slippery, and every rock looked the same.", native: { nl: "De grond was steil en glad geworden, en elke rots zag er hetzelfde uit." } }
    - { id: en-b2-t12-s06, target: "I took out my phone to check the map, but the battery had died hours earlier, because I had been taking photos all morning.", native: { nl: "Ik haalde mijn telefoon tevoorschijn om op de kaart te kijken, maar de batterij was uren eerder leeg geraakt, omdat ik de hele ochtend foto's had genomen." } }
    - { id: en-b2-t12-s07, target: "I felt the panic rising in my chest.", native: { nl: "Ik voelde de paniek in mijn borst opkomen." } }
  - - { id: en-b2-t12-s08, target: "My brother, however, stayed calm.", native: { nl: "Mijn broer bleef echter kalm." } }
    - { id: en-b2-t12-s09, target: "He took out an old compass, which our grandfather had given him years before, and studied it carefully.", native: { nl: "Hij haalde een oud kompas tevoorschijn, dat onze opa hem jaren eerder had gegeven, en bestudeerde het aandachtig." } }
    - { id: en-b2-t12-s10, target: "\"The hut is to the south,\" he said. \"If we walk slowly and stay together, we'll find it.\"", native: { nl: "\"De hut ligt in het zuiden,\" zei hij. \"Als we langzaam lopen en bij elkaar blijven, vinden we hem.\"" } }
  - - { id: en-b2-t12-s11, target: "It was the longest hour of my life.", native: { nl: "Het was het langste uur van mijn leven." } }
    - { id: en-b2-t12-s12, target: "We shouted from time to time and listened to the echo, hoping someone would answer.", native: { nl: "Af en toe riepen we en luisterden we naar de echo, in de hoop dat iemand zou antwoorden." } }
    - { id: en-b2-t12-s13, target: "Then, just as it was getting dark, a light appeared through the mist, and a dog started barking.", native: { nl: "Toen, net toen het donker werd, verscheen er een licht door de nevel, en begon er een hond te blaffen." } }
  - - { id: en-b2-t12-s14, target: "We had reached the hut at last.", native: { nl: "Eindelijk hadden we de hut bereikt." } }
    - { id: en-b2-t12-s15, target: "The family who ran it gave us hot soup and dry socks, and nobody said a word about how foolish we had been.", native: { nl: "Het gezin dat de hut uitbaatte, gaf ons warme soep en droge sokken, en niemand zei een woord over hoe dwaas we geweest waren." } }
    - { id: en-b2-t12-s16, target: "Since that day I have never gone into the mountains without a paper map and a compass of my own.", native: { nl: "Sinds die dag ben ik nooit meer de bergen in gegaan zonder papieren kaart en een eigen kompas." } }
