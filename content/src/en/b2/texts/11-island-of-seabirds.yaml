  - { id: en-b2-t11-q1, type: summary, options: ["A researcher who counts birds on a small island has seen their number fall by almost half, mainly because the fish they eat are moving north.", "A researcher who counts birds on a small island has seen their number almost double, mainly because tourists have not been allowed on the island since last year.", "A researcher explains why she would like more people to come and live on the island where the birds breed."], correct: 0 }
  - { id: en-b2-t11-q2, type: mc, question: "Why do many young birds not survive?", options: ["Their parents cannot find enough food near the island.", "Predators eat them.", "The winters are too cold."], correct: 0 }
