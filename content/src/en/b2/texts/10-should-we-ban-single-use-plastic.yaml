id: en-b2-t10
kind: reading
title: { nl: Moeten we wegwerpplastic verbieden? }
topic: Climate and environment (a student's essay for a writing competition)
level: B2
paragraphs:
  - - { id: en-b2-t10-s01, target: "Every minute, the equivalent of a lorry full of plastic ends up in the ocean.", native: { nl: "Elke minuut belandt het equivalent van een vrachtwagen vol plastic in de oceaan." } }
    - { id: en-b2-t10-s02, target: "Much of it is single-use: bottles, cups and bags that we use for a few minutes and that take hundreds of years to break down.", native: { nl: "Veel daarvan is wegwerpplastic: flessen, bekers en zakjes die we een paar minuten gebruiken en die honderden jaren nodig hebben om af te breken." } }
    - { id: en-b2-t10-s03, target: "Should governments simply ban it?", native: { nl: "Moeten regeringen het gewoon verbieden?" } }
  - - { id: en-b2-t10-s04, target: "There are strong arguments for a ban.", native: { nl: "Er zijn sterke argumenten voor een verbod." } }
    - { id: en-b2-t10-s05, target: "Plastic in the sea threatens fish and birds, and tiny pieces of it have been found in our food and even in our blood.", native: { nl: "Plastic in de zee bedreigt vissen en vogels, en piepkleine stukjes ervan zijn in ons eten en zelfs in ons bloed gevonden." } }
    - { id: en-b2-t10-s06, target: "Countries that have banned plastic bags have seen their use fall by more than eighty per cent in a few years.", native: { nl: "Landen die plastic zakjes hebben verboden, zagen het gebruik ervan in een paar jaar met meer dan tachtig procent dalen." } }
  - - { id: en-b2-t10-s07, target: "However, a ban is not a perfect solution.", native: { nl: "Een verbod is echter geen perfecte oplossing." } }
    - { id: en-b2-t10-s08, target: "Some alternatives, such as paper bags, need more energy to produce, and they are not always reused.", native: { nl: "Sommige alternatieven, zoals papieren zakken, hebben meer energie nodig om te maken, en ze worden niet altijd hergebruikt." } }
    - { id: en-b2-t10-s09, target: "For people with certain disabilities, plastic straws are a necessity rather than a luxury.", native: { nl: "Voor mensen met bepaalde beperkingen zijn plastic rietjes eerder een noodzaak dan een luxe." } }
  - - { id: en-b2-t10-s10, target: "In my view, a ban should be only one part of the answer.", native: { nl: "Volgens mij zou een verbod maar één deel van het antwoord moeten zijn." } }
    - { id: en-b2-t10-s11, target: "Companies should be made to pay for the waste they produce, and shops should make it easy to bring your own cup or bag.", native: { nl: "Bedrijven zouden verplicht moeten worden te betalen voor het afval dat ze produceren, en winkels zouden het makkelijk moeten maken om je eigen beker of tas mee te brengen." } }
    - { id: en-b2-t10-s12, target: "If we had started doing this twenty years ago, far less plastic would have ended up on our beaches.", native: { nl: "Als we hier twintig jaar geleden mee begonnen waren, zou er veel minder plastic op onze stranden terechtgekomen zijn." } }
  - - { id: en-b2-t10-s13, target: "In conclusion, the problem is too urgent to wait.", native: { nl: "Kortom, het probleem is te dringend om te wachten." } }
    - { id: en-b2-t10-s14, target: "A ban on the worst single-use products, together with better recycling and a change in our habits, would have a real impact.", native: { nl: "Een verbod op de ergste wegwerpproducten, samen met beter recycleren en een verandering in onze gewoonten, zou echt een verschil maken." } }
