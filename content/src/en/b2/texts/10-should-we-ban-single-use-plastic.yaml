  - { id: en-b2-t10-q1, type: summary, options: ["The writer agrees that single-use plastic is a serious problem but thinks a ban should go together with other ideas, such as making companies pay.", "The writer agrees that plastic is a problem but thinks it should never be banned, because paper and other alternatives are even worse for the planet.", "The writer describes a beach-cleaning day organised by students to remove plastic from the ocean."], correct: 0 }
  - { id: en-b2-t10-q2, type: mc, question: "Why are paper bags not a perfect solution, according to the writer?", options: ["They need more energy to produce.", "They are more expensive than plastic.", "They break too easily."], correct: 0 }
  - { id: en-b2-t10-q3, type: true_false_notgiven, statement: "Pieces of plastic have been found in human blood.", answer: true }
  - { id: en-b2-t10-q4, type: true_false_notgiven, statement: "The writer thinks a ban alone would solve the problem.", answer: false }
  - { id: en-b2-t10-q5, type: true_false_notgiven, statement: "Some alternatives to plastic need more energy to produce.", answer: true }
  - { id: en-b2-t10-q6, type: match_heading, paragraph: 3, options: ["The problems with a ban", "Reasons to ban plastic", "The writer's own view"], correct: 0 }
