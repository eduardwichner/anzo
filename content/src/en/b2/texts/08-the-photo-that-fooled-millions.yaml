questions:
  - { id: en-b2-t08-q1, type: summary, options: ["A fake photo was shared by millions and even published by news websites, which shows how strong feelings make us believe stories and why we should check sources.", "A real photo of a shark on a flooded motorway was wrongly called fake by several news websites, which later had to apologise to the photographer and his readers.", "News websites have decided to stop publishing photos from social media after a fake picture of a shark went viral."], correct: 0 }
  - { id: en-b2-t08-q2, type: mc, question: "Why do people share sensational pictures so quickly?", options: ["They make us feel something strongly, so we share them before we think.", "News websites pay people to share them.", "They are always shared by famous influencers."], correct: 0 }
  - { id: en-b2-t08-q3, type: true_false_notgiven, statement: "The photo was taken by a well-known photographer.", answer: not_given }
  - { id: en-b2-t08-q4, type: true_false_notgiven, statement: "One editor said that the source had been checked carefully.", answer: false }
  - { id: en-b2-t08-q5, type: true_false_notgiven, statement: "The writer thinks you should never trust anything online.", answer: false }
  - { id: en-b2-t08-q6, type: match_heading, paragraph: 4, options: ["Three questions to ask", "Why we believe it", "What the websites said"], correct: 0 }
