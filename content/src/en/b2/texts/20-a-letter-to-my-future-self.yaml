  - { id: en-b2-t20-q1, type: summary, options: ["A sixteen-year-old writes to their future self in ten years about their hopes, the things they want to keep, their worries about the climate and some advice.", "A sixteen-year-old writes to a teacher to explain why they do not want to think about the future at all, and why the letter is a waste of time.", "A twenty-six-year-old writes back to the person they were at sixteen about their job as a vet."], correct: 0 }
