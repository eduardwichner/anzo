questions:
  - { id: en-b2-t04-q1, type: summary, options: ["Paying by card or phone makes it harder to feel how much we spend, so young people often run out of money, but a few simple habits can help.", "Paying by card or phone is dangerous because criminals can easily steal your money online, so the advisers say young people should always pay with cash.", "Young people today are better with money than their parents, because they check their bank account on their phone every day."], correct: 0 }
  - { id: en-b2-t04-q2, type: mc, question: "Why do people who pay with cash usually spend less?", options: ["Handing over notes feels like losing something.", "Shops give a discount for cash payments.", "Cash payments take longer at the till."], correct: 0 }
  - { id: en-b2-t04-q3, type: true_false_notgiven, statement: "Almost half of the young people in the survey had run out of money at least once before the end of the month.", answer: true }
  - { id: en-b2-t04-q4, type: true_false_notgiven, statement: "Most young people in the survey had a part-time job.", answer: not_given }
  - { id: en-b2-t04-q5, type: true_false_notgiven, statement: "The advisers say you should save what is left at the end of the month.", answer: false }
