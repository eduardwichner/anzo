id: en-b2-u09
title: { nl: Uitvindingen en technologie }
icon: tech
topic: Inventions and inventors, devices, artificial intelligence and automation, online security; the passive in all tenses (is being developed, has been invented, will be replaced)
vocabulary:
  - { target: device, native: { nl: "apparaat, toestel" }, pos: noun, avoid: [en.gadget] }
  - { target: gadget, native: { nl: "snufje, handig apparaatje" }, pos: noun, avoid: [en.device] }
  - { target: prototype, native: { nl: prototype }, pos: noun, noBlank: true }
  - { target: ingenious, native: { nl: "vernuftig, ingenieus" }, pos: adjective }
  - { target: innovation, native: { nl: "vernieuwing, innovatie" }, pos: noun }
  - { target: innovative, native: { nl: "vernieuwend, innovatief" }, pos: adjective, avoid: [en.cutting-edge] }
  - { target: breakthrough, native: { nl: doorbraak }, pos: noun }
  - { target: artificial intelligence, native: { nl: "kunstmatige intelligentie" }, pos: noun }
  - { target: automation, native: { nl: automatisering }, pos: noun }
  - { target: algorithm, native: { nl: algoritme }, pos: noun, noBlank: true }
  - { target: upgrade, native: { nl: "upgraden, bijwerken (naar een nieuwere versie)" }, pos: verb, avoid: [en.catch-up], noBlank: true }
  - { target: wireless, native: { nl: draadloos }, pos: adjective }
  - { target: user-friendly, native: { nl: gebruiksvriendelijk }, pos: adjective }
  - { target: virtual, native: { nl: virtueel }, pos: adjective, noBlank: true }
  - { target: patent, native: { nl: "octrooi, patent" }, pos: noun }
  - { target: manufacture, native: { nl: "vervaardigen, produceren" }, pos: verb }
  - { target: mechanism, native: { nl: mechanisme }, pos: noun, noBlank: true }
  - { target: solar, native: { nl: "zonne-" }, pos: adjective }
  - { target: renewable, native: { nl: "hernieuwbaar" }, pos: adjective }
  - { target: cutting-edge, native: { nl: "allernieuwste, ultramodern" }, pos: adjective, avoid: [en.innovative], noBlank: true }
  - { target: obsolete, native: { nl: "verouderd, in onbruik" }, pos: adjective, avoid: [en.outdated] }
  - { target: outdated, native: { nl: "verouderd, achterhaald" }, pos: adjective, avoid: [en.obsolete] }
